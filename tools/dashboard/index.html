<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마케팅 OS 대시보드</title>
<style>
  /* =====================================================================
     마케팅 OS 대시보드 · 이 회사 Design System
     토큰 정본: claude.ai/design "마케팅 OS 대시보드 UI 목업"
       → _ds/내 디자인 시스템-.../colors_and_type.css
     핸드오프 스펙: design_handoff_marketing_os_dashboard/README.md

     구현 원칙 (핸드오프 지시)
       · 빌드 없는 단일 HTML + 바닐라 JS (React·번들러 도입 안 함)
       · 서버 계약은 기존 server.mjs 그대로 (x-dashboard-token 헤더)
       · Lucide CDN 대신 인라인 SVG — 이 대시보드는 외부 요청이 0이어야 한다
         (로컬 전용·오프라인에서도 아이콘이 깨지지 않게)
       · 기호 금지: 가운뎃점·화살표·일시정지·원문자·물결표를 UI 문구에 쓰지 않는다
       · word-break:keep-all 로 단어 쪼개짐 방지
     ===================================================================== */
  /* ── 색 · 뜻 하나에 색 하나 (2026-08-03 정리 · 고유색 52 → 24) ────────────
     ① 중립 6 (먹·회색·종이·선)  ② 상태 4 (진행·확인·막힘·끝남) 각 점/글자/배경
     ③ 강조 1 (형광 · 내가 움직여야 하는 자리에만)  ④ 팀 색 8 (TEAM_TONES · 팀 구분 전용)
     ⑤ 어두운 면 위 글자 3 (사이드바·먹색 카드)
     같은 뜻에 색을 새로 만들지 않는다. 없으면 여기에 추가하고 이름으로 부른다. */
  /* ══ 색 · 메인 5 + 포인트 1 (2026-08-03 · 이 회사 디자인 시스템 기준) ══════
     메인   잉크 #2A2A28 · 회색 #747264 · 종이 #F3F3F2 · 흰 #FFFFFF · 모래 #E0CCBE
     포인트 형광 #EBFF2C — **내가 움직여야 하는 자리에만**
     나머지는 전부 이 여섯의 **명도 변형**이다. 새 색상(hue)을 만들지 않는다.
     상태도 색을 늘리지 않고 이렇게 표현한다:
       진행 중 = 형광 점    확인 차례 = 형광 배경    막힘 = 먹색 반전    끝남 = 회색
     팀 구분도 모래·회색의 명도 8단계로만 낸다 (색상은 하나). */
  :root {
    /* 메인 5 */
    --ink:#2A2A28; --olive:#747264; --paper:#F3F3F2; --card:#FFFFFF; --sand:#E0CCBE;
    /* 포인트 1 */
    --highlight:#EBFF2C;
    /* 메인의 명도 변형 (새 색이 아니다) */
    --ink-soft:#3C3633; --ink-muted:#444444; --fade:#AFAFAC; --line:#EBEBEB; --paper-warm:#EEEDEB;
    --sand-deep:#8A6B4F; --sand-bg:#FAF6F2; --sand-line:#EFE6DE;
    /* 상태 · 색이 아니라 위 여섯의 조합으로 (이름은 뜻으로 부른다) */
    --live:var(--ink);        --live-fg:var(--ink);       --live-bg:var(--paper-warm);
    --wait:var(--sand);       --wait-fg:var(--sand-deep); --wait-bg:var(--sand-bg);
    --warn:var(--ink);        --warn-fg:var(--ink);       --warn-bg:var(--paper-warm);
    --rest:var(--fade);       --rest-fg:var(--olive);     --rest-bg:var(--paper);
    /* 어두운 면 위 (사이드바 · 먹색 카드) */
    --on-dark:rgba(255,255,255,.86); --on-dark-sub:rgba(255,255,255,.52); --on-dark-line:rgba(255,255,255,.10);
    --on-dark-warn:var(--highlight); --on-dark-live:var(--card);
    --on-dark-fill:rgba(255,255,255,.14);
    --nav-on:var(--on-dark-fill); --nav-off:var(--on-dark-sub); --dark-sub:var(--on-dark-sub);
    --dark-btn:var(--on-dark-fill); --dark-btn-line:rgba(255,255,255,.22); --cool:var(--on-dark-line);
    --sand-text:var(--sand-deep);
    --r-xs:5px; --r-sm:10px; --r-md:13px; --r-xl:30px; --r-pill:999px;
    --sh-1:0 1px 2px rgba(0,0,0,.04); --sh-3:0 10px 30px rgba(0,0,0,.15);
    --font:"Pretendard","Apple SD Gothic Neo","Manrope",system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *,*::before,*::after { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:var(--font); font-size:16px; word-break:keep-all;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  a { color:var(--ink); text-decoration:none; }
  a:hover { color:var(--olive); }
  button { font-family:inherit; }
  @keyframes pulse { 50% { opacity:.35; } }
  /* 업무 여정 · 진행 중 간선을 따라 점이 흐른다 (참고자료 Graph Engineering 방식) */
  @keyframes livePulse { 0% { box-shadow:0 0 0 0 rgba(235,255,44,.95); } 70% { box-shadow:0 0 0 7px rgba(235,255,44,0); } 100% { box-shadow:0 0 0 0 rgba(235,255,44,0); } }
  /* 지금 일하는 중 · 먹색 점에 형광 링이 번진다 (형광만으로는 흰 배경에서 옅다 · 2026-08-03) */
  .live-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--ink); flex:none;
    animation:livePulse 1.6s ease-out infinite, pulse 1.6s ease-in-out infinite; }
  .live-dot.sm { width:8px; height:8px; }
  .live-dot.lg { width:12px; height:12px; }

  /* 디자인 시스템 프리미티브 (값은 토큰 정본과 동일) */
  .c { background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--sh-1); }
  .c-sand { background:var(--card); border:1.5px solid var(--sand); border-radius:var(--r-md); }
  .c-warn { background:var(--warn-bg); border:1.5px solid var(--warn); border-radius:var(--r-md); }
  .c-ink { background:var(--ink); color:var(--paper); border-radius:var(--r-md); }
  .c-sel { background:var(--card); border:1.5px solid var(--ink); border-radius:var(--r-md); }
  .b { background:var(--ink); color:var(--card); border:none; border-radius:var(--r-xs);
    padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .b:hover { background:var(--ink-soft); }
  .b:active { transform:translateY(1px); }
  .b:disabled { opacity:.5; cursor:default; }
  .b-g { background:var(--paper); color:var(--ink); border:1px solid var(--line); border-radius:var(--r-xs);
    padding:10px 16px; font-size:14px; font-weight:500; cursor:pointer; white-space:nowrap; }
  .b-g:hover { background:var(--paper-warm); }
  .b-s { padding:8px 15px; font-size:13.5px; }
  .b-dark { background:var(--dark-btn); color:var(--card); border:1px solid var(--dark-btn-line); border-radius:var(--r-xs);
    padding:8px 15px; font-size:13.5px; font-weight:500; cursor:pointer; white-space:nowrap; }
  .chip { border:1px solid var(--line); border-radius:var(--r-xs); padding:9px 13px; font-size:14.5px;
    cursor:pointer; white-space:nowrap; background:var(--card); }
  .chip:hover { background:var(--paper-warm); }
  .pill { border-radius:var(--r-pill); padding:7px 15px; font-size:14px; white-space:nowrap; }
  .mono { font-family:var(--mono); }
  .muted { color:var(--olive); }
  .ell { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-hover:hover { background:var(--paper-warm) !important; cursor:pointer; }
  .slug { font-size:13px; color:var(--olive); }
  input[type=search], input[type=text], textarea, select {
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-sm);
    padding:11px 14px; color:var(--ink); font-family:inherit; font-size:15.5px; width:100%; }
  select { font-size:14px; padding:9px 12px; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--olive); }
  textarea { resize:vertical; line-height:1.6; }

  /* 드로어 (업무 상세·산출물·정의 파일) */
  #drawerBg { position:fixed; inset:0; background:rgba(0,0,0,.26); display:none; z-index:20; }
  #drawer { position:fixed; top:0; right:0; bottom:0; width:min(680px,96vw); background:var(--card);
    border-left:1px solid var(--line); z-index:21; display:none; flex-direction:column; box-shadow:var(--sh-3); }
  /* 왼쪽 모서리를 잡아 끌면 폭이 바뀐다 · 마지막 폭은 기억한다 (2026-08-03 지시) */
  #drawerGrip { position:absolute; left:-3px; top:0; bottom:0; width:9px; cursor:col-resize; z-index:22; }
  #drawerGrip::after { content:''; position:absolute; left:3px; top:50%; transform:translateY(-50%);
    width:3px; height:44px; border-radius:2px; background:var(--line); transition:background .15s; }
  #drawerGrip:hover::after, #drawerGrip.on::after { background:var(--sand); }
  body.dragging { user-select:none; cursor:col-resize; }
  #drawer .dh { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex:none; }
  #drawer .db { padding:18px 22px; overflow-y:auto; flex:1; font-size:15px; line-height:1.7; }
  /* 업무 보고 섹션 · 제목을 키우고 구획선을 넣어 어디서 끊기는지 보이게 (2026-08-03 지시) */
  #drawer .db h4 { font-size:15px; color:var(--ink); font-weight:700; margin:22px 0 9px;
    padding-top:16px; border-top:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  #drawer .db h4::before { content:''; width:4px; height:15px; border-radius:2px; background:var(--sand); flex:none; }
  #drawer .db h4:first-child { margin-top:0; padding-top:0; border-top:none; }
  #drawer .dh b { font-size:17px; }
  .close { margin-left:auto; background:none; border:none; color:var(--olive); font-size:20px; cursor:pointer; }
  /* 먹색 상자(이슈 사항·팀 카드) 안의 버튼은 밝은 옷으로 갈아입힌다 */
  .dark-rows .b-g { background:var(--on-dark-line); border-color:rgba(255,255,255,.18); color:var(--paper); }
  .dark-rows .b-g:hover { background:rgba(255,255,255,.16); }
  .dark-rows .b { background:var(--paper); color:var(--ink); border-color:var(--paper); }
  /* 산출물 문서 화면 · md 원문이 아니라 읽을 수 있는 문서로 (2026-08-03) */
  .docbody h1 { font-size:17px; font-weight:700; margin:16px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .docbody h2 { font-size:15px; font-weight:700; margin:14px 0 7px; display:flex; align-items:center; gap:7px; }
  .docbody h2::before { content:''; width:3px; height:14px; background:var(--sand); border-radius:2px; flex:none; }
  .docbody h3 { font-size:13.5px; font-weight:700; margin:12px 0 5px; color:var(--ink-muted); }
  .docbody p { margin:6px 0; }
  .docbody ul, .docbody ol { margin:6px 0 6px 18px; padding:0; }
  .docbody li { margin:3px 0; }
  .docbody table { border-collapse:collapse; font-size:13px; margin:8px 0; }
  .docbody th { background:var(--paper-warm); font-weight:700; }
  .docbody th, .docbody td { border:1px solid var(--line); padding:6px 9px; text-align:left; }
  .docbody blockquote { border-left:3px solid var(--sand); margin:8px 0; padding:2px 0 2px 11px; color:var(--ink-muted); }
  .docbody code { background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:0 4px; font:12px var(--mono); }
  .docbody h1:first-child, .docbody h2:first-child { margin-top:0; }
  pre.log { background:var(--paper-warm); border:1px solid var(--line); border-radius:var(--r-xs);
    padding:12px 14px; margin:0; max-height:46vh; overflow:auto;
    font:12.5px/1.65 var(--mono); white-space:pre-wrap; overflow-wrap:anywhere; }
  /* 실행 로그 읽는 화면 · 고정폭 원문 그대로는 사람이 못 읽어서 구조를 살려 다시 그린다 (2026-08-03) */
  .logv { background:var(--card); border:1px solid var(--line); border-radius:var(--r-xs);
    padding:12px 15px; max-height:52vh; overflow:auto; font-size:13.5px; line-height:1.72; overflow-wrap:anywhere; }
  .logv .lg-l { margin:1px 0; }
  .logv .lg-head { font-weight:700; font-size:14px; margin:12px 0 5px; padding-bottom:5px; border-bottom:1px solid var(--line); }
  .logv .lg-head:first-child { margin-top:0; }
  .logv .lg-sec { display:flex; gap:8px; margin:5px 0; align-items:baseline; }
  .logv .lg-key { flex:none; font-size:11.5px; font-weight:700; color:var(--sand-text);
    background:var(--sand-bg); border:1px solid var(--sand-line); border-radius:5px; padding:1px 7px; }
  .logv .lg-li { margin:2px 0 2px 12px; padding-left:10px; border-left:2px solid var(--line); }
  .logv .lg-gap { height:7px; }
  .logv .lg-dim { color:var(--olive); font-size:12.5px; }
  .logv .tag { font:12px var(--mono); background:var(--paper); border:1px solid var(--line);
    border-radius:5px; padding:0 5px; color:var(--ink-muted); }
  #editor { min-height:48vh; background:var(--paper-warm); font:12.5px/1.65 var(--mono); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper);
    padding:11px 20px; border-radius:var(--r-sm); font-size:14px; z-index:30; display:none; box-shadow:var(--sh-3); }
  /* 명령 팔레트 (⌘K) · 탭 이동·방법론·에이전트·커맨드를 한 곳에서 찾아 실행 */
  #palBg { position:fixed; inset:0; background:rgba(0,0,0,.3); display:none; z-index:50; }
  #pal { position:fixed; top:12vh; left:50%; transform:translateX(-50%); width:min(640px,92vw);
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--sh-3);
    display:none; flex-direction:column; overflow:hidden; z-index:51; }
  #pal input { border:none; border-bottom:1px solid var(--line); border-radius:0; background:var(--card);
    padding:16px 18px; font-size:16px; }
  #palList { max-height:56vh; overflow-y:auto; }
  .pitem { display:flex; align-items:center; gap:10px; padding:11px 18px; cursor:pointer; font-size:14.5px; }
  .pitem.on { background:var(--paper-warm); }
  .pitem .k { font-size:12px; color:var(--olive); border:1px solid var(--line); border-radius:4px; padding:1px 6px; flex:none; }
  .pfoot { padding:10px 18px; border-top:1px solid var(--line); font-size:12.5px; color:var(--olive); }
  /* 누를 수 있는 것은 손 모양 + 살짝 밝아진다 (무엇이 클릭 가능한지 보이게) */
  [onclick] { -webkit-tap-highlight-color:transparent; }
  /* 설명이 필요한 지표에 점선 밑줄 */
  .hint { border-bottom:1px dotted var(--fade); cursor:help; }
  .empty { border:1px dashed var(--fade); border-radius:var(--r-sm); padding:16px 18px;
    font-size:14.5px; color:var(--olive); line-height:1.7; }
</style>
</head>
<body>
<div id="app"></div>
<div id="drawerBg" onclick="closeDrawer()"></div>
<div id="drawer"><div id="drawerGrip" title="끌어서 넓이 조절 · 두 번 누르면 기본값"></div><div class="dh"><b id="dTitle"></b><button class="close" onclick="closeDrawer()">✕</button></div><div class="db" id="dBody"></div></div>
<div id="ordBg" onclick="closeOrder()" style="position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;z-index:52"></div>
<div id="ord" style="position:fixed;top:18vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-3);display:none;flex-direction:column;z-index:53">
  <div style="padding:18px 20px 12px">
    <div style="font-size:13px;color:var(--olive)">무엇을 시킬까요</div>
    <div id="ordTitle" style="font-size:18px;font-weight:700;margin-top:3px"></div>
    <div id="ordHint" style="font-size:13.5px;color:var(--olive);margin-top:5px;line-height:1.5"></div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:11px">
      <span style="font-size:12.5px;color:var(--olive);white-space:nowrap">결과물 형태</span>
      <span style="display:flex;gap:5px">
        <span id="fmtMd" onclick="pickFmt('md')" style="border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer">빠른 문서</span>
        <span id="fmtHtml" onclick="pickFmt('html')" style="border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer">보기 좋은 리포트</span>
      </span>
      <span style="width:1px;height:16px;background:var(--line);margin:0 4px"></span>
      <span style="font-size:12.5px;color:var(--olive);white-space:nowrap">무엇을 위해</span>
      <span id="ordPillar" style="display:flex;gap:5px;flex-wrap:wrap"></span>
    </div>
  </div>
  <div style="padding:0 20px 14px">
    <textarea id="ordText" rows="3" placeholder="예를 들면 · 지난 4주 경쟁사 3곳 가격 변화 정리해줘" onkeydown="orderKey(event)"></textarea>
    <div style="display:flex;align-items:center;gap:14px;margin-top:11px;font-size:13.5px;color:var(--ink-muted);flex-wrap:wrap">
      <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="ordLight" checked>가볍게</label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted);cursor:pointer"><input type="checkbox" id="ordPlan" style="accent-color:var(--ink)">플랜 먼저 <span class="hint" title="실행하지 않고 단계별 업무 플랜만 세웁니다. 플랜이 승인 차례에 올라오면 후속 지시로 단계를 진행합니다">?</span></label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted);cursor:pointer"><input type="checkbox" id="ordVerify" style="accent-color:var(--ink)">자동 검증 <span class="hint" title="산출물을 6축 검수로 자동 채점 · 미달이면 반려 재작성 (비용 2~3배)">?</span></label>
      
      <span id="ordWhereWrap" onclick="cycleRunner()" style="color:var(--olive);cursor:pointer;display:none" title="눌러서 다른 기계로 바꿉니다">실행 위치 <b id="ordWhere" style="text-decoration:underline"></b></span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line)">
    <span style="font-size:12.5px;color:var(--olive)">엔터 전송 · Esc 닫기 · 기본은 초안까지</span>
    
    <button class="b-g b-s" onclick="closeOrder()">그만</button>
    <button class="b" id="ordSend" onclick="sendOrder()">시키기</button>
  </div>
</div>
<div id="palBg" onclick="closePal()"></div>
<div id="pal">

/** 사전에 없을 때 · 설명문에서 읽을 만한 한 줄을 뽑는다 */
function tidyLabel(desc, fallback) {
  let d = String(desc || '').replace(/\s+/g, ' ').trim();
  d = d.split(/[.。]|\s선택\s|\s트리거/)[0];              // 첫 문장까지
  d = d.replace(/[a-z0-9][a-z0-9._-]{3,}/gi, '');          // 영문 슬러그 제거
  d = d.replace(/[·⭐→~()\[\]{}"'`+]/g, ' ');              // 기호 제거 (문구 규칙)
  d = d.replace(/\s{2,}/g, ' ').trim();
  if (d.length > 22) d = d.slice(0, 22).replace(/\s\S*$/, '');
  return d || fallback;
}

/**
 * 설명문에서 짧은 한글 라벨 하나 (커맨드·스킬처럼 사전이 없는 것들에 쓴다).
 * 2026-07-30 카탈로그를 방법론 정본으로 재작성할 때 이 함수가 같이 지워져
 * 카탈로그 전체 보기와 담당자 선택이 깨져 있었다. 정의를 사전 옆으로 옮겨 다시 둔다.
 */
function koLabel(desc, fallback) {
  const d = String(desc || '').replace(/\s+/g, ' ').trim();
  const first = d.split(/[.。]|·/)[0].trim();
  const out = first.length > 30 ? first.slice(0, 30) : first;
  return out || fallback || '';
}

/** 전략 기둥 조회 · 모르는 키는 운영으로 (없는 값을 그럴듯하게 만들지 않는다) */
/** 이 업무가 지금 내 승인을 기다리는가 · 이어서 지시(승인 포함)가 나갔으면 처리된 것 */

/**
 * 진행 단계 스텝퍼 · 이 업무가 전체 흐름 어디에 서 있는지 (리니어 워크플로 아이콘 방식)
 * 기본은 초안 → 확인 → 완료 세 단계다.
 *
 * "발행 확인" 은 실제로 발행하는 업무에만 붙인다 (2026-08-03 지시).
 *   실측: 승인 항목이 붙은 업무 42건 중 실제 발행은 1건.
 *   나머지 41건은 다 끝났는데도 빈 동그라미가 남아 안 끝난 것처럼 보였다.
 *   발행 업무의 근거는 allowPublish (사용자가 발행·전송을 명시 허용한 경우에만 true) 와
 *   publishedAt (사람이 올렸다고 표시한 경우) 뿐이다. 업무 종류로 추측하지 않는다.
 */
/** 경과 시간 · 승인·막힘 방치 방지 (62시간 방치 사고 재발 방지 · 24시간 넘으면 붉게) */
function waitedFor(t) {
  const from = t.endedAt || t.startedAt; if (!from) return '';
  const h = Math.floor((Date.now() - from) / 3600000);
  if (h < 1) return '';

  return `<span style="font-size:11.5px;font-weight:700;color:${h >= 24 ? 'var(--warn)' : 'var(--olive)'};flex:none">${label}</span>`;
}
function approvalStepper(t) {
  const child = childOf(t.id);
  // 발행까지 가는 업무인가 · 명시 허용했거나 이미 올렸다고 표시한 경우만
  const publishes = !!(t.publishedAt || t.allowPublish || (child && (child.publishedAt || child.allowPublish)));
  // 완료 판정 · 후속을 시켰으면 그 결과, 안 시키고 넘겼으면 이 업무 자체의 끝
  const doneState = child
    ? (child.status === 'running' ? 'now' : child.status === 'done' ? 'done' : 'fail')
    : !t.approvalsHandled ? 'todo'
    : t.status === 'done' ? 'done'
    : t.status === 'error' ? 'fail' : 'now';
  const steps = [
    { name: '초안', state: t.status === 'error' ? 'fail' : 'done' },
    { name: '확인', state: t.approvalsHandled ? 'done' : 'now' },
    { name: '완료', state: doneState },
  ];
  if (publishes) steps.push({ name: '발행 확인', state: (t.publishedAt || (child && child.publishedAt)) ? 'done' : 'todo' });
  const dot = (st) => st === 'done' ? `<span style="width:15px;height:15px;border-radius:50%;background:var(--ink);color:var(--card);font-size:9px;display:inline-flex;align-items:center;justify-content:center;flex:none">✓</span>`
    : st === 'now' ? `<span class="live-dot sm" style="width:11px;height:11px;background:var(--ink);box-shadow:0 0 0 3px var(--highlight)"></span>`
    : st === 'fail' ? `<span style="width:11px;height:11px;border-radius:50%;background:var(--warn);flex:none"></span>`
    : `<span style="width:11px;height:11px;border-radius:50%;border:1.5px solid var(--fade);flex:none"></span>`;
  return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    ${steps.map((st, i) => `<span style="display:inline-flex;align-items:center;gap:5px">${dot(st.state)}
      <span style="font-size:12px;white-space:nowrap;${st.state === 'now'
        ? 'background:var(--highlight);color:var(--ink);font-weight:700;border-radius:5px;padding:1px 7px'
        : `color:${st.state === 'done' ? 'var(--ink)' : 'var(--fade)'};font-weight:400`}">${esc(st.name)}</span></span>${i < steps.length - 1 ? '<span style="width:14px;height:1.5px;background:var(--line);flex:none"></span>' : ''}`).join('')}
  </div>`;
}

/** 상태 칩 · 노션 상태 속성처럼 어디서나 같은 색·같은 말 (한 업무의 상태는 한 가지로만 말한다) */

/**
 * 상단 상태 한 줄.
 * "다 저장되나" "외부 접속되나" 를 반복해서 물으셨다 → 화면에 상시 노출한다.
 * 각 항목은 눌러서 근거 화면으로 간다 (숫자만 보여 주고 끝내지 않는다).
 */
function statusStrip() {
  const dot = (c) => `<span style="width:7px;height:7px;border-radius:50%;background:${c};flex:none"></span>`;
  const store = CONN && CONN.store ? CONN.store.mode : null;
  const needs = CONN ? (CONN.count.needs || 0) : null;
  const running = TASKS.filter(t => t.status === 'running').length;
  const items = [
    running
      ? `<span onclick="go('teams')" style="display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink);font-weight:600"><span class="live-dot sm"></span>${running}건 도는 중</span>`
      : `<span onclick="go('teams')" style="display:flex;align-items:center;gap:6px;cursor:pointer">${dot('var(--fade)')}대기</span>`,
    `<span onclick="go('settings')" style="display:flex;align-items:center;gap:6px;cursor:pointer" title="${store === 'supabase' ? '업무 기록과 수집 결과가 Supabase 에 저장됩니다' : '로컬 파일에 저장됩니다'}">
      ${dot(store === 'supabase' ? 'var(--ink)' : 'var(--fade)')}${store === 'supabase' ? '서버에 저장 중' : store ? '이 맥에만 저장' : '확인 중'}</span>`,
    needs
      ? `<span onclick="go('settings')" style="display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--warn)">${dot('var(--warn)')}도구 점검 ${needs}</span>`
      : `<span onclick="go('settings')" style="display:flex;align-items:center;gap:6px;cursor:pointer">${dot('var(--ink)')}도구 정상</span>`,
  ];
  return `<span style="display:flex;align-items:center;gap:14px;font-size:13px;color:var(--olive)">${items.join('')}</span>`;
}

function body() {
  if (!STRUCT) return `<div class="c" style="padding:18px 20px;font-size:15px;color:var(--olive)">불러오는 중 잠시만요. 이 문구가 사라지지 않으면 <b>http://localhost:3737</b> 로 접속했는지 확인하세요. 파일을 직접 열면 데이터가 나오지 않습니다.</div>`;
  switch (S.tab) {
    case 'chat': return viewChat();
    case 'teams': return viewTeams();
    case 'schedule': return viewSchedule();
    case 'issues': return viewIssues();
    case 'assets': return viewAssets();
    case 'automation': return viewAutomation();

/* ── 시키기 (첫 화면) · 실제 직원에게 일을 주는 방식 ──────────────────
   왼쪽에서 부서를 고르면 그 부서의 직원(디렉터 + 팀원)이 먼저 보인다.
   직원 카드의 시키기 → 지시창 → 엔터. 방법론 100개는 "업무 매뉴얼"로
   접어 두었다 · 실측에서 지시 21건 중 방법론으로 시킨 건 1건뿐이었다.
   ---------------------------------------------------------------- */


/* ── 지시창 · 카드에서 바로 시킨다 ──────────────────────────────── */
let ORDER = null;
function openOrder(kind, id, name) {
  ORDER = { kind, id, name };
  const place = ((CFG && CFG.runners) || []).find(r => r.key === S.runner);
  const hint = {
    method: '이 방법론 절차대로 진행합니다. 무엇에 대해 할지 적어 주세요',
    agent: '이 담당의 방식대로 진행합니다. 무엇을 할지 적어 주세요',
    skill: '내 맞춤 스킬 절차대로 진행합니다. 무엇을 만들지 적어 주세요',
    team: '여러 명이 나눠 맡습니다. 결과는 파일로 착지합니다',
    truman: '어느 부서 일인지 트루먼이 판단해 배분합니다',
  }[kind] || '';
  $('#ordTitle').textContent = name;
  $('#ordHint').textContent = hint;
  $('#ordWhere').textContent = place ? place.name : '내 맥';
  $('#ordText').value = '';
  renderOrdPillars();
  pickFmt(S.fmt || localStorage.getItem('mos.fmt') || 'md');
  const wrap = document.getElementById('ordWhereWrap');
  if (wrap) wrap.style.display = ((CFG && CFG.runners) || []).some(r => r.kind === 'ssh' && r.enabled) ? 'inline' : 'none';
  $('#ordBg').style.display = 'block';
  $('#ord').style.display = 'flex';
  setTimeout(() => $('#ordText').focus(), 30);
}
/** 실행 위치를 다음 준비된 기계로 넘긴다 (지시창 안에서 바로) */
function cycleRunner() {
  const list = ((CFG && CFG.runners) || []).filter(r => r.kind === 'local' || (r.enabled && r.host && r.user && r.path));
  if (list.length < 2) return toast('연결된 실행 위치가 이 맥뿐입니다. 설정에서 원격을 연결하세요');
  const i = list.findIndex(r => r.key === S.runner);
  const next = list[(i + 1) % list.length];
  S.runner = next.key;
  const el = document.getElementById('ordWhere'); if (el) el.textContent = next.name;
}

/** 지시창의 전략 기둥 칩 · 고른 값은 다음 지시에도 이어진다 */
function renderOrdPillars() {
  const el = document.getElementById('ordPillar'); if (!el) return;
  el.innerHTML = ((CFG && CFG.pillars) || []).map(pI => `<span onclick="pickOrdPillar('${esc(pI.key)}')"
    style="display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;${
      S.pillar === pI.key ? `background:var(--ink);color:var(--card)` : 'background:var(--card);border:1px solid var(--line);color:var(--ink-muted)'}">
    <span style="width:7px;height:7px;border-radius:2px;background:${pI.tone};flex:none"></span>${esc(pI.name)}</span>`).join('');
}
function pickFmt(v) {
  S.fmt = v;
  try { localStorage.setItem('mos.fmt', v); } catch {}
  for (const [id, key] of [['fmtMd', 'md'], ['fmtHtml', 'html']]) {
    const el = document.getElementById(id); if (!el) continue;
    el.style.cssText = 'border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;' +
      (S.fmt === key ? 'background:var(--ink);color:var(--card)' : 'background:var(--card);border:1px solid var(--line);color:var(--ink-muted)');
  }
}
function pickOrdPillar(key) {
  S.pillar = key;
  try { localStorage.setItem('mos.pillar', key); } catch {}
  renderOrdPillars();
}

function closeOrder() { ORDER = null; $('#ordBg').style.display = 'none'; $('#ord').style.display = 'none'; }
function orderKey(e) {
  if (e.key === 'Escape') { e.preventDefault(); closeOrder(); return; }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); sendOrder(); }
}
async function sendOrder() {
  if (!ORDER) return;
  if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
    try { Notification.requestPermission(); } catch {}
  }
  const text = $('#ordText').value.trim();
  if (!text) return toast('무엇을 할지 한 줄 적어 주세요');
  if (/_{3,}/.test(text)) return toast('빈칸(___)이 남아 있습니다 · 채우고 보내 주세요');
  const dupO = typeof recentSame === 'function' ? recentSame(text) : null;
  if (dupO && !confirm(`같은 지시를 ${Math.round((Date.now() - dupO.startedAt) / 60000)}분 전에 이미 시키셨습니다. 또 보낼까요?`)) return;
  const pub = false;   // 발행은 승인 큐의 '승인하고 진행' 경로가 정본 (2026-08-02 지시창에서 제거)
  if (pub && !confirm('발행과 전송까지 허용합니다.\n초안에서 멈추지 않고 실제 발행이 일어날 수 있습니다. 계속할까요?')) return;

  let body;
  if (ORDER.kind === 'method') {
    body = { mode: 'truman', target: '',
      prompt: `마케팅 방법론 ${ORDER.id} "${ORDER.name}" 절차대로 진행해 주세요. 100-skills/ 의 해당 SKILL.md 를 읽고 그 단계를 따라 주세요.\n\n요청: ${text}` };
  } else if (ORDER.kind === 'agent') {
    body = { mode: 'agent', target: ORDER.id, prompt: text };
  } else if (ORDER.kind === 'skill') {
    body = { mode: 'skill', target: ORDER.id, prompt: text };
  } else if (ORDER.kind === 'team') {
    body = { mode: 'team', target: ORDER.id, prompt: text };   // 하네스 편성 (dispatch TEAM_FORMATIONS)
  } else {
    body = { mode: 'truman', target: '', prompt: text };
  }
  body.effort = $('#ordLight').checked ? 'low' : null;
  body.allowPublish = pub;
  body.runner = S.runner;
  body.pillar = S.pillar;
  body.plan = !!($('#ordPlan') && $('#ordPlan').checked);
  body.verify = !!($('#ordVerify') && $('#ordVerify').checked);
  body.format = S.fmt || 'md';

  const btn = $('#ordSend'); if (btn) btn.disabled = true;
  const r = await api('/api/task', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) })
    .then(x => x.json()).catch(e => ({ error:String(e) }));
  if (btn) btn.disabled = false;
  if (r.error) return toast(r.error);
  closeOrder();
  toast('넘겼습니다. 오른쪽에서 진행이 보입니다');
  pollTasks();
}

/* ── (메뉴에서 뺀 화면들 · 코드는 남겨 둔다) ──
/* ── 1. 홈 · 내 업무 현황 대시보드 ────────────────────────────────────
   목업의 홈(영역 카드·발행 보드)은 사람이 손으로 채워야 하는 값이라 늘 비어 있었다.
   그래서 홈을 "지금 내 업무가 어떻게 돌아가는가"로 바꿨다. 전부 실데이터다.
     · 업무 기록 (Supabase)  · 오늘 일정 (구글 캘린더)  · 자동화 예약 (launchd)
     · 산출물 (outputs/)     · 실패 로그              · 부서 가동 상태
   손으로 채우는 영역 카드와 발행 보드는 아래로 내리고 접어 뒀다.
   ------------------------------------------------------------------ */

/** 사업 영역 카드 (사람이 정하는 값 · 홈 접이식 안으로 옮겼다) */

/** 발행 보드 · 상태 6종을 요일 x 채널로 (설정 파일이 정본) */
const CELL = {
  done:  'border:1px solid var(--line);background:var(--paper);color:var(--olive)',
  draft: 'border:1.5px solid var(--ink);color:var(--ink)',
  wait:  'border:1.5px solid var(--sand);background:var(--sand-bg);color:var(--sand-text)',
  block: 'border:1.5px solid var(--warn);color:var(--warn)',
  empty: 'border:1px dashed var(--fade);color:var(--olive)',
  rest:  'border:1px solid var(--line);color:var(--olive)',
};
const CELL_KO = { done:'발행 완료', draft:'초안 있음', wait:'승인 대기', block:'막힘', empty:'비어 있음', rest:'쉼' };
const CELL_ORDER = ['empty','draft','wait','done','block','rest'];
const BOARD_DAYS = ['월요일','화요일','수요일','목요일','금요일'];

function publishBoard() {
  const cfg = CFG || {};
  const chans = cfg.channels || [];
  const board = cfg.publishBoard || {};
  if (!chans.length) return '<div class="empty">채널이 설정되지 않았습니다</div>';
  const head = `<div></div>` + chans.map(c => `<div style="text-align:center;color:var(--olive)">${esc(c.name)}</div>`).join('');
  const rows = BOARD_DAYS.map(day => `<div style="color:var(--olive);display:flex;align-items:center">${esc(day)}</div>`
    + chans.map(c => {
      const st = (board[day] || {})[c.key] || 'empty';
      return `<div onclick="cycleCell('${esc(day)}','${esc(c.key)}')" title="누르면 상태가 바뀝니다"
        style="border-radius:5px;padding:10px;text-align:center;font-size:14px;cursor:pointer;${CELL[st] || CELL.empty}">${esc(CELL_KO[st] || st)}</div>`;
    }).join('')).join('');
  return `<div style="display:grid;grid-template-columns:96px repeat(${chans.length},minmax(0,1fr));gap:8px;font-size:14px">${head}${rows}</div>
    <div style="font-size:13.5px;color:var(--olive);margin-top:10px">칸을 누르면 비어 있음, 초안 있음, 승인 대기, 발행 완료, 막힘, 쉼 순서로 바뀝니다. 바로 저장됩니다.</div>`;
}
function cycleCell(day, key) {
  const cfg = CFG || {}; const board = { ...(cfg.publishBoard || {}) };
  const row = { ...(board[day] || {}) };
  const cur = row[key] || 'empty';
  row[key] = CELL_ORDER[(CELL_ORDER.indexOf(cur) + 1) % CELL_ORDER.length];
  board[day] = row;

}

/**
 * 내 차례 · 사람이 지금 해야 할 모든 것을 한 줄기 큐로 (Linear Triage 패턴).
 * 승인 → 발행 확인 → 마감 임박 → 피드백 순. 시스템이 할 일은 여기 없다.
 */
/** 주간 캘린더 뷰 · 같은 업무 데이터를 시간축으로 (Airtable Calendar 패턴) */
/* ══ 캘린더 · 마케팅팀 업무 기록판 (2026-08-03 재구축) ═══════════════════
   좁은 오른쪽 칸에 밀어 넣어 글자가 세로로 깨지던 것을 본문 전폭으로 옮겼다.
   외부 일정(구글 캘린더)은 뺐다 · 여기 남기는 건 이 팀이 실제로 한 업무와 마감뿐이다. */

/** 그 날짜에 있었던 일 · 마감 · 발행 · 끝난 업무 · 진행 중 */
function dayEntries(key) {
  const goals = ((CFG && CFG.weekGoals) || []).filter(g => g.due === key);
  const pubs = TASKS.filter(t => t.publishedAt && dayKey(t.publishedAt) === key);
  const done = TASKS.filter(t => t.status === 'done' && !t.publishedAt && t.endedAt && dayKey(t.endedAt) === key);
  const live = TASKS.filter(t => t.status === 'running' && dayKey(t.startedAt) === key);
  return { goals, pubs, done, live, n: goals.length + pubs.length + done.length + live.length };
}
const calTitle = (t) => taskTitle(t, 60);

/* 지난달도 볼 수 있어야 한다 (2026-08-03 지시) · S.monthOff 만큼 앞뒤로 옮긴다 */
function monthCalendar() {
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + (S.monthOff || 0));
  const y = base.getFullYear(), m = base.getMonth();
  const first = new Date(y, m, 1); const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const weeks = [];
  for (let w = 0; w < 6; w++) {
    const row = [];
    for (let d = 0; d < 7; d++) { const dt = new Date(start); dt.setDate(start.getDate() + w * 7 + d); row.push(dt); }
    weeks.push(row);
    if (row[6] > new Date(y, m + 1, 0)) break;
  }
  const cell = (d) => {
    const key = dayKey(d.getTime()); const cur = d.getMonth() === m; const isToday = key === dayKey(Date.now());
    const e = dayEntries(key);
    const line = (html, tone) => `<div class="ell" style="font-size:11.5px;line-height:1.5;color:${tone}">${html}</div>`;
    const on = S.pickDay === key;
    return `<div onclick="pickDay('${key}')" title="누르면 이 날 업무만 봅니다"
      style="min-height:104px;border:1px solid ${on ? 'var(--ink)' : isToday ? 'var(--ink)' : 'var(--line)'};border-radius:9px;padding:7px 9px;cursor:pointer;
      background:${on ? 'var(--paper-warm)' : cur ? 'var(--card)' : 'var(--paper)'};opacity:${cur ? 1 : .5};overflow:hidden;${on ? 'box-shadow:0 0 0 2px var(--ink)' : ''}">
      <div style="font-size:11.5px;font-weight:${isToday ? 700 : 500};color:${isToday ? 'var(--ink)' : 'var(--olive)'};margin-bottom:4px">${d.getDate()}${isToday ? ' · 오늘' : ''}</div>
      ${e.goals.map(g => `<div class="ell" style="font-size:11.5px;line-height:1.5;font-weight:600;border-left:3px solid ${(pillarInfo(g.pillar) || {}).tone || TINT.warn.dot};padding-left:6px;${g.status === 'done' ? 'text-decoration:line-through;color:var(--fade)' : ''}" title="${esc(g.name)}">마감 · ${esc(g.name)}</div>`).join('')}
      ${e.live.slice(0, 2).map(t => line(`● ${esc(calTitle(t))}`, TINT.live.fg)).join('')}
      ${e.pubs.slice(0, 2).map(t => line(`✓ ${esc(calTitle(t))}`, TINT.live.fg)).join('')}
      ${e.done.slice(0, 2).map(t => line(esc(calTitle(t)), 'var(--ink-muted)')).join('')}
      ${e.n > 4 ? `<div style="font-size:11px;color:var(--olive)">외 ${e.n - 4}건</div>` : ''}</div>`;
  };
  return `<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px">
    ${'월화수목금토일'.split('').map(x => `<div style="font-size:11.5px;color:var(--olive);text-align:center;padding-bottom:2px">${x}</div>`).join('')}
    ${weeks.flat().map(cell).join('')}</div>
    <div style="font-size:12px;color:var(--olive);margin-top:9px">마감(방향색) · ● 진행 중 · ✓ 발행 · 나머지는 끝난 업무</div>`;
}

function weekCalendar() {
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const mon = new Date(t0); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  const days = [...Array(7)].map((_, i) => { const d = new Date(mon); d.setDate(d.getDate() + i); return d; });
  const cell = (d) => {
    const key = dayKey(d.getTime());
    const isToday = key === dayKey(Date.now());
    const e = dayEntries(key);
    const item = (t, mark, tone) => `<div onclick="openTask('${esc(t.id)}')" title="${esc(calTitle(t))}"
      style="font-size:12px;line-height:1.45;color:${tone};cursor:pointer;padding:3px 5px;border-radius:5px;background:var(--paper);
      overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${mark}${esc(calTitle(t))}</div>`;
    return `<div style="min-width:0;border:1px solid ${isToday ? 'var(--ink)' : 'var(--line)'};border-radius:11px;
      background:${isToday ? 'var(--card)' : 'var(--paper-warm)'};padding:10px;display:flex;flex-direction:column;gap:5px;min-height:230px">
      <div onclick="pickDay('${key}')" title="누르면 이 날 업무만 봅니다"
        style="font-size:12.5px;font-weight:${isToday ? 700 : 500};color:${S.pickDay === key ? 'var(--ink)' : isToday ? 'var(--ink)' : 'var(--olive)'};padding-bottom:5px;border-bottom:1px solid var(--line);cursor:pointer;${S.pickDay === key ? 'text-decoration:underline' : ''}">
        ${d.getMonth() + 1}/${d.getDate()} ${'월화수목금토일'[(d.getDay() + 6) % 7]}${isToday ? ' · 오늘' : ''}</div>
      ${e.goals.map(g => `<div style="font-size:12px;line-height:1.45;border-left:3px solid ${(pillarInfo(g.pillar) || {}).tone || TINT.warn.dot};padding-left:7px;${g.status === 'done' ? 'text-decoration:line-through;color:var(--fade)' : 'font-weight:600'}">마감 · ${esc(g.name)}</div>`).join('')}
      ${e.live.map(t => item(t, '● ', TINT.live.fg)).join('')}
      ${e.pubs.map(t => item(t, '✓ ', TINT.live.fg)).join('')}
      ${e.done.slice(0, 6).map(t => item(t, '', 'var(--ink-muted)')).join('')}
      ${e.done.length > 6 ? `<div style="font-size:11.5px;color:var(--olive)">외 ${e.done.length - 6}건</div>` : ''}
      ${e.n ? '' : '<div style="font-size:11.5px;color:var(--fade)">기록 없음</div>'}
    </div>`;
  };
  return `<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px">${days.map(cell).join('')}</div>
    <div style="font-size:12px;color:var(--olive);margin-top:9px">마감(방향색) · ● 진행 중 · ✓ 발행 · 나머지는 끝난 업무 · 누르면 업무 보고가 열립니다</div>`;
}


/* ── 오늘 · 단일 시작 화면 (2026-08-02 · 5탭 → 2화면) ─────────────────────
   왜 바꿨나 (실측 근거):
     · 화면 함수 13개 중 6개(705줄)가 어느 메뉴에서도 도달 불가한 죽은 코드였다.

/* ── 실행 · 담당자별 대화방 (최종안 · 2026-08-02) ─────────────────────
   실제 직원에게 메신저로 일 시키듯: 왼쪽 방 목록 → 가운데 그 담당자와 채팅 →
   결과물은 말풍선에서 바로 본다. 뒤에서는 기존 구조(트루먼 판정·기둥·승인 게이트) 그대로. */
const TRUMAN_ROOM = 'truman';

function dayKey(ts) { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dayLabel(key) {
  const today = dayKey(Date.now()), yest = dayKey(Date.now() - 86400000);
  if (key === today) return '오늘';
  if (key === yest) return '어제';
  const [, m, d] = key.split('-');
  return `${Number(m)}월 ${Number(d)}일`;
}

function chatMsgs() {
  return TASKS.filter(t => t.source === '채팅').sort((a, b) => a.startedAt - b.startedAt);
}
/** 담당 → 소속 팀(부서) · 팀 방 배정용 */
/** 직원 명부 행 · 이름·부서·최근 실적·상태 + 인사 동작 (Agent Registry 패턴) */


function deptOfSlug(slug) {
  for (const d of deptData()) {
    if (d.leadSlug === slug || (d.lead && d.lead.name === slug)) return d.name;
    if (d.members.some(m => m.name === slug)) return d.name;
  }
  return null;
}
/** 이 업무가 속한 방 · 트루먼 배분은 트루먼 방, 그 외에는 담당의 팀 방 */
function roomKey(t) {
  if (t.mode === 'truman' || (t.runnerAgent || t.target) === 'marketing-os-orchestrator') return TRUMAN_ROOM;
  return deptOfSlug(t.runnerAgent || t.target) || TRUMAN_ROOM;
}
function roomName(key) { return key === TRUMAN_ROOM ? '트루먼' : key; }

/** 방 목록 = 트루먼 + 팀 10곳 (켜진 부서만 · 최근 대화 순) */
function chatRooms() {
  const lastByRoom = {};
  for (const t of chatMsgs()) { const k = roomKey(t); if (!lastByRoom[k] || t.startedAt > lastByRoom[k].startedAt) lastByRoom[k] = t; }
  const teams = deptData().filter(d => !d.off).map(d => ({ key: d.name, dept: d, last: lastByRoom[d.name] || null, at: lastByRoom[d.name] ? lastByRoom[d.name].startedAt : 0 }));
  teams.sort((a, b) => b.at - a.at);
  return [{ key: TRUMAN_ROOM, dept: null, last: lastByRoom[TRUMAN_ROOM] || null, at: Infinity }, ...teams];
}

/** 결과물 바로 보기 · 말풍선 안에서 펼친다 (md 렌더 · html 격리 프레임) */
async function chatPreview(taskId, rel) {
  const el = document.getElementById('cp-' + taskId); if (!el) return;
  if (el.dataset.open === '1') { el.dataset.open = ''; el.innerHTML = ''; return; }
  el.dataset.open = '1';
  if (/\.html$/i.test(rel)) {
    el.innerHTML = `<iframe sandbox="allow-scripts" src="/api/output/raw?t=${esc(TOKEN)}&path=${encodeURIComponent(rel)}"
      style="width:100%;height:380px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin-top:8px"></iframe>`;
    return;
  }
  el.innerHTML = '<div style="font-size:12.5px;color:var(--olive);margin-top:8px">불러오는 중</div>';
  const r = await api('/api/output?path=' + encodeURIComponent(rel)).then(x => x.json()).catch(e => ({ error: String(e) }));
  if (r.error) { el.innerHTML = `<div style="font-size:12.5px;color:var(--warn);margin-top:8px">${esc(r.error)}</div>`; return; }
  el.innerHTML = `<div style="border:1px solid var(--line);border-radius:9px;background:var(--paper);margin-top:8px;max-height:360px;overflow:auto;padding:11px 13px;font-size:13.5px;line-height:1.7">${mdHtml(String(r.content || '').replace(/^---\n[\s\S]*?\n---\n/, ''))}</div>`;
}

/* ══ 미팅 한 건 = 진행 단계 타임라인 (2026-08-03 지시) ═══════════════════
   말풍선은 "무슨 일이 어디까지 갔나"를 못 보여 줬다. 요청 → 배정 → 진행 → 산출물 →
   결과 → 확인 순으로 왼쪽 레일에 세우고, 긴 것은 접어 둔다. */
function meetLine(dot, label, sub, body, opts = {}) {
  const { last = false, live = false } = opts;
  return `<div style="display:flex;gap:10px;align-items:stretch">
    <div style="flex:none;width:14px;display:flex;flex-direction:column;align-items:center">
      ${live ? '<span class="live-dot sm" style="margin-top:5px"></span>'
             : `<span style="width:7px;height:7px;border-radius:50%;background:${dot};margin-top:5px;flex:none"></span>`}
      ${last ? '' : '<span style="flex:1;width:1.5px;background:var(--line);margin:3px 0 0"></span>'}
    </div>
    <div style="flex:1;min-width:0;padding-bottom:${last ? 0 : 12}px">
      <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
        <span style="font-size:13px;font-weight:700">${label}</span>
        ${sub ? `<span style="font-size:12px;color:var(--olive);min-width:0" class="ell">${sub}</span>` : ''}</div>
      ${body ? `<div style="margin-top:5px">${body}</div>` : ''}
    </div></div>`;
}
function meetingItem(t, isLast) {
  const files = (t.outputFiles && t.outputFiles.length) ? t.outputFiles : (t.outputFile ? [{ rel: t.outputFile }] : []);
  const running = t.status === 'running';
  const mins = t.endedAt ? Math.max(1, Math.round((t.endedAt - t.startedAt) / 60000)) + '분' : Math.max(1, Math.round((Date.now() - t.startedAt) / 60000)) + '분째';
  const rows = [];

  rows.push(meetLine('var(--ink)', '요청', hhmm(t.startedAt),
    `<div class="logv" style="max-height:none;border:none;padding:0;background:transparent;font-size:13.5px">${logHtml(softenText(t.prompt) || '(커맨드)')}</div>`));

  const who = t.routedTo ? routedKo(t) : empName(t.runnerAgent || t.target);
  if (who) rows.push(meetLine('var(--fade)', '맡은 곳', who,
    t.goal ? `<span style="font-size:12px;background:var(--sand-bg);border:1px solid var(--sand-line);color:var(--sand-text);border-radius:999px;padding:2px 9px">목표 · ${esc(t.goal)}</span>` : ''));

  rows.push(meetLine(running ? TINT.live.dot : 'var(--fade)', running ? '진행 중' : '진행',
    `${mins}${t.turns != null ? ' · 주고받음 ' + t.turns + '회' : ''}${t.cost != null ? ' · ' + esc(money(t.cost)) : ''}`,
    `<span onclick="openTask('${esc(t.id)}')" style="font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer">업무 보고 열기</span>`,
    { live: running }));

  if (files.length) rows.push(meetLine(TINT.live.dot, '산출물', `${files.length}개`,
    `<div style="display:flex;gap:6px;flex-wrap:wrap">${files.slice(0, 4).map(f => `<span onclick="chatPreview('${esc(t.id)}','${esc(f.rel)}')"
      style="display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:4px 10px;font-size:12.5px;cursor:pointer">${/\.html$/i.test(f.rel) ? '🌐' : '📄'} ${esc(fileLabel(f.rel))}</span>`).join('')}</div>
     <div id="cp-${esc(t.id)}"></div>`));

  if (t.error) rows.push(meetLine(TINT.warn.dot, '막힘', '', `<div style="font-size:13px;color:${TINT.warn.fg}">${esc(t.error)}</div>`));
  else if (t.resultSummary) rows.push(meetLine('var(--fade)', '결과', '',
    isLast ? `<div style="font-size:13.5px;line-height:1.7;max-height:300px;overflow:auto">${mdHtml(t.resultSummary)}</div>`
           : `<details><summary style="cursor:pointer;list-style:none;font-size:12.5px;color:var(--olive)">보고 펼치기 ⌄</summary>
              <div style="font-size:13.5px;line-height:1.7;margin-top:6px;max-height:260px;overflow:auto">${mdHtml(t.resultSummary)}</div></details>`));

  if (needsApproval(t)) rows.push(meetLine(TINT.wait.dot, '내 확인이 필요합니다', '',
    `<div style="font-size:13.5px">${t.approvals.map(a => `<div style="padding:1px 0">· ${esc(a)}</div>`).join('')}</div>
     <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
       <button class="b b-s" onclick="confirmDone('${esc(t.id)}')" title="봤고 됐다는 표시입니다. 새로 시키는 것은 없고 돈도 들지 않습니다">확인 완료</button>
       <button class="b-g b-s" onclick="approveTask('${esc(t.id)}')" title="승인 내용대로 다음 단계까지 실제로 시킵니다. 새 업무가 한 건 실행됩니다">이대로 실행</button>
       <button class="b-g b-s" style="color:var(--warn)" onclick="cancelTaskUi('${esc(t.id)}')">취소</button></div>
     <div style="font-size:12px;color:var(--olive);margin-top:6px">고칠 게 있으면 아래 입력칸에 그대로 적어 주세요 · 맥락 그대로 이어집니다</div>`,
    { last: true }));

  const body = rows.map((r, i) => i === rows.length - 1 ? r.replace('padding-bottom:12px', 'padding-bottom:0') : r).join('');
  return `<div class="c" style="padding:14px 16px">${body}</div>`;
}

function viewChat() {
  const rooms = chatRooms();
  if (!S.chatRoom || !rooms.some(r => r.key === S.chatRoom)) S.chatRoom = TRUMAN_ROOM;
  const room = S.chatRoom;
  const roomObj = rooms.find(r => r.key === room);
  const msgs = chatMsgs().filter(t => roomKey(t) === room);
  const TONES = teamToneMap(deptData().map(d => d.name));   // 팀 색은 한 곳에서만 정한다
  const roomRow = (r) => {
    const busy = r.key === TRUMAN_ROOM ? TASKS.some(t => t.status === 'running' && roomKey(t) === TRUMAN_ROOM) : r.dept.live;
    return `<div onclick="S.chatRoom='${esc(r.key)}';S.chatStick=true;render()"
      style="padding:10px 11px;border-radius:10px;cursor:pointer;${room === r.key ? 'background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-1)' : 'border:1px solid transparent'}">
      <div style="display:flex;align-items:center;gap:7px">
        ${busy ? '<span class="live-dot sm"></span>' : `<span style="width:8px;height:8px;border-radius:50%;background:${r.dept ? (TONES[r.key] || 'var(--fade)') : 'var(--ink)'};flex:none"></span>`}

      <div style="font-size:11.5px;color:var(--olive);margin-top:3px;line-height:1.4" class="ell">${r.key === TRUMAN_ROOM ? '누구한테 시킬지 모르면 여기' : esc((r.last && r.last.prompt || r.dept.tasks.map(t => t.label).slice(0, 2).join(' · ')).slice(0, 26))}</div>

  let thread = '', lastDay = '';
  msgs.forEach((t, i) => {
    const dk = dayKey(t.startedAt);
    if (dk !== lastDay) { thread += `<div style="text-align:center;margin:${i ? 18 : 2}px 0 14px"><span style="font-size:11.5px;color:var(--olive);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 12px">${dayLabel(dk)}</span></div>`; lastDay = dk; }
    thread += meetingItem(t, i === msgs.length - 1) + '<div style="height:10px"></div>';
  });
  if (!msgs.length) thread = `<div style="text-align:center;color:var(--olive);font-size:14.5px;line-height:1.9;padding:60px 20px">
    ${room === TRUMAN_ROOM ? '일을 말로 시켜 보세요. 트루먼이 알맞은 팀에 배정합니다.<br><b>"경쟁 채널 새 영상 정리해줘"</b> · <b>"링크드인 글 하나 써줘"</b>' : `<b>${esc(room)}</b>에 첫 업무를 요청해 보세요. 이 팀이 받아 진행합니다.`}</div>`;
  const pending = S.chatPending ? `<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
      <div style="align-self:flex-end;max-width:78%;background:var(--ink);color:var(--paper);border-radius:14px 14px 3px 14px;padding:10px 14px;font-size:14.5px;opacity:.75;white-space:pre-wrap">${esc(S.chatPending)}</div>
      <div style="align-self:flex-start;font-size:13px;color:var(--olive)">접수하는 중</div></div>` : '';
  const lead = roomObj && roomObj.dept ? roomObj.dept.leadSlug : null;
  return `<div style="display:flex;gap:14px;align-items:stretch;height:calc(100vh - 118px)">
    ${roomsCol}
    <div style="flex:1.5;min-width:0;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:9px;padding:2px 4px 10px;border-bottom:1px solid var(--line)">
        <span style="width:30px;height:30px;border-radius:50%;background:${room === TRUMAN_ROOM ? 'var(--ink)' : (TONES[room] || 'var(--sand)')};color:${room === TRUMAN_ROOM ? 'var(--card)' : 'var(--ink)'};font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none">${esc(roomName(room).slice(0, 1))}</span>
        <span style="min-width:0"><span style="display:block;font-size:15px;font-weight:700">${esc(roomName(room))}</span>
          <span style="display:block;font-size:12px;color:var(--olive)" class="ell">${room === TRUMAN_ROOM ? '요청을 받아 알맞은 팀에 배분합니다' : `${esc(empName(lead || ''))} 이 받아 진행 · 팀원 ${roomObj.dept.members.length + 1}명`}</span></span>
        <span style="margin-left:auto;display:flex;gap:10px;flex:none">
          ${lead ? `<span onclick="viewSkillDef('${esc(lead)}')" style="font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer">팀 스킬</span>` : ''}
          <span onclick="go('teams')" style="font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer">팀으로</span>
          <span onclick="go('teams')" style="font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer">오늘</span></span>
      </div>
      <div id="chatThread" onscroll="S.chatStick = this.scrollHeight - this.scrollTop - this.clientHeight < 80"
        style="flex:1;overflow-y:auto;padding:12px 6px 14px 2px">${thread}${pending}</div>
      <div class="c" style="padding:12px 14px;margin-top:6px">
        <textarea id="composer" rows="2" placeholder="${room === TRUMAN_ROOM ? '무엇을 시킬까요? 엔터로 보냅니다' : esc(room) + ' 에 업무를 요청하세요 · 엔터로 보냅니다'}"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();if(document.getElementById('slashMenu')){pickSlash(0);return}sendChat();}else if(event.key==='Escape'){closeSlash()}" oninput="slashWatch(this)"
          style="width:100%;border:none;background:transparent;font-family:inherit;font-size:15px;line-height:1.6;resize:none;outline:none;color:var(--ink)"></textarea>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px">
          <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-muted);cursor:pointer"><input type="checkbox" id="chatLight" style="accent-color:var(--ink)">가볍게</label>
          <label class="hint" title="산출물을 6축 검수로 자동 채점하고, 기준 미달이면 반려 사유와 함께 재작성시킵니다 (실행 비용 2~3배)" style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-muted);cursor:pointer"><input type="checkbox" id="chatVerify" style="accent-color:var(--ink)">자동 검증</label>
          <span onclick="S.chatFresh=true;toast('다음 요청은 새 맥락으로 시작합니다')" style="margin-left:auto;font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer">새 대화</span>
          <button class="b" style="padding:8px 18px" onclick="sendChat()">보내기</button>
        </div>
      </div>
    </div>
    <div style="width:330px;flex:none;overflow-y:auto;display:flex;flex-direction:column;gap:12px">${chatRail(room)}</div>
  </div>`;
}

/** 오른쪽 현황 레일 · 말한 일이 실제로 돌아가는 게 보이는 곳 */
/**
 * 미팅 오른쪽 = **이 방에서 요청한 업무 현황** (2026-08-03 지시)
 * 전에는 전사 업무와 이번 주 마감을 띄워서, 지금 마주 앉은 팀과 상관없는 것이 절반이었다.
 */
function chatRail(room) {
  const mine = TASKS.filter(t => roomKey(t) === room);
  const running = mine.filter(t => t.status === 'running');
  const waiting = mine.filter(t => needsApproval(t) && t.status !== 'running');
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const doneToday = mine.filter(t => t.status === 'done' && !needsApproval(t) && (t.endedAt || 0) >= t0.getTime());
  const outs = mine.filter(t => t.outputFile || (t.outputFiles || []).length).length;
  const w0 = new Date(t0); w0.setDate(w0.getDate() - ((w0.getDay() + 6) % 7));
  const week = mine.filter(t => (t.startedAt || 0) >= w0.getTime()).length;
  const sec = (title, tone, body) => `<div class="c" style="padding:13px 14px">
    <div style="font-size:13.5px;font-weight:700;color:${tone || 'var(--ink)'};margin-bottom:9px">${title}</div>${body}</div>`;
  const mini = (t, extra) => `<div onclick="openTask('${esc(t.id)}')" class="row-hover" style="padding:8px 9px;border:1px solid var(--line);border-radius:9px;cursor:pointer;margin-bottom:7px;background:var(--card)">
    <div style="display:flex;align-items:center;gap:7px">${statusPill(t)}<span style="font-size:12px;color:var(--olive)" class="ell">${esc(empName(t.runnerAgent || t.target))}</span></div>
    <div style="font-size:13px;line-height:1.5;margin-top:5px" class="ell">${esc(taskTitle(t, 46))}</div>${extra || ''}</div>`;
  const stat = (l, v, tone) => `<span style="font-size:12px;color:var(--olive)">${l} <b style="font-size:14px;color:${tone || 'var(--ink)'}">${v}</b></span>`;

  return [
    sec(`${room === TRUMAN_ROOM ? '트루먼' : esc(room)} 에 요청한 일`, null,
      `<div style="display:flex;gap:14px;flex-wrap:wrap">
        ${stat('전체', mine.length)}${stat('이번 주', week)}${stat('산출물', outs, outs ? TINT.live.fg : 'var(--fade)')}
      </div>${mine.length ? '' : '<div style="font-size:12.5px;color:var(--olive);margin-top:8px">아직 없습니다 · 아래에서 말로 시켜 보세요</div>'}`),
    sec(`지금 도는 중 · ${running.length}`, TINT.live.fg, running.length ? running.map(t => mini(t)).join('') : '<div style="font-size:12.5px;color:var(--olive)">없음</div>'),
    sec(`내 확인 차례 · ${waiting.length}`, TINT.wait.fg, waiting.length ? waiting.map(t => mini(t, `<div style="margin-top:7px">${approvalStepper(t)}</div><div style="display:flex;gap:6px;margin-top:7px"><button class="b b-s" style="font-size:12px;padding:5px 10px" onclick="event.stopPropagation();confirmDone('${esc(t.id)}')" title="봤고 됐다는 표시입니다. 새로 시키는 것은 없고 돈도 들지 않습니다">확인 완료</button><button class="b-g b-s" style="font-size:12px;padding:5px 10px" onclick="event.stopPropagation();approveTask('${esc(t.id)}')" title="승인 내용대로 다음 단계까지 실제로 시킵니다. 새 업무가 한 건 실행됩니다">이대로 실행</button><button class="b-g b-s" style="font-size:12px;padding:5px 10px;color:var(--warn)" onclick="event.stopPropagation();cancelTaskUi('${esc(t.id)}')">취소</button></div>`)).join('') : '<div style="font-size:12.5px;color:var(--olive)">기다리는 결정이 없습니다</div>'),
    sec(`오늘 끝남 · ${doneToday.length}`, null, doneToday.slice(0, 4).map(t => mini(t)).join('') || '<div style="font-size:12.5px;color:var(--olive)">아직 없습니다</div>'),
  ].join('');
}

/** 워크플로 프리셋 · 팀 방으로 옮기고 지시문·기둥·자동 검증까지 채운다 (전송 전 확인·수정 가능) */
function runFlow(i) {
  const f = ((CFG && CFG.flows) || [])[i]; if (!f) return;
  S.chatRoom = f.room; S.chatFresh = true; S.flowTarget = f.target || null;
  if (f.pillar) { S.pillar = f.pillar; try { localStorage.setItem('mos.pillar', f.pillar); } catch {} }
  render();
  setTimeout(() => {
    const el = document.getElementById('composer'); if (el) { el.value = f.prompt; el.focus(); }
    const v = document.getElementById('chatVerify'); if (v) v.checked = f.verify === true;
    toast(f.label + ' 준비 완료 · 내용 확인 후 엔터로 보내세요');
  }, 80);
}

/** 슬래시 명령 (Notion 패턴) · 입력창에서 / 로 워크플로·팀·맞춤 스킬 즉시 호출 */
function slashItems(q) {
  const items = [];
  for (const [i, f] of (((CFG && CFG.flows) || [])).entries()) items.push({ label: '⚡ ' + f.label, hint: '워크플로', run: () => runFlow(i) });
  for (const r of chatRooms()) items.push({ label: '👥 ' + roomName(r.key), hint: '미팅 방으로', run: () => { S.chatRoom = r.key; render(); } });
  for (const [mid, sk] of Object.entries((CFG && CFG.skillMap) || {})) if (!items.some(x => x.label.includes(sk))) items.push({ label: '🛠 ' + sk, hint: '내 맞춤 스킬', run: () => { const el = document.getElementById('composer'); if (el) el.value = `${sk} 스킬 규격대로 진행해줘: `; closeSlash(); el && el.focus(); } });
  return q ? items.filter(x => x.label.includes(q)) : items;
}
function slashWatch(el) {
  const v = el.value;
  if (v.startsWith('/')) renderSlash(v.slice(1).trim());
  else closeSlash();
}
function renderSlash(q) {
  closeSlash();
  const items = slashItems(q).slice(0, 8);
  if (!items.length) return;
  const box = document.createElement('div');
  box.id = 'slashMenu';
  box.style.cssText = 'position:absolute;bottom:100%;left:0;right:0;margin-bottom:6px;background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh-2, 0 8px 24px rgba(0,0,0,.12));padding:6px;z-index:50;max-height:280px;overflow:auto';
  box.innerHTML = items.map((x, i) => `<div onclick="pickSlash(${i})" style="display:flex;gap:9px;align-items:center;padding:8px 11px;border-radius:7px;cursor:pointer;font-size:13.5px" class="row-hover">
    <span style="flex:1;min-width:0" class="ell">${esc(x.label)}</span><span style="font-size:11px;color:var(--olive);flex:none">${esc(x.hint)}</span></div>`).join('');
  const composer = document.getElementById('composer');
  const wrap = composer && composer.parentElement;
  if (wrap) { wrap.style.position = 'relative'; wrap.appendChild(box); S._slash = items; }
}
function pickSlash(i) {
  const items = S._slash || []; const x = items[i]; if (!x) return;
  const el = document.getElementById('composer'); if (el) el.value = '';
  closeSlash(); x.run();
}
function closeSlash() { const b = document.getElementById('slashMenu'); if (b) b.remove(); S._slash = null; }

async function sendChat() {
  const el = document.getElementById('composer');
  const text = (el && el.value || '').trim();
  if (!text) return;
  const room = S.chatRoom || TRUMAN_ROOM;
  const roomMsgs = chatMsgs().filter(t => roomKey(t) === room);
  const last = roomMsgs.slice(-1)[0];
  const cont = !S.chatFresh && last && last.sessionId && last.status !== 'running';
  const light = !!(document.getElementById('chatLight') && document.getElementById('chatLight').checked);
  const body = cont
    ? { mode: 'followup', parentId: last.id, prompt: text }
    : room === TRUMAN_ROOM
      ? { mode: 'truman', target: '', prompt: text }

function linkifyEscaped(text) {
  return String(text).replace(/(?:agents|skills|100-skills|methods|commands|brand|scripts|outputs)\/[A-Za-z0-9가-힣._\-]+(?:\/[A-Za-z0-9가-힣._\-]+)*\/?/g, (raw) => {

    const cut = raw.match(/^(.*?\.(?:md|sh|json|mjs|js|sql|ya?ml))(.*)$/);
    const rel = cut ? cut[1] : raw, tail = cut ? cut[2] : '';
    const label = pathLabel(rel) + tail;
    if (/^outputs\/.+\.[a-z0-9]+$/i.test(rel)) return `<span onclick="openOutputPath('${rel}')" title="${rel}"

function ruleHtml(text) {
  const raw = String(text || '').trim();
  const parts = raw.split(/\s+·\s+/).map(x => x.trim()).filter(Boolean);
  if (parts.length < 2) return `<div style="line-height:1.6">${withDocLinks(raw)}</div>`;
  const m = parts[0].match(/^(.{2,40}?)\s*:\s*(.+)$/);   // "링크드인 글: 실측 숫자를…" 처럼 앞에 제목이 붙는 형태
  const head = m ? m[1] : '';
  const items = m ? [m[2], ...parts.slice(1)] : parts;
  return `${head ? `<div style="font-weight:700;margin-bottom:3px">${withDocLinks(head)}</div>` : ''}
    ${items.map(x => `<div style="display:flex;gap:6px;line-height:1.6;margin-top:2px">
      <span style="flex:none;color:var(--fade)">·</span><span style="min-width:0">${withDocLinks(x)}</span></div>`).join('')}`;

  const r = await api('/api/file?path=' + encodeURIComponent(rel)).then(x => x.json()).catch(e => ({ error: String(e) }));
  if (r.error) return toast(r.error);
  const body = String(r.content || '').replace(/^---\n[\s\S]*?\n---\n/, '');
  showDrawer(esc(pathLabel(rel)), `
    <div style="font-size:12.5px;color:var(--olive)">${esc(rel)}</div>
    <div style="border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:10px;max-height:62vh;overflow:auto;padding:12px 15px;font-size:14px;line-height:1.7">${mdHtml(body)}</div>`);
}

function tintBox(state, focus) {
  const t = TINT[state] || TINT.calm;
  return `background:${t.bg};border:1px solid ${focus ? 'var(--ink)' : t.line};border-radius:12px;box-shadow:var(--sh-1)`
    + (focus ? ';box-shadow:0 0 0 1px var(--ink)' : '');
}
function chip(label, n, state, pulse) {
  const t = TINT[state] || TINT.calm;
  return `<span style="display:inline-flex;align-items:center;gap:7px">
    <span style="display:inline-flex;align-items:center;gap:6px;background:${state === 'calm' ? 'var(--paper)' : t.bg};
      border:1px solid ${t.line};border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;font-weight:600;color:var(--ink)">
      <span class="${pulse ? 'live-dot sm' : ''}" style="${pulse ? '' : `width:7px;height:7px;border-radius:50%;background:${t.dot};display:inline-block`}"></span>${esc(label)}</span>
    <span style="font-size:14px;font-weight:700;color:${t.fg}">${n}</span></span>`;
}

/* ══ 일정 · 내가 요청한 업무를 일간·주간·월간으로 ═══════════════════════ */
function viewSchedule() {
  const mode = S.schedMode || 'day';
  const now = new Date();
  const startOf = { day: () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; },
    week: () => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; },
    month: () => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(1); d.setMonth(d.getMonth() + (S.monthOff || 0)); return d; } }[mode]();
  // 월간은 그 달만 본다 (지난달을 보는데 이후 업무까지 섞이면 안 된다)
  const endOf = mode === 'month' ? new Date(startOf.getFullYear(), startOf.getMonth() + 1, 1).getTime() : Infinity;
  const inRange = TASKS.filter(t => (t.startedAt || 0) >= startOf.getTime() && (t.startedAt || 0) < endOf);
  const off = S.monthOff || 0;
  const monthLabel = off === 0 ? '이번 달' : off === -1 ? '지난달'
    : `${startOf.getFullYear()}년 ${startOf.getMonth() + 1}월`;
  const label = { day: '오늘', week: '이번 주', month: monthLabel }[mode];

  /* 달력에서 고른 날짜가 있으면 그 날만 본다 (2026-08-03 지시).
     달력은 보기만 하고 아래 목록은 늘 전체라 "그 날 뭐 했지" 를 눈으로 뒤져야 했다. */
  const pick = S.pickDay;
  const shown = pick ? inRange.filter(t => dayKey(t.startedAt || 0) === pick) : inRange;

  // 날짜별로 묶기
  const byDay = {};
  for (const t of shown) {
    const d = new Date(t.startedAt || 0);
    const k = `${d.getMonth() + 1}/${d.getDate()}`;
    (byDay[k] = byDay[k] || []).push(t);
  }
  const days = Object.entries(byDay).sort((a, b) => {
    const [ma, da] = a[0].split('/').map(Number), [mb, db] = b[0].split('/').map(Number);
    return (mb - ma) || (db - da);
  });
  const st = t => t.status === 'running' ? 'live' : t.status === 'error' ? 'warn' : needsApproval(t) ? 'wait' : 'done';
  const stName = t => t.status === 'running' ? '진행 중' : t.status === 'error' ? '막힘' : needsApproval(t) ? '확인' : '완료';

  const goals = (CFG && CFG.weekGoals) || [];
  const t0 = startOf; const today0 = new Date(); today0.setHours(0, 0, 0, 0);
  const dday = due => due ? Math.round((new Date(due + 'T00:00:00') - today0) / 86400000) : null;

  const done = inRange.filter(t => t.status === 'done').length;
  const out = inRange.filter(t => t.outputFile || (t.outputFiles || []).length).length;
  const cost = inRange.reduce((a, t) => a + (t.cost || 0), 0);

  return `${pulseStrip()}
  <div style="display:flex;gap:16px;align-items:flex-start">
    <div style="flex:1;min-width:0">
      <div class="c" style="padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        ${[['day', '일간'], ['week', '주간'], ['month', '월간']].map(([k, n]) => `<span onclick="S.schedMode='${k}';render()"
          style="border-radius:999px;padding:6px 16px;font-size:13.5px;cursor:pointer;${mode === k
            ? 'background:var(--ink);color:var(--card);font-weight:600' : 'background:var(--paper);border:1px solid var(--line);color:var(--ink-muted)'}">${n}</span>`).join('')}
        <span style="margin-left:auto;font-size:13px;color:var(--olive)">${label} 요청 <b style="color:var(--ink)">${inRange.length}</b>건 · 완료 <b style="color:var(--ink)">${done}</b> · 산출물 <b style="color:var(--ink)">${out}</b> · ${money(cost) || '$0.00'}</span>
      </div>
      ${mode !== 'day' ? `<div class="c" style="padding:16px 18px;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:11px">
          <span style="font-size:15px;font-weight:700">${mode === 'week' ? '이번 주' : esc(monthLabel)} 업무판</span>
          ${mode === 'month' ? `<span style="margin-left:auto;display:flex;gap:6px;align-items:center">
            <button class="b-g b-s" style="font-size:12px;padding:4px 10px" onclick="S.monthOff=(S.monthOff||0)-1;render()">← 지난달</button>
            ${off ? `<button class="b-g b-s" style="font-size:12px;padding:4px 10px" onclick="S.monthOff=0;render()">이번 달</button>
                     <button class="b-g b-s" style="font-size:12px;padding:4px 10px" onclick="S.monthOff=Math.min(0,(S.monthOff||0)+1);render()">다음 달 →</button>` : ''}
          </span>` : ''}
        </div>
        ${mode === 'week' ? weekCalendar() : monthCalendar()}</div>` : ''}
      ${pick ? `<div class="c" style="padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:13px">
        <span><b>${esc(pick.replace(/^\d{4}-/, '').replace('-', '월 '))}일</b> 업무만 보고 있습니다 · ${shown.length}건</span>
        <button class="b-g b-s" style="margin-left:auto;font-size:12px;padding:4px 11px" onclick="pickDay(null)">전체 보기</button></div>` : ''}
      ${days.length ? days.map(([k, ts]) => `<div class="c" style="padding:14px 18px;margin-bottom:12px">
        <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:9px">
          <span style="font-size:14.5px;font-weight:700">${k}</span>
          <span style="font-size:12.5px;color:var(--olive)">${ts.length}건</span></div>
        ${ts.sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0)).map(t => `<div onclick="openTask('${esc(t.id)}')"
          style="display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px">
          <span class="mono" style="flex:none;font-size:11.5px;color:var(--olive);width:38px">${esc(hhmm(t.startedAt))}</span>
          <span style="flex:1;min-width:0" class="ell">${esc(taskTitle(t, 56))}</span>
          <span style="flex:none;font-size:11.5px;color:var(--olive)">${esc(deptOf(t.target) || empName(t.target))}</span>
          ${(t.outputFiles || []).length || t.outputFile ? `<span style="flex:none;font-size:11.5px;color:var(--olive)">📄</span>` : ''}
          ${chip(stName(t), '', st(t))}</div>`).join('')}
      </div>`).join('')
        : (pick ? `<div class="c" style="padding:22px;font-size:13.5px;color:var(--olive);text-align:center">이 날 요청한 업무가 없습니다.<br>
             <span onclick="pickDay(null)" style="text-decoration:underline;cursor:pointer">전체 보기</span></div>`
          : `<div class="c" style="padding:22px;font-size:13.5px;color:var(--olive);text-align:center">${label} 요청한 업무가 없습니다.<br>
             <span onclick="go('request')" style="text-decoration:underline;cursor:pointer">업무 요청하러 가기</span></div>`)}
    </div>
    <div style="width:300px;flex:none">
      <div class="c" style="padding:16px 18px">
        <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:10px">
          <span style="font-size:15.5px;font-weight:700">마감</span>
          <span style="font-size:12.5px;color:var(--olive)">${goals.filter(g => g.status !== 'done').length}건 남음</span></div>
        ${goals.length ? [...goals].sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999')).map((g, i) => {
          const d = dday(g.due);
          const s2 = g.status === 'done' ? 'done' : d === null ? 'calm' : d < 0 ? 'warn' : d <= 1 ? 'wait' : 'calm';
          const txt = g.status === 'done' ? '완료' : d === null ? '기한 없음' : d < 0 ? `${-d}일 지남` : d === 0 ? '오늘' : d === 1 ? '내일' : `D-${d}`;
          return `<div style="display:flex;gap:9px;align-items:center;padding:7px 0;border-top:1px solid var(--line)">
            <span onclick="toggleGoal('${esc(g.key || g.name)}')" style="width:15px;height:15px;border-radius:4px;flex:none;cursor:pointer;
              border:1.5px solid ${g.status === 'done' ? 'var(--live)' : 'var(--line)'};background:${g.status === 'done' ? 'var(--live)' : 'transparent'}"></span>
            <span style="flex:1;min-width:0;font-size:13.5px;${g.status === 'done' ? 'color:var(--fade);text-decoration:line-through' : ''}" class="ell">${esc(g.name)}</span>
            ${g.order && g.status !== 'done' ? `<span onclick="event.stopPropagation();startGoal('${esc(g.key || g.name)}')" style="flex:none;font-size:11.5px;color:var(--olive);text-decoration:underline;cursor:pointer">시키기</span>` : ''}
            ${chip(txt, '', s2)}</div>`;
        }).join('') : '<div style="font-size:13px;color:var(--olive)">아직 마감이 없습니다.</div>'}
        <button class="b-g" style="margin-top:11px;width:100%" onclick="editGoal()">+ 마감 추가</button>
      </div>
    </div>
  </div>`;
}


/* ══ 상단 시각화 · 지금 무슨 일이 벌어지는가 (2026-08-03) ══════════════ */
/**
 * 업무 한 줄 앞에 붙일 종류 딱지 (2026-08-03 지시)
 * 문장 앞머리만 보면 "수정 요청입니다…" 처럼 다 비슷해 구분이 안 된다.
 * 눈에 띄는 낱말이 있으면 그것을, 없으면 업무 종류로 붙인다.
 */
const KIND_TAG = [
  [/수정 요청|고쳐서|반려/, '수정'], [/회고|주간 리뷰|월간 리뷰|돌아보기/, '회고'],
  [/원고|출판|집필|교정|목차/, '출판'], [/팀 재설계|팀 재편|인사팀|재편성/, '조직'],
  [/채용|직원 뽑|조직|편성|인사 감사|download team|스킬 제작|팀 구축/, '조직'],
  [/^위 초안을 승인|승인합니다|승인한다/, '승인'],
  [/검토|검수|판정|압박|재검토/, '검수'],
  [/기획|주제 제안|아이디어|각도/, '기획'], [/대본|스크립트|촬영/, '대본'],
  [/성과|지표|분석|리포트|집계|데이터|키워드/, '분석'], [/조사|경쟁|트렌드|스캔|리서치/, '조사'],
  [/제안서|커리큘럼|출강|오퍼|가격/, '영업'],
  [/포스트|초안|카피|뉴스레터|링크드인|쓰레드|글 하나|글쓰기/, '글'],
  [/발행|업로드|예약|발송/, '발행'], [/테스트|스모크|확인용|점검/, '점검'],
];
/** 목록에 쓸 한 줄 이름 · 실행 때 저장한 제목이 있으면 그것을 (C-17) */
function taskTitle(t, n = 40) {
  const s = t.title || softenText(t.prompt || t.target || '');
  return String(s).replace(/\s+/g, ' ').trim().slice(0, n);
}
function workTag(t) {
  const s = String(t.prompt || t.target || '');   // 승인 항목이 아니라 내가 시킨 말로 가른다
  // 긴 지시문은 뒤쪽에 온갖 낱말이 섞인다 (본문에 "조직" 한 번 나왔다고 조직 업무가 아니다)
  // → 제목에 해당하는 앞머리부터 보고, 거기서 못 찾을 때만 전체를 본다
  // 본문 전체를 훑으면 "조직" 이 한 번 스친 글쓰기 업무까지 조직으로 간다 · 앞머리만 본다
  const head = s.slice(0, 60);
  for (const [re, tag] of KIND_TAG) if (re.test(head)) return tag;
  // 담당 팀으로 되짚으면 트루먼·구축실이 맡은 일이 전부 "조직" 이 된다 · 적은 말만 본다
  return { write: '글', analyze: '분석', research: '조사', sales: '영업', build: '조직' }[reqKind(s, null)] || '업무';
}


function pulseStrip() {
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const running = TASKS.filter(t => t.status === 'running');
  const todayReq = TASKS.filter(t => (t.startedAt || 0) >= t0.getTime());
  const todayDone = TASKS.filter(t => t.status === 'done' && (t.endedAt || 0) >= t0.getTime());
  const who = t => deptOf(t.target) || empName(t.target);
  const mins = t => { const m = Math.round((Date.now() - t.startedAt) / 60000); return m < 1 ? '방금' : m + '분'; };

  const bar = (n, max, tone) => {
    const w = Math.min(100, max ? Math.round(n / max * 100) : 0);
    return `<div style="height:6px;border-radius:3px;background:var(--paper-warm);overflow:hidden;margin-top:7px">
      <div style="height:100%;width:${w}%;background:${tone}"></div></div>`;
  };
  const mx = Math.max(running.length, todayReq.length, todayDone.length, 5);
  const col = (title, arr, tone, sub, barTone) => `<div class="c" style="padding:13px 15px;flex:1;min-width:0">
    <div style="display:flex;align-items:baseline;gap:7px">
      <span style="font-size:13px;color:var(--olive)">${title}</span>
      <span style="font-size:20px;font-weight:800;color:${tone};line-height:1">${arr.length}</span>
      <span style="margin-left:auto;font-size:11.5px;color:var(--olive)">${sub}</span></div>
    ${bar(arr.length, mx, barTone || tone)}
    <div style="margin-top:9px">
      ${arr.slice(0, 5).map(t => `<div onclick="openTask('${esc(t.id)}')" style="display:flex;gap:7px;align-items:center;padding:4px 0;cursor:pointer;font-size:12.5px">
        <span style="flex:none;font-size:11px;font-weight:700;color:var(--ink-muted);background:var(--paper);border:1px solid var(--line);
          border-radius:5px;padding:1px 6px;min-width:34px;text-align:center">${esc(workTag(t))}</span>
        <span style="flex:1;min-width:0" class="ell">${esc(taskTitle(t, 40))}</span>
        <span style="flex:none;font-size:11px;color:var(--olive)">${t.status === 'running' ? mins(t) : esc(who(t))}</span></div>`).join('')
        || `<div style="font-size:12px;color:var(--olive);padding:4px 0">없음</div>`}
      ${arr.length > 5 ? `<div style="font-size:11.5px;color:var(--olive);padding-top:3px">그 외 ${arr.length - 5}건</div>` : ''}
    </div></div>`;

  return `${autoRateStrip()}
  <div style="display:flex;gap:12px;margin-bottom:14px">
    ${col('지금 진행 중', running, 'var(--ink)', running.length ? (orphanRunning().length ? `그중 ${orphanRunning().length}건은 끊겼을 수 있습니다` : '돌고 있음') : '대기')}
    ${col('오늘 요청', todayReq, 'var(--ink)', '내가 시킨 것')}
    ${col('오늘 완료', todayDone, 'var(--sand-text)', '끝난 것')}
  </div>`;
}

/**
 * 자동화율 · 이 대시보드의 북극성 (2026-08-03)
 *
 * 목표는 마케팅 업무 자동화 90% 다. 그런데 그 숫자가 화면 어디에도 없었다.
 * 목표가 있고 현재값이 안 보이면 진척을 알 수 없다. 그래서 맨 위에 박는다.
 *
 *   자동화율 = 자동으로 돈 업무 / (자동 + 사람이 시킨 업무)
 *
 * "자동으로 돈 업무" 는 켜져 있는 예약 × 지난 날수로 센다. 실행 로그가 아직 없어서다.
 * ⚠️ 그래서 [추정] 이라고 밝힌다 · 지어낸 숫자를 실측이라 하지 않는다.
 */
function autoRateStrip() {
  const t = TASKS.filter(x => !/^(스모크|테스트|위 초안을 승인|\[리더 피드백)/.test(x.prompt || ''));
  if (!t.length) return '';
  const days = new Set(t.map(x => dayKey(x.startedAt))).size || 1;
  const jobsOn = (JOBS || []).filter(j => {
    const s = STATUS && STATUS.jobs ? STATUS.jobs.find(y => y.label === j.label) : null;
    return s ? s.loaded : j.installed;
  }).length;
  const auto = jobsOn * days;
  const rate = Math.round(auto / Math.max(1, auto + t.length) * 100);
  const w = Math.min(100, Math.round(rate / 90 * 100));   // 90% 를 100 으로 놓은 진척
  return `<div class="c" style="padding:12px 16px;margin-bottom:12px">
    <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">
      <span style="font-size:13px;color:var(--olive)">자동화율</span>
      <span style="font-size:22px;font-weight:800;line-height:1">${rate}%</span>
      <span style="font-size:12px;color:var(--olive)">목표 90%</span>
      <span style="font-size:11.5px;color:var(--fade)">[추정] 켜진 예약 ${jobsOn}개 × ${days}일 ÷ (그것 + 사람이 시킨 ${t.length}건)</span>
      <span style="margin-left:auto;font-size:11.5px;color:var(--olive)">${rate >= 90 ? '목표 도달' : `하루 ${(t.length / days).toFixed(1)}건 중 ${Math.max(0, Math.round(t.length / days * 0.9))}건이 자동이어야 90%`}</span></div>
    <div style="height:6px;border-radius:3px;background:var(--paper-warm);overflow:hidden;margin-top:9px">
      <div style="height:100%;width:${w}%;background:${rate >= 90 ? TINT.live.dot : 'var(--ink)'}"></div></div>
  </div>`;
}

/* ══ 업무 요청 · UI 게이트 3단계 ═══════════════════════════════════════
   에이전트 게이트(실행 중 되묻기)는 헤드리스라 불가능하다.
   그래서 **보내기 전에** 브라우저에서 묻는다. 단계마다 답이 있어야 다음으로 간다. */
/** 이번 주 목표 = 업무가 무엇을 위한 것인지의 1순위 기준 (전략 기둥은 목표 밖의 일에만 쓴다) */
function goalOpts() { return ((CFG && CFG.weekGoals) || []).filter(g => g.status !== 'done'); }
function dueShort(due) { if (!due) return ''; const m = String(due).match(/^\d{4}-(\d{2})-(\d{2})/); return m ? `${+m[1]}/${+m[2]}` : ''; }
/** 이 목표로 지금까지 몇 건 돌았나 · 목표가 실제로 진척되는지 바로 보인다 */
function goalCount(name) { return name ? TASKS.filter(t => t.goal === name).length : 0; }
function goalDone(key) {
  const gl = goalOpts().find(g => g.key === key); if (!gl) return '';
  const n = goalCount(gl.name); return n ? ` · 이 목표로 지금까지 ${n}건` : '';
}
function pickGoal(key) {
  const d = S.req || (S.req = {});
  if (!key) { d.goalFree = true; d.goal = ''; d.goalKey = ''; return render(); }
  const gl = goalOpts().find(g => g.key === key); if (!gl) return;
  d.goalFree = false; d.goalKey = key; d.goal = gl.name; if (gl.pillar) d.pillar = gl.pillar;
  render();
}

/* ══ 게이트 3 · 앞 답에서 빠진 것만 묻는다 (2026-08-03 지시) ═══════════
   전에는 누구에게 무엇을 시키든 같은 것을 물었다. 이제 1단계 문장과 2단계 담당을 읽고
   **이미 답이 있는 항목은 건너뛴다.** 물을 게 없으면 바로 확인으로 넘긴다. */
const KIND_KO = { plan:'기획', write:'글쓰기', review:'검수', retro:'회고', analyze:'분석',
  research:'조사', sales:'영업·제안', build:'조직·운영', publish:'발행', etc:'일반' };
/**
 * 무엇을 시키는 일인가 (2026-08-03 수리)
 * 전에는 **담당 팀이 종류를 덮어써서**, "유튜브 기획"을 콘텐츠팀에 맡기면 글쓰기 질문이 떴다.
 * 이제 적으신 말이 먼저고, 말로 못 가릴 때만 팀으로 짐작한다.
 */
function reqKind(text, to) {
  const t = String(text || '');
  if (/기획|주제 (제안|후보)|아이디어|각도|무엇을 만들|뭘 만들/.test(t)) return 'plan';
  if (/검토|검수|판정|피드백 ?(받|줘)|고칠 ?점|괜찮은지 ?봐/.test(t)) return 'review';
  if (/회고|돌아보|지난주 정리|이번 주 정리|주간 리뷰|월간 리뷰/.test(t)) return 'retro';
  if (/발행|업로드|예약|발송|올려/.test(t)) return 'publish';
  if (/성과|지표|분석|리포트|숫자|전환|매출|조회수|집계/.test(t)) return 'analyze';
  if (/조사|경쟁|트렌드|리서치|스캔|벤치마킹|찾아 ?줘|뭐 ?하는지|어떻게 ?하는지/.test(t)) return 'research';
  if (/제안서|커리큘럼|출강|오퍼|가격 ?(안|정책)|상품 ?구성/.test(t)) return 'sales';
  if (/글|초안|카피|대본|포스트|뉴스레터|링크드인|쓰레드|제목|썸네일|스크립트/.test(t)) return 'write';
  if (/채용|직원|조직|편성|정리|스킬 ?(제작|만들)|점검|감사/.test(t)) return 'build';
  return { '콘텐츠팀': 'write', '성과분석팀': 'analyze', '시장·기획팀': 'research',
    '강의사업팀': 'sales', '구축실': 'build' }[to] || 'etc';
}
const SLOTS = [
  { key: '안 개수', kinds: ['plan'], q: '몇 개 안을 볼까요?',
    has: t => /\d+\s*(안|개)/.test(t), opts: ['2안', '3안', '5안'] },
  { key: '쓸 곳', kinds: ['plan', 'publish'], q: '어디에 쓸 건가요?',
    has: t => /유튜브|링크드인|쓰레드|뉴스레터|강의|블로그|인스타/.test(t),
    opts: ['유튜브', '링크드인', '뉴스레터', '강의'] },
  { key: '보는 사람', kinds: ['write', 'sales'], q: '누가 볼 글인가요?',
    has: t => /독자|고객|수강생|대표|담당자|디렉터|초보|입문|마케터|사장|B2B|기업/.test(t),
    opts: ['1인 마케터', '기업 교육 담당자', '대표·의사결정자', '입문자'] },

    has: t => /\d+\s*(편|개|장|자|줄|건|분)|짧게|길게|간단/.test(t),
    opts: ['1편', '3편', '짧게 (500자)', '길게 (2000자)'] },
  { key: '보는 관점', kinds: ['review'], q: '어느 관점으로 볼까요?',
    has: t => /관점|운영|분석|브랜드|고객|법무|재무/.test(t),
    opts: ['운영 (지속 가능한가)', '분석 (근거가 맞나)', '브랜드 (사업 축과 맞나)', '고객 관점'] },
  { key: '기간', kinds: ['analyze', 'retro'], q: '어느 기간을 볼까요?',
    has: t => /어제|오늘|지난주|이번 ?주|지난달|이번 ?달|최근\s*\d+|\d+월|올해|분기/.test(t),
    opts: ['최근 7일', '최근 30일', '지난달', '올해 전체'] },
  { key: '근거', kinds: ['analyze', 'research'], q: '무엇을 근거로 할까요?',
    has: t => /데이터|GA4|유튜브|댓글|리뷰|시트|문서|자료|링크|첨부/.test(t),
    opts: ['우리 데이터 (유튜브·GA4)', '경쟁사 공개 정보', '고객 문의·댓글', '내가 따로 줄 자료'] },
  { key: '범위', kinds: ['research'], q: '어디까지 볼까요?',
    has: t => /경쟁|채널|키워드|시장|업계|국내|해외/.test(t),
    opts: ['경쟁 채널 위주', '시장 전반', '특정 키워드'] },
  { key: '대상', kinds: ['build'], q: '무엇을 손볼까요?',
    has: t => /팀|직원|스킬|자동화|편성|규칙/.test(t),
    opts: ['팀 편성', '직원 한 명', '스킬·자동화'] },
  { key: '받을 형태', kinds: ['plan', 'write', 'review', 'retro', 'analyze', 'research', 'sales', 'build', 'publish', 'etc'],
    q: '어떤 형태로 받을까요?',
    has: t => /표로|리포트|html|문서|슬라이드|덱|목록|메모/.test(t),
    opts: ['문서 (기본)', '표로 정리', '한 장 리포트'] },
];
/** 지금 물어야 할 것 · 앞 답에 이미 있으면 빼고, 많아도 2개까지만 */
function missingSlots(d) {
  const kind = reqKind(d.text, d.to);
  return SLOTS.filter(sl => sl.kinds.includes(kind) && !sl.has(String(d.text || ''))).slice(0, 2);
}
function pickSlot(key, val) {
  const d = S.req || (S.req = {});
  d.extra = d.extra || {};
  if (d.extra[key] === val) delete d.extra[key]; else d.extra[key] = val;
  render();
}
/** 보충 답을 지시문 뒤에 붙인다 · 트루먼이 되물을 수 없으니 여기서 채워 보낸다 */
function extraBlock(d) {
  const e = d.extra || {};
  const ks = Object.keys(e).filter(k => e[k]);
  const note = String(d.note || '').trim();
  const lines = ks.map(k => `- ${k}: ${e[k]}`);
  if (note) lines.push(`- 내가 덧붙이는 것: ${note}`);
  return lines.length ? '\n\n[보충]\n' + lines.join('\n') : '';
}

/**
 * 게이트 2 · 1단계에 적은 내용을 읽고 **맡을 곳을 먼저 추천**한다 (2026-08-03 지시)
 * 전에는 팀 버튼만 나열해서, 어느 팀인지 아는 사람만 고를 수 있었다.
 * 근거는 지어내지 않고 셋 중 하나만 쓴다: 팀 업무 이름이 겹침 · 담당 방법론 분야 · 지난 배분 기록.
 */
/** 업무 종류 → 그 일을 맡는 방법론 분야 (팀 이름은 회사마다 달라 분야로 잇는다) */
const KIND_CATS = {
  write: ['03-content', '04-social'], analyze: ['07-analytics', '08-crm', '05-ads'],
  research: ['01-research', '02-product'], sales: ['09-brand-sales', '06-commerce'], build: ['10-ops'],
};
function suggestTeam(text) {
  const q = String(text || '').toLowerCase();
  if (!q.trim()) return null;
  const words = q.split(/[^0-9a-z가-힣]+/).filter(w => w.length >= 2);
  const kind = reqKind(text, null);
  const teams = teamDefs(); const work = (CFG && CFG.deptWork) || {};
  const overlap = (a, b) => {                       // "경쟁사" ↔ "경쟁 채널" 처럼 앞 두 글자만 같아도 맞는 말이다
    for (const x of a) for (const y of b) if (x.length >= 2 && y.length >= 2 && (x.startsWith(y.slice(0, 2)) || y.startsWith(x.slice(0, 2)))) return x;
    return null;
  };
  let best = null;
  for (const t of teams) {
    let score = 0, why = '';
    // ① 업무 종류가 이 팀의 담당 분야인가 (가장 센 신호 · "유튜브 성과" 를 콘텐츠팀으로 보내지 않기 위해)
    const cats = t.cats || [];
    if (KIND_CATS[kind] && cats.some(c => KIND_CATS[kind].includes(c))) {
      score = 12; why = `${(METHOD_CATS.find(m => m[0] === cats.find(c => KIND_CATS[kind].includes(c))) || [, ''])[1]} 를 맡는 팀입니다`;
    }
    // ② 그 팀이 실제로 하는 일 이름과 겹치나
    for (const w of (work[t.name] || [])) {
      const tokens = String(w.label || '').toLowerCase().split(/[^0-9a-z가-힣]+/).filter(Boolean);
      const hit = overlap(words, tokens);
      if (hit) { const sc = 6 + Math.min(hit.length, 3); if (sc > score) { score = sc; why = `이 팀 업무 "${w.label}" 과 겹칩니다`; } }
    }
    // ③ 비슷한 말을 지난번에 어디로 보냈나
    const past = TASKS.filter(x => (x.routedTo || '').includes(t.name)
      && words.some(w => String(x.prompt || '').toLowerCase().includes(w))).length;
    if (past) { const sc = 5 + past; if (sc > score) { score = sc; why = `비슷한 요청을 ${past}번 이 팀에 맡기셨습니다`; } }
    if (score > (best ? best.score : 0)) best = { name: t.name, score, why };
  }
  return best && best.score >= 6 ? best : null;
}
