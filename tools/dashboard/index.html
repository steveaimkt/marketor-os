    ${d.goalFree ? `<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px">
      ${((CFG && CFG.pillars) || []).map(p => `<span onclick="S.req.pillar='${esc(p.key)}';render()"
        style="border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;${d.pillar === p.key
          ? 'background:var(--sand);color:var(--sand-text);border:1px solid var(--sand-text)' : 'background:var(--paper);border:1px solid var(--line);color:var(--olive)'}">${esc(p.name)}</span>`).join('')}
    </div>` : d.goal ? `<div style="font-size:12px;color:var(--olive);margin-bottom:14px">이 목표에 보태는 일로 지시문에 명시됩니다${goalDone(d.goalKey)}</div>` : ''}
    ${(() => { const ms = missingSlots(d); return ms.length ? ms.map(sl => `
      <div style="margin-bottom:12px">
        <div style="font-size:12.5px;color:var(--olive);margin-bottom:6px">${sl.q}</div>
        <div style="display:flex;flex-wrap:wrap;gap:7px">
          ${sl.opts.map(o => `<span onclick="pickSlot('${esc(sl.key)}','${esc(o)}')"
            style="border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;${(d.extra || {})[sl.key] === o
              ? 'background:var(--ink);color:var(--card)' : 'background:var(--card);border:1px solid var(--line);color:var(--ink-muted)'}">${esc(o)}</span>`).join('')}
          <span onclick="pickSlot('${esc(sl.key)}','')" style="border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;background:var(--paper);border:1px dashed var(--line);color:var(--olive)">담당이 판단</span>
        </div></div>`).join('')
      : `<div style="font-size:12.5px;color:var(--olive);margin-bottom:12px">적으신 내용에 필요한 게 다 들어 있습니다 · 더 물을 것이 없습니다</div>`; })()}
    <div style="margin-bottom:12px">
      <div style="font-size:12.5px;color:var(--olive);margin-bottom:6px">더 알려 줄 것 <span style="color:var(--fade)">(선택)</span></div>
      <textarea id="reqNote" rows="2" placeholder="예: 지난번 글보다 문장 짧게 / 이 링크 참고해서 / 숫자는 실측만 써줘"
        oninput="S.req.note=this.value"
        style="width:100%;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:9px 12px;font-family:inherit;font-size:13.5px;line-height:1.6;resize:vertical;outline:none;color:var(--ink)">${esc(d.note || '')}</textarea>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;padding:6px 0;border-top:1px solid var(--line)">
      <input type="checkbox" ${d.verify ? 'checked' : ''} onchange="S.req.verify=this.checked" style="accent-color:var(--ink)">
      <span>자동 검증 · 6축 검수에 걸리면 스스로 다시 씁니다 <span style="color:var(--olive)">(비용 2~3배)</span></span></label>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="b-g" style="padding:9px 16px" onclick="reqBack()">이전</button>
      <button class="b" style="padding:9px 20px" onclick="reqNext()">확인</button></div>
  </div>`;

  const pil = ((CFG && CFG.pillars) || []).find(p => p.key === d.pillar);
  const gate4 = `<div>
    <div style="font-size:16px;font-weight:700;margin-bottom:12px">이대로 보낼까요?</div>
    <div style="background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.8">
      <div style="white-space:pre-wrap">${esc(d.text)}</div>
      ${Object.keys(d.extra || {}).filter(k => d.extra[k]).length ? `<div style="margin-top:9px;display:flex;flex-wrap:wrap;gap:6px">
        ${Object.entries(d.extra).filter(([, v]) => v).map(([k, v]) => `<span style="font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-muted)">${esc(k)} · ${esc(v)}</span>`).join('')}</div>` : ''}
      ${String(d.note || '').trim() ? `<div style="margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-muted)"><b style="color:var(--ink)">덧붙임</b> · ${esc(d.note.trim())}</div>` : ''}
      <div style="margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:13px;color:var(--olive)">
        맡을 곳 <b style="color:var(--ink)">${d.to ? esc(d.to) : '트루먼이 판단'}</b>
        · 무엇을 위해 <b style="color:var(--ink)">${d.goal ? esc(d.goal) : pil ? esc(pil.name) : '미지정'}</b>
        · ${d.verify ? '<b style="color:var(--ink)">자동 검증 켬</b>' : '자동 검증 끔'}
        · <b style="color:var(--ink)">초안까지만</b> (발행은 따로 승인)</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="b-g" style="padding:9px 16px" onclick="reqBack()">이전</button>
      <button class="b" id="reqSend" style="padding:9px 24px" onclick="sendRequest()">시키기</button></div>
  </div>`;

  return `${pulseStrip()}
  <div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">
    <div style="flex:3 1 440px;min-width:min(100%,380px)">
      <div class="c" style="padding:20px 22px;margin-bottom:14px">
        <div style="display:flex;gap:16px;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)">
          ${step(1, '무엇을')}${step(2, '누구에게')}${step(3, '어떻게')}${step(4, '확인')}
        </div>
        ${g === 1 ? gate1 : g === 2 ? gate2 : g === 3 ? gate3 : gate4}
      </div>
      ${recentReq()}
    </div>
    <div style="flex:1 1 300px;min-width:min(100%,280px)">${howToUse()}</div>
  </div>`;
}

/**
 * 오른쪽 안내 기둥 · 예전에는 여기가 미시동 업무 목록(24건)이었다.
 * 그건 팀 실행(시동) 단계의 잔소리지 매일 쓰는 화면의 몫이 아니라서 이슈 사항 화면 개선 섹션에만 남기고,
 * 이 자리는 **어떻게 말하면 되는지**를 알려주는 사용 안내로 바꿨다. (2026-08-03 지시)
 */
/**
 * "자주 하는 일" 의 기준 (2026-08-03 수리 · 대표 질문)
 * 전에는 설정에 손으로 적어 둔 flows 9개를 그냥 띄웠다. 실측해 보니 그 9개의 실제 실행은
 * **전부 0회** 였다. 그래서 기준을 바꾼다:
 *   ① 내가 2회 이상 반복해서 시킨 일 (실제 반복)
 *   ② 그다음 최근에 시켜서 산출물이 나온 일
 *   ③ 그래도 모자라면 팀 명단의 팀 업무(deptWork)로 채운다
 * 시스템이 스스로 만든 후속(승인·수정 요청·테스트)은 내 업무가 아니므로 뺀다.
 */
const NOT_MY_WORK = /^(스모크|테스트|.{0,10}(확인용|점검용|검증용|리허설)|위 초안을 승인|수정 요청|\[리더 피드백|이어서|앞 업무|.{0,12}(승인한다|승인합니다))/;
function frequentWorks(limit = 8) {
  const since = Date.now() - 60 * 86400000;
  const mine = TASKS.filter(t => (t.startedAt || 0) >= since && t.mode !== 'followup'
    && t.prompt && !NOT_MY_WORK.test(t.prompt.trim()));
  const g = {};
  for (const t of mine) {
    const k = t.prompt.replace(/\s+/g, ' ').trim().slice(0, 18);
    (g[k] = g[k] || []).push(t);
  }
  const out = [];
  for (const [, ts] of Object.entries(g)) {
    const t = ts.sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0))[0];
    const out1 = ts.some(x => x.outputFile || (x.outputFiles || []).length);
    out.push({ label: t.prompt.replace(/\s+/g, ' ').trim().slice(0, 26), text: t.prompt,
      n: ts.length, out: out1, at: t.startedAt || 0 });
  }
  out.sort((a, b) => (b.n - a.n) || (b.out - a.out) || (b.at - a.at));
  const picked = out.filter(x => x.n >= 2).concat(out.filter(x => x.n < 2 && x.out)).slice(0, limit);
  if (picked.length >= 3) return { rows: picked, from: '내 기록' };

  // 콜드 스타트: 아직 반복이 쌓이지 않았으면 팀 명단의 팀 업무를 보여 준다
  const work = Object.entries((CFG && CFG.deptWork) || {}).flatMap(([dept, ws]) => ws.map(w => ({ dept, ...w })));
  return { rows: picked.concat(work.slice(0, limit - picked.length).map(w => ({ label: w.label, text: w.label, dept: w.dept, n: 0 }))),
    from: picked.length ? '내 기록 + 팀 명단' : '팀 명단' };
}

function howToUse() {
  const teams = teamDefs();
  const work = (CFG && CFG.deptWork) || {};
  // 예시 문장은 지어내지 않고 이 회사에 실제로 배선된 팀 업무에서 가져온다
  const samples = teams.map(t => { const w = (work[t.name] || [])[0]; return w ? { dept: t.name, label: w.label } : null; })
    .filter(Boolean).slice(0, 5);
  const card = (title, body, sub) => `<div class="c" style="padding:14px 16px;margin-bottom:12px">
    <div style="font-size:13.5px;font-weight:700;margin-bottom:${sub ? '2px' : '9px'}">${title}</div>
    ${sub ? `<div style="font-size:12px;color:var(--olive);margin-bottom:9px">${sub}</div>` : ''}${body}</div>`;

  const steps = [
    ['하고 싶은 말을 그대로', '명령어를 외울 필요가 없습니다. "경쟁사 뭐 하는지 봐줘" 처럼 적으면 됩니다.'],
    ['담당은 몰라도 됩니다', '트루먼이 팀 명단를 보고 알맞은 팀에 넘깁니다. 지정하고 싶을 때만 2단계에서 고르세요.'],
    ['목표를 고르면 안 샙니다', '이번 주 목표를 고르면 그 목표에 보태는 산출물만 나오게 지시문에 박힙니다.'],
    ['나오는 건 초안까지', '발행·발송은 승인 차례에 따로 올라옵니다. 시켜 놓고 자리를 비워도 됩니다.'],
  ];
  const guide = card('쓰는 법', steps.map(([h, b], n) => `<div style="display:flex;gap:8px;padding:6px 0;${n ? 'border-top:1px solid var(--line)' : ''}">
      <span style="flex:none;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-size:10.5px;display:flex;align-items:center;justify-content:center;margin-top:2px;color:var(--olive)">${n + 1}</span>
      <span style="min-width:0"><b style="font-size:12.5px">${h}</b><div style="font-size:12px;color:var(--olive);line-height:1.55;margin-top:1px">${b}</div></span></div>`).join(''));

  const ex = samples.length ? card('이런 것도 시킬 수 있습니다', samples.map(x => `<div onclick="fillReq('${esc(x.label)}')"
      style="display:flex;gap:7px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);cursor:pointer;font-size:12.5px">
      <span style="flex:1;min-width:0" class="ell">${esc(x.label)}</span>
      <span style="flex:none;font-size:11.5px;color:var(--olive)">${esc(x.dept)}</span></div>`).join(''),
    '누르면 1단계에 채워집니다 · 편성된 팀 업무에서 가져왔습니다') : '';

  const freq = frequentWorks(6);
  const fl = freq.rows.length ? card('자주 하는 일', `<div style="display:flex;flex-direction:column;gap:1px">
      ${freq.rows.map(r => `<div onclick="fillReq(${JSON.stringify(r.text).replace(/"/g, '&quot;')})"
        style="display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);cursor:pointer;font-size:12.5px">
        <span style="flex:1;min-width:0" class="ell" title="${esc(r.text.slice(0, 200))}">${esc(r.label)}</span>
        <span style="flex:none;font-size:11.5px;color:var(--olive)">${r.n >= 2 ? r.n + '회' : (r.dept ? esc(r.dept) : '1회')}</span></div>`).join('')}
      </div>
      <button class="b-g" style="width:100%;margin-top:9px;font-size:12px;padding:6px" onclick="runTeamPick()">팀으로 돌리기</button>`,
    freq.from === '내 기록' ? '내가 2회 이상 반복한 일부터' : '아직 반복이 쌓이지 않아 팀 명단에서 보여 드립니다') : '';

  return guide + ex + fl;
}

/** 예시 문장을 1단계 입력칸에 얹는다 (덮어쓰지 않고 비어 있을 때만 채운다) */
function fillReq(text) {
  const d = S.req || (S.req = { text: '', to: null, pillar: S.pillar, goal: '', goalKey: '', goalFree: false, verify: false });
  d.text = text; S.reqGate = 1; render();
  const el = document.getElementById('reqText'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

/** 배분 결과를 한글로 · "콘텐츠팀 / content-lead" 처럼 슬러그가 그대로 섞여 나오던 것 */
function routedKo(t) {
  const raw = String(t.routedTo || '').trim();
  if (raw) return raw.split('/').map(x => { const v = x.trim(); return empName(v) || v; }).filter(Boolean).join(' · ');
  const rel = ((t.outputFiles || [])[0] || {}).rel || '';
  const seg = rel.split('/')[2] || '';
  return seg ? (empName(seg) || seg) : '기록 없음';
}

function recentReq() {
  const recent = TASKS.filter(t => t.mode === 'truman').sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0)).slice(0, 5);
  if (!recent.length) return '';
  return `<div class="c" style="padding:14px 18px">
    <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:7px">
      <span style="font-size:13.5px;font-weight:700">최근 요청</span>
      <span style="font-size:11.5px;color:var(--olive)">트루먼이 어디로 넘겼는지</span></div>
    ${recent.map(t => `<div onclick="openTask('${esc(t.id)}')" style="display:flex;gap:9px;align-items:center;padding:6px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13px">
      <span style="flex:1;min-width:0" class="ell">${esc(taskTitle(t, 48))}</span>
      <span style="flex:none;font-size:12px;color:var(--olive)">${esc(routedKo(t))}</span>
      <span style="flex:none;font-size:12px;color:${t.status === 'done' ? 'var(--ink-muted)' : t.status === 'error' ? 'var(--warn-fg)' : 'var(--olive)'}">${t.status === 'done' ? '완료' : t.status === 'error' ? '막힘' : '진행'}</span></div>`).join('')}
  </div>`;
}

/* ══ 스킬 매칭 · 요청을 보고 쓸 스킬을 골라 준다 (2026-08-03) ═══════════
   왜 필요한가: 실측에서 스킬이 붙은 업무는 전부 대표이 프롬프트에 스킬 이름을
   손으로 적은 경우였다. 시스템이 제안한 적은 0건이고, 그래서 스킬 70개 중 7개만 쓰였다.

   왜 규칙인가: LLM 에 물으면 정확하지만 12초 걸리고 건당 $0.016 이 든다.
   과거 지시 62건에 규칙을 돌려 보니 53% 를 맞췄고 (지금 실제 사용률 35%),
   못 맞춘 것 대부분은 "오늘 브리핑 해줘" 같은 조회성이라 애초에 스킬이 없어야 하는 것이었다.
   그래서 공짜로 되는 것을 돈 주고 하지 않는다. 규칙으로 부족해지면 그때 LLM 을 붙인다.

   ⚠️ 애매하면 안 고른다. 틀린 스킬을 씌우면 산출물이 더 나빠진다. */
const SKILL_RULES = [
  [/링크드인|linkedin/i,                          'my-링크드인-포스트', '링크드인 글'],
  [/뉴스레터|뉴스레터 플랫폼|newsletter/i,                  'my-뉴스레터',       '뉴스레터'],
  [/(유튜브|영상).{0,6}(대본|스크립트|제작 패키지)/i, 'my-유튜브-대본',    '유튜브 대본'],
  [/썸네일|영상 제목|제목 후보/i,                   'my-썸네일-제목',    '썸네일·제목'],
  [/강의 제안서|출강|기업 강의/i,                   'my-강의-제안서',    '강의 제안서'],
  [/\bVOD\b|오퍼 설계|상품 구성/i,                 'my-VOD-오퍼',       'VOD 오퍼'],
];
/** 이 요청에 쓸 스킬 · 못 고르면 null (억지로 고르지 않는다) */
function suggestSkill(text) {
  const t = String(text || '');
  if (!t.trim()) return null;
  if (/skills\/|my-/.test(t)) return null;        // 이미 직접 지목했으면 건드리지 않는다
  for (const [re, name, ko] of SKILL_RULES) if (re.test(t)) return { name, ko };
  return null;
}

function reqNext() {
  const d = S.req || (S.req = { text: '', to: null, pillar: S.pillar, goal: '', goalKey: '', goalFree: false, verify: false });
  const g = S.reqGate || 1;
  const note = document.getElementById('reqNote'); if (note) d.note = note.value;
  if (g === 1) {
    const el = document.getElementById('reqText');
    if (el) d.text = el.value;
    if (!d.text.trim()) return toast('무엇을 시킬지 한 줄 적어 주세요');
  }
  S.reqGate = Math.min(4, g + 1); render();
}
function reqBack() { S.reqGate = Math.max(1, (S.reqGate || 1) - 1); render(); }

/** 최근 2시간 안에 같은 지시가 있었나 (중복 실행 · 실측에서 4건 겹쳐 비용만 나갔다) */
function recentSame(text) {
  const key = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 40);
  if (key.length < 8) return null;
  return TASKS.find(t => (t.startedAt || 0) > Date.now() - 2 * 3600 * 1000
    && String(t.prompt || '').replace(/\s+/g, ' ').trim().slice(0, 40) === key) || null;
}
async function sendRequest() {
  const d = S.req || {};
  if (!d.text || !d.text.trim()) { S.reqGate = 1; render(); return toast('무엇을 시킬지 적어 주세요'); }
  if (/_{3,}/.test(d.text)) { S.reqGate = 1; render();
    return toast('지시문에 빈칸(___)이 있습니다 · 채우고 보내 주세요'); }
  const dup = recentSame(d.text);
  if (dup && !confirm(`같은 지시를 ${Math.round((Date.now() - dup.startedAt) / 60000)}분 전에 이미 시키셨습니다.\n\n${(dup.prompt || '').slice(0, 60)}\n\n또 보낼까요? (비용이 그만큼 더 듭니다)`)) return;
  const btn = document.getElementById('reqSend'); if (btn) btn.disabled = true;
  /* 고른 스킬을 지시문에 넣는다 (2026-08-03).
     실측상 스킬이 붙은 업무는 전부 프롬프트에 이름이 적힌 경우였다. 그걸 시스템이 대신한다. */
  const sg = d.skill === null ? null : suggestSkill(d.text);
  const skillLine = sg ? `\n\n[규격] \`skills/${sg.name}/SKILL.md\` 절차와 규격대로 진행해 주세요.` : '';
  const full = d.text.trim() + skillLine + extraBlock(d);
  const body = d.to
    ? { mode: 'agent', target: (teamDefs().find(t => t.name === d.to) || {}).lead, prompt: full }
    : { mode: 'truman', target: '', prompt: full };
  body.pillar = d.pillar; body.goal = d.goal || ''; body.verify = !!d.verify; body.runner = S.runner; body.allowPublish = false;
  const r = await api('/api/task', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    .then(x => x.json()).catch(e => ({ error: String(e) }));
  if (btn) btn.disabled = false;
  if (r.error) return toast(r.error);
  S.req = { text: '', to: null, pillar: S.pillar, goal: '', goalKey: '', goalFree: false, extra: {}, note: '', verify: false }; S.reqGate = 1;
  toast(d.to ? `${d.to} 에 넘겼습니다` : '트루먼에게 넘겼습니다 · 알맞은 팀으로 배분합니다');
  pollTasks(); render();
}


/* ══ 팀 · 팀 현황 + 그 팀 업무 (요청은 업무 요청하기로 · 막힘은 이슈 사항으로) ══ */
/* 팀 이름표 색 · 먹색 카드 위에서 팀을 가르는 유일한 신호라 서로 충분히 멀어야 한다.
   이름으로 고정하므로 편성 순서가 바뀌어도 그 팀 색은 그대로다. */
/* 팀 이름표 · 색상은 모래 하나, 밝기만 8단계 (색을 늘리지 않고 구분한다)
   먹색 카드 위에 얹히고 글자는 먹색이라 전부 밝은 쪽에 둔다. */
const TEAM_TONES = ['#E0CCBE', '#EFE3D9', '#D0B9A6', '#F1EDE7', '#C3A791', '#DCD6CC', '#B6997F', '#CFC7BB'];
/** 이름 해시로 고르되 같은 색이 겹치면 빈 색으로 밀어 준다 (겹치면 팀 구분이 안 된다) */
function teamToneMap(names) {
  const used = new Set(), map = {};
  names.forEach((n, i) => {
    let h = 0; for (const ch of String(n || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    let k = (n ? h : i) % TEAM_TONES.length;
    for (let step = 0; step < TEAM_TONES.length && used.has(TEAM_TONES[k]); step++) k = (k + 1) % TEAM_TONES.length;
    used.add(TEAM_TONES[k]); map[n] = TEAM_TONES[k];
  });
  return map;
}
function viewTeams() {
  if (!teamDefs().length) return noTeamYet('팀을 만들면 여기에 현황이 뜹니다');
  const depts = deptData();
  const run = runningNames();
  const cnt = {}; for (const t of TASKS) { const k = t.runnerAgent || t.target; if (k) cnt[k] = (cnt[k] || 0) + 1; }
  const w0 = new Date(); w0.setHours(0, 0, 0, 0); w0.setDate(w0.getDate() - ((w0.getDay() + 6) % 7));
  const sel = S.dept && depts.some(d => d.name === S.dept) ? S.dept : null;

  const TONES = teamToneMap(depts.map(d => d.name));
  const cards = depts.map((d, i) => {
    const ss = [d.leadSlug, ...(d.roster || [])];
    const live = ss.filter(s => cnt[s]).length;
    const mine = TASKS.filter(t => ss.includes(t.runnerAgent || t.target));
    const week = mine.filter(t => (t.startedAt || 0) >= w0.getTime()).length;
    const out = mine.filter(t => t.outputFile || (t.outputFiles || []).length).length;
    const last = mine.length ? Math.max(...mine.map(t => t.startedAt || 0)) : 0;
    const days = last ? Math.floor((Date.now() - last) / 86400000) : null;
    const never = (d.tasks || []).filter(t => !TASKS.some(x => (x.runnerAgent || x.target) === t.slug)).length;
    const pct = Math.round(live / ss.length * 100);
    const on = sel === d.name;
    const tone = TONES[d.name] || TEAM_TONES[i % TEAM_TONES.length];
    // 카드는 전부 먹색 · 팀을 가르는 건 이름표 색 하나다 (2026-08-03 지시)
    // 전에는 카드 배경색이 상태(정상·경고)를 나타내서, 팀 구분과 상태 신호가 같은 자리에서 싸웠다.
    return `<div onclick="pickDept('${esc(on ? '' : d.name)}')" style="background:var(--ink);border-radius:12px;padding:13px 15px;cursor:pointer;
      border:1px solid ${on ? 'var(--card)' : 'var(--on-dark-line)'};${on ? 'box-shadow:0 0 0 2px rgba(255,255,255,.35)' : 'box-shadow:var(--sh-1)'}">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="display:inline-flex;align-items:center;gap:6px;background:${tone};color:var(--ink);
          border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700">
          ${d.live ? '<span class="live-dot sm" style="background:var(--ink)"></span>' : `<span style="width:6px;height:6px;border-radius:50%;background:rgba(42,42,40,.45);display:inline-block"></span>`}${esc(d.name)}</span>
        <span style="font-size:14px;font-weight:700;color:var(--card)">${ss.length}</span>
        <span style="margin-left:auto;font-size:12px;font-weight:600;color:${pct < 30 ? 'var(--on-dark-warn)' : 'var(--on-dark-live)'}">가동 ${live}/${ss.length}</span></div>
      <div style="font-size:12px;color:var(--on-dark-sub);margin-top:8px" class="ell">${(d.cats || []).map(c => (METHOD_CATS.find(m => m[0] === c) || [, c])[1]).join(' + ') || '방법론 미지정'}</div>
      <div style="display:flex;gap:12px;margin-top:9px;font-size:12px;color:var(--on-dark-sub)">
        ${(() => { const own = TASKS.filter(t => ss.includes(t.runnerAgent || t.target));
          const wait = own.filter(t => needsApproval(t)).length;
          const run = own.filter(t => t.status === 'running').length;
          return `${run ? `<span style="color:var(--card)">도는 중 <b>${run}</b></span>` : ''}
            ${wait ? `<span style="background:var(--highlight);color:var(--ink);border-radius:5px;padding:0 6px;font-weight:700">확인 ${wait}</span>` : ''}`; })()}
        <span>일 <b style="color:var(--card)">${(d.tasks || []).length}</b></span>
        <span>산출 <b style="color:var(--card)">${out}</b></span>
        <span style="margin-left:auto;color:${days === null || days > 14 ? 'var(--on-dark-warn)' : 'var(--on-dark-sub)'}">${days === null ? '아직 안 씀' : days === 0 ? '오늘' : days + '일 전'}</span></div>
      ${never ? `<div style="margin-top:7px;font-size:11.5px;color:var(--on-dark-warn)">안 시켜 본 일 ${never}건</div>` : ''}
    </div>`;
  }).join('');

  const selD = sel ? depts.find(d => d.name === sel) : null;
  const totM = depts.reduce((a, d) => a + (d.roster || []).length + 1, 0);

  /* 일이 어떻게 흐르는지 그린다 (2026-08-04 지시).
     실측: 트루먼이 받은 29건 중 28건을 직접 처리했고 그때 스킬 사용률이 6% 였다
     (디렉터 경유는 50%). 흐름이 안 보이면 트루먼에게만 던지게 된다.
     그래서 "트루먼은 넘기는 사람" 이라는 걸 화면이 먼저 말한다. */
  const routed = TASKS.filter(t => t.routedTo).length;
  const toTruman = TASKS.filter(t => /orchestrator/.test(t.target || t.runnerAgent || '')).length;
  const step = (t, sub, tone) => `<div style="flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:${tone || 'var(--card)'}">
    <div style="font-size:13px;font-weight:700">${t}</div>
    <div style="font-size:11.5px;color:var(--olive);margin-top:2px;line-height:1.5">${sub}</div></div>`;
  const arrow = `<span style="flex:none;color:var(--fade);font-size:15px">→</span>`;
  const flowBox = `<div class="c" style="padding:14px 18px;margin-bottom:12px">
    <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:10px">
      <span style="font-size:13.5px;font-weight:700">일이 흐르는 길</span>
      <span style="font-size:11.5px;color:var(--olive)">어디로 보내든 마지막엔 팀이 합니다</span></div>
    <div style="display:flex;gap:8px;align-items:stretch;flex-wrap:wrap">
      ${step('트루먼', '어디로 보낼지 모를 때 · <b>받아서 넘깁니다</b>', 'var(--paper-warm)')}
      ${arrow}
      ${step('디렉터', '그 분야를 맡습니다 · 담당 스킬을 쥐고 있습니다')}
      ${arrow}
      ${step('팀원', '실제로 만듭니다 · 문서가 남습니다')}
    </div>
    <div style="font-size:11.5px;color:var(--olive);margin-top:9px;line-height:1.6">
      팀을 알면 <b style="color:var(--ink)">디렉터에게 바로</b> 보내는 게 빠릅니다 · 트루먼은 한 칸을 더 거칩니다.<br>
      ${toTruman ? `지금까지 트루먼이 받은 ${toTruman}건 중 팀에 넘긴 기록은 <b style="color:${routed ? 'var(--ink)' : 'var(--warn-fg)'}">${routed}건</b>입니다.` : ''}
    </div></div>`;

  return `${pulseStrip()}
  ${flowBox}
  <div class="c" style="padding:12px 18px;margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <span onclick="S.chatRoom=TRUMAN_ROOM;go('chat')" style="display:inline-flex;align-items:center;gap:7px;cursor:pointer;
      background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600" title="어디로 보낼지 모를 때 트루먼이 받아 알맞은 팀에 넘깁니다">
      트루먼 <span style="opacity:.6;font-weight:400">모든 요청의 입구</span></span>
    <span><b style="font-size:18px">${depts.length}</b><span style="font-size:12.5px;color:var(--olive)"> 팀</span></span>
    <span><b style="font-size:18px">${totM}</b><span style="font-size:12.5px;color:var(--olive)"> 명</span></span>
    <span><b style="font-size:18px">${depts.reduce((a, d) => a + (d.tasks || []).length, 0)}</b><span style="font-size:12.5px;color:var(--olive)"> 시킬 수 있는 일</span></span>
    ${(() => { const ops = depts.find(d => (d.roster || []).some(r => /reviewer|auditor|council/.test(r)));
      const n = ops ? (ops.roster || []).filter(r => /reviewer|auditor|council/.test(r)).length : 0;
      return n ? `<span onclick="pickDept('${esc(ops.name)}')" style="font-size:12.5px;color:var(--olive);text-decoration:underline;cursor:pointer"
        title="관점별 검수·규제 검사·자문단은 전사에 붙는 참모입니다">검토층 ${n}명 · ${esc(ops.name)} 소속</span>` : ''; })()}
    <span style="margin-left:auto;font-size:12.5px;color:var(--olive)">${sel ? `${esc(sel)} 만 보는 중 · 다시 누르면 전체` : '팀을 누르면 그 팀 업무만 봅니다'}</span></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:${selD ? '12px' : '18px'}">${cards}</div>
  ${selD ? `<div style="margin-bottom:18px">${deptPanel(selD, run)}</div>` : ''}
  ${workBoard(sel)}`;
}

/** 업무 보드 · 진행 중 / 확인 / 완료 / 보관 (막힘은 이슈 사항 화면) */
function workBoard(deptName) {
  const inTeam = (t) => {
    if (!deptName) return true;
    const d = deptData().find(x => x.name === deptName); if (!d) return true;
    return [d.leadSlug, ...(d.roster || [])].includes(t.runnerAgent || t.target);
  };
  const all = TASKS.filter(inTeam);
  const g = { requested: [], checking: [], done: [], archived: [], blocked: [] };
  for (const t of all) g[lifecycle(t)].push(t);
  const recent = (a, b) => (b.endedAt || b.startedAt || 0) - (a.endedAt || a.startedAt || 0);
  const oldest = (a, b) => (a.endedAt || a.startedAt || 0) - (b.endedAt || b.startedAt || 0);
  g.checking.sort(oldest); g.done.sort(recent); g.archived.sort(recent);
  // 손보관은 실측 4% 뿐이고 완료는 날마다 쌓인다 → 7일 지난 완료는 열에서 내려 아래 접기로 (상태 변경 없음)
  const WEEK = 7 * 86400000;
  const doneOld = g.done.filter(t => (Date.now() - (t.endedAt || t.startedAt || Date.now())) > WEEK);
  g.done = g.done.filter(t => !doneOld.includes(t));
  const who = t => deptOf(t.target) || empName(t.target);
  const mins = t => { const m = Math.round((Date.now() - t.startedAt) / 60000); return m < 1 ? '방금' : m + '분째'; };
  const STALE = 3 * 86400000;
  const card = (t, extra) => `<div class="c" style="padding:10px 12px;margin-bottom:8px${
    needsApproval(t) && (Date.now() - (t.endedAt || t.startedAt || Date.now())) > STALE
      ? ';border-left:4px solid var(--highlight)' : ''}">
    <div onclick="openTask('${esc(t.id)}')" style="cursor:pointer">
      <div style="font-size:13px;font-weight:600;line-height:1.5" class="ell">${esc(softenText((t.approvals && t.approvals[0]) || t.prompt || t.target || ''))}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11.5px;color:var(--olive)">
        <span class="ell">${esc(who(t))}</span>${pillarDot(t.pillar)}${needsApproval(t) ? waitedFor(t) : ''}
        ${(t.outputFiles || []).length || t.outputFile ? `<span style="flex:none">📄 ${(t.outputFiles || []).length || 1}</span>` : ''}
        ${t.publishedAt ? '<span style="color:var(--ink);font-weight:700;flex:none">✓ 올림</span>' : ''}
        <span style="margin-left:auto;flex:none">${t.status === 'running' ? mins(t) : hhmm(t.endedAt || t.startedAt)}</span></div></div>
    ${extra ? `<div style="display:flex;gap:5px;margin-top:7px;flex-wrap:wrap">${extra}</div>` : ''}</div>`;
  const B = (l, on, cls = 'b-g') => `<button class="${cls} b-s" style="font-size:11.5px;padding:4px 9px" onclick="${on}">${l}</button>`;
  // 내 차례(확인)는 더 많이 · 지나간 것은 적게 (실측: 확인 31건인데 4개만 보였다)
  const cap = S.workAll ? 99 : 4;
  const capWait = S.workAll ? 99 : 10;
  const more = a => a.length > cap ? `<div onclick="S.workAll=true;render()" style="font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer;padding:3px 0">그 외 ${a.length - cap}건</div>` : '';
  const col = (title, n, st, body, hint, grow) => `<div style="${tintBox(st)};padding:12px 13px;flex:${grow || 1};min-width:0">
    <div style="margin-bottom:10px">${chip(title, n, st)}</div>
    ${body || `<div style="border:1px dashed var(--line);border-radius:9px;padding:14px;font-size:12px;color:var(--olive);line-height:1.6;text-align:center">${hint}</div>`}</div>`;

  const stale = g.checking.filter(t => (Date.now() - (t.endedAt || t.startedAt || Date.now())) > 3 * 86400000).length;
  const unpub = g.done.filter(t => (t.outputFile || (t.outputFiles || []).length) && !t.publishedAt).length;
  return `${g.checking.length || g.blocked.length ? `<div class="c" style="padding:11px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <span style="font-size:13.5px;font-weight:700">지금 내가 할 것</span>
      ${g.checking.length ? `<span style="font-size:13px">확인 <b>${g.checking.length}</b>건${stale ? ` · <span style="background:var(--highlight);color:var(--ink);border-radius:5px;padding:1px 7px;font-weight:700">3일 넘은 것 ${stale}</span>` : ''}</span>` : ''}
      ${unpub ? `<span style="font-size:13px;color:var(--ink-muted)">아직 안 올린 산출물 <b>${unpub}</b>건</span>` : ''}
      ${g.blocked.length ? `<span onclick="go('issues')" style="font-size:13px;color:var(--warn-fg);cursor:pointer;text-decoration:underline">막힌 업무 ${g.blocked.length}건</span>` : ''}
      <span style="margin-left:auto;font-size:12px;color:var(--olive)">${deptName ? esc(deptName) + ' 만 보는 중' : '전체 팀'}</span></div>` : ''}
  <div style="display:flex;gap:12px;align-items:flex-start">
    ${col('진행 중', g.requested.length, 'live', g.requested.slice(0, cap).map(t => card(t, B('중단', `stopTaskUi('${esc(t.id)}')`))).join('') + more(g.requested), '지금 도는 업무가 없습니다', 1)}
    ${col('확인', g.checking.length, 'wait', g.checking.slice(0, capWait).map(t => card(t, B('확인함', `confirmTask('${esc(t.id)}')`, 'b') + B('말로 이어서', `openTask('${esc(t.id)}')`))).join('')
      + (g.checking.length > capWait && !S.workAll ? `<div onclick="S.workAll=true;render()" style="font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer;padding:3px 0">그 외 ${g.checking.length - capWait}건</div>` : ''), '확인할 것이 없습니다', 1.7)}
    ${col('완료', g.done.length, 'done', g.done.slice(0, cap).map(t => card(t,
      ((t.outputFile || (t.outputFiles || []).length) && !t.publishedAt
        ? B('복사', `copyFinal('${esc(t.outputFile || (t.outputFiles[0] || {}).rel || '')}')`) + B('올린 링크', `markPublishedUi('${esc(t.id)}')`, 'b') : '')
      + B('보관', `archiveTaskUi('${esc(t.id)}')`))).join('') + more(g.done), '완료된 업무가 없습니다', 1)}
  </div>
  ${doneOld.length ? `<details style="margin-top:12px"><summary style="cursor:pointer;list-style:none;font-size:12.5px;color:var(--olive)">지난 완료 ${doneOld.length}건 ⌄ <span style="font-size:11.5px">· 7일이 지나 열에서 내렸습니다</span></summary>
    <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:9px">${doneOld.slice(0, 20).map(t => `<span onclick="openTask('${esc(t.id)}')"
      style="font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;cursor:pointer">${esc(taskTitle(t, 26))}</span>`).join('')}
      ${doneOld.length > 20 ? `<span style="font-size:12px;color:var(--olive);align-self:center">그 외 ${doneOld.length - 20}건</span>` : ''}</div></details>` : ''}
  ${g.archived.length ? `<details style="margin-top:12px"><summary style="cursor:pointer;list-style:none;font-size:12.5px;color:var(--olive)">보관 ${g.archived.length}건 ⌄ <span style="font-size:11.5px">· 되돌릴 수 있습니다</span></summary>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:9px">${g.archived.slice(0, 12).map(t => `<div style="display:flex;gap:9px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 11px">
      <span onclick="openTask('${esc(t.id)}')" style="flex:1;min-width:0;font-size:12.5px;cursor:pointer" class="ell">${esc(taskTitle(t, 40))}</span>
      <span style="flex:none;font-size:11.5px;color:var(--olive)">${esc(deptOf(t.target) || empName(t.target))}</span>
      <button class="b-g b-s" style="flex:none;font-size:11.5px;padding:4px 9px" onclick="restoreTaskUi('${esc(t.id)}')">되돌리기</button></div>`).join('')}
      ${g.archived.length > 12 ? `<div style="font-size:12px;color:var(--olive)">그 외 ${g.archived.length - 12}건</div>` : ''}</div></details>` : ''}
  ${g.blocked.length ? `<div onclick="go('issues')" class="c-warn" style="padding:11px 16px;margin-top:14px;cursor:pointer;display:flex;align-items:center;gap:10px">
    <span style="font-size:13.5px;font-weight:700;color:var(--warn)">막힌 업무 ${g.blocked.length}건</span>
    <span style="font-size:12.5px;color:var(--olive)">이슈 사항 화면에서 원인별로 봅니다</span>
    <span style="margin-left:auto;font-size:12.5px;color:var(--olive)">이슈로 →</span></div>` : ''}`;
}

/* ══ 이슈 · 막힌 것과 고쳐야 할 것 ═══════════════════════════════════ */
function viewIssues() {
  const now = Date.now();
  const blocked = TASKS.filter(t => t.status === 'error');
  const stopped = TASKS.filter(t => t.status === 'stopped');
  const stale = TASKS.filter(t => needsApproval(t) && (now - (t.endedAt || t.startedAt || now)) > 3 * 86400000);
  const unpub = TASKS.filter(t => t.status === 'done' && !needsApproval(t) && (t.outputFile || (t.outputFiles || []).length) && !t.publishedAt);
  const ranTargets = new Set(TASKS.map(t => t.runnerAgent || t.target));
  const never = Object.entries(((CFG && CFG.deptWork) || {})).flatMap(([dept, ws]) => ws.map(w => ({ ...w, dept }))).filter(w => !ranTargets.has(w.target));
  const idleTeams = deptData().filter(d => {
    const ss = [d.leadSlug, ...(d.roster || [])];
    const mine = TASKS.filter(t => ss.includes(t.runnerAgent || t.target));
    if (!mine.length) return true;
    return (now - Math.max(...mine.map(t => t.startedAt || 0))) > 14 * 86400000;
  });

  // 막힘 사유별 묶기 · 같은 원인이면 한 번에 고친다
  const byCause = {};
  for (const t of blocked) {
    const c = /시간 초과|초과로 중단/.test(t.error || '') ? '시간 초과'
      : /서버 재시작|프로세스가 종료/.test(t.error || '') ? '서버 재시작 중 끊김'
      : (t.error || '사유 기록 없음').slice(0, 40);
    (byCause[c] = byCause[c] || []).push(t);
  }

  // 업무 현황 페이지와 같은 흰 카드를 쓴다 (2026-08-03 지시).
  // 먹색 상자를 쓰던 시절엔 이 화면만 색이 달라 다른 제품처럼 보였다.
  // 상태 색은 배경이 아니라 이름표(chip)가 맡는다 · 뜻 하나에 색 하나 규칙 유지.
  const sec = (state, title, n, desc, body) => `<div class="c" style="padding:14px 16px;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:8px">${chip(title, n, state)}</div>
    <div style="font-size:12px;color:var(--olive);margin:7px 0 9px">${desc}</div>
    <div>${body}</div></div>`;
  const row = (t, act) => `<div style="display:flex;gap:9px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px">
    <span onclick="openTask('${esc(t.id)}')" style="flex:1;min-width:0;cursor:pointer" class="ell">${esc(taskTitle(t, 56))}</span>
    <span style="flex:none;font-size:11.5px;color:var(--olive)">${esc(deptOf(t.target) || empName(t.target))}</span>
    ${waitedFor(t)}${act || ''}</div>`;
  const B = (l, on, cls = 'b-g') => `<button class="${cls} b-s" style="font-size:11.5px;padding:4px 9px;flex:none" onclick="${on}">${l}</button>`;

  const solve = [];
  if (blocked.length) solve.push(sec('warn', '막힌 업무', blocked.length, '원인별로 묶었습니다. 같은 원인이면 한 번에 고칩니다.',
    Object.entries(byCause).map(([c, ts]) => `<div style="margin-bottom:9px">
      <div style="font-size:12.5px;font-weight:600;color:var(--warn-fg);margin-bottom:2px">${esc(c)} · ${ts.length}건</div>
      ${ts.map(t => row(t, B('다시', `rerunTask('${esc(t.id)}')`) + B('보관', `archiveTaskUi('${esc(t.id)}')`))).join('')}
    </div>`).join('')));
  if (stopped.length) solve.push(sec('calm', '중단한 업무', stopped.length, '내가 멈춘 것입니다. 다시 돌리거나 보관합니다.',
    stopped.slice(0, 6).map(t => row(t, B('다시', `rerunTask('${esc(t.id)}')`) + B('보관', `archiveTaskUi('${esc(t.id)}')`))).join('')));
  if (stale.length) solve.push(sec('wait', '3일 넘게 확인 안 한 것', stale.length, '내가 막고 있는 지점입니다. 확인만 하면 흐릅니다.',
    stale.map(t => row(t, B('확인함', `confirmTask('${esc(t.id)}')`, 'b'))).join('')));

  const improve = [];
  if (unpub.length >= 5) improve.push(sec('wait', '만들었는데 안 올린 것', unpub.length,
    '산출물이 시스템 안에만 있습니다. 한두 건이라도 실제로 올려 보면 회로가 도는지 알 수 있습니다.',
    unpub.slice(0, 6).map(t => row(t, B('복사', `copyFinal('${esc(t.outputFile || (t.outputFiles[0] || {}).rel || '')}')`) + B('올린 링크', `markPublishedUi('${esc(t.id)}')`, 'b'))).join('')));
  if (never.length) improve.push(sec('calm', '한 번도 안 시켜 본 일', never.length,
    '편성은 했는데 안 써 본 일입니다. 팀이 있는데 안 도는 가장 흔한 원인입니다.',
    `<div style="display:flex;flex-wrap:wrap;gap:6px">${never.slice(0, 10).map(w => `<button class="b-g" style="font-size:12.5px;padding:6px 11px" title="${esc(w.dept)}"
      onclick="orderToW('${esc(w.dept)}',${(((CFG && CFG.deptWork) || {})[w.dept] || []).findIndex(x => x.label === w.label)})">${esc(w.label)}</button>`).join('')}</div>`));
  if (idleTeams.length) improve.push(sec('calm', '2주 넘게 조용한 팀', idleTeams.length,
    '편성이 과했거나 시동이 안 걸린 것입니다. 「팀 피드백하자」가 어느 쪽인지 가려 줍니다.',
    idleTeams.map(d => `<div style="display:flex;gap:9px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px">
      <span style="flex:1;min-width:0">${esc(d.name)} · 팀원 ${(d.roster || []).length}</span>
      <span onclick="S.dept='${esc(d.name)}';go('teams')" style="flex:none;font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer">팀 보기</span></div>`).join('')));

  const total = blocked.length + stopped.length + stale.length;
  return `${pulseStrip()}
  <div style="display:flex;gap:16px;align-items:flex-start">
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;color:var(--olive);margin-bottom:9px">해결해야 하는 업무 ${total}건</div>
      ${solve.join('') || '<div class="c" style="padding:18px;font-size:13.5px;color:var(--olive)">막히거나 밀린 업무가 없습니다.</div>'}
    </div>
    <div style="width:400px;flex:none">
      <div style="font-size:13px;color:var(--olive);margin-bottom:9px">개선하면 좋은 것 ${improve.length}가지</div>
      ${improve.join('') || '<div class="c" style="padding:18px;font-size:13.5px;color:var(--olive)">지금 개선할 지점이 보이지 않습니다.</div>'}
    </div>
  </div>`;
}


/* ══ 자산 · 스킬100 · 내 맞춤 · 자동화 · 외부 도구 ═══════════════════ */
function viewAssets() {
  const methods = (STRUCT && STRUCT.methods) || [];
  const map = (CFG && CFG.skillMap) || {};
  const off = new Set((CFG && CFG.skillsOff) || []);
  const used = {}; for (const t of TASKS) if (t.skillUsed) used[t.skillUsed] = (used[t.skillUsed] || 0) + 1;
  const conn = CONN || {};
  const jobs = JOBS || [];
  const mcpRows = (conn.rows || []);
  const mcpOn = mcpRows.filter(r => r.state === 'ok').length;
  const mcpNeeds = mcpRows.filter(r => r.state === 'needs').length;
  const mcpAgent = mcpRows.filter(r => r.state === 'agent' || (!r.state && r.detail)).length;
  const mine = Object.entries(map).map(([id, name]) => ({ id, name, n: used[name] || 0 })).sort((a, b) => b.n - a.n);
  // 실제로 켜져 있는 예약만 센다 · 등록 수를 "도는 것" 으로 말하지 않는다 (2026-08-03)
  const jobsOn = jobs.filter(j => {
    const s = STATUS && STATUS.jobs ? STATUS.jobs.find(x => x.label === j.label) : null;
    return s ? s.loaded : j.installed;
  }).length;

  const head = (label, n, state, sub) => `<div style="display:flex;align-items:center;gap:10px;margin-bottom:11px">
    ${chip(label, n, state)}<span style="font-size:12.5px;color:var(--olive)">${sub}</span></div>`;

  return `${pulseStrip()}
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px">
    ${[['마케팅 스킬', methods.length, 'done', `${off.size ? off.size + '개 꺼둠' : '전부 켜짐'}`],
       ['내 맞춤 스킬', mine.length, mine.length ? 'live' : 'calm', `실사용 ${mine.reduce((a, s) => a + s.n, 0)}회`],
       ['자동화 업무', jobsOn, jobsOn ? 'live' : 'calm', `등록 ${jobs.length}개 중 켜짐`],
       ['외부 도구', mcpRows.length, mcpNeeds ? 'warn' : mcpRows.length ? 'live' : 'calm',
        mcpRows.length ? `확인됨 ${mcpOn} · 에이전트 경유 ${mcpAgent}${mcpNeeds ? ` · 손볼 것 ${mcpNeeds}` : ''}` : '아직 점검 전']]
      .map(([l, n, st, sub]) => `<div style="${tintBox(st)};padding:14px 16px">
        <div style="font-size:12.5px;color:var(--olive)">${l}</div>
        <div style="font-size:26px;font-weight:800;line-height:1.2;margin-top:2px">${n}</div>
        <div style="font-size:11.5px;color:var(--olive);margin-top:2px">${sub}</div></div>`).join('')}
  </div>

  <div style="display:flex;gap:16px;align-items:flex-start">
    <div style="flex:1;min-width:0">
      <div class="c" style="padding:16px 18px;margin-bottom:14px">
        ${head('마케팅 스킬', methods.length, 'done', '번호·이름으로 찾아 바로 시킬 수 있습니다')}
        <input id="mq" placeholder="번호·이름으로 찾기 (예: 024, 뉴스레터, 경쟁사)" value="${esc(S.methodQ || '')}"
          oninput="S.methodQ=this.value;render();setTimeout(()=>{const e=document.getElementById('mq');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},0)"
          style="width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:9px 12px;font-family:inherit;font-size:13.5px;outline:none;margin-bottom:10px">
        ${methodList(methods, map, off)}
      </div>
    </div>
    <div style="width:360px;flex:none">
      <div class="c" style="padding:16px 18px;margin-bottom:14px">
        ${head('내 맞춤 스킬', mine.length, mine.length ? 'live' : 'calm', '정본에서 내려받아 우리 방식으로 굳힌 것')}
        ${mine.length ? mine.map(s => `<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px">
          <span class="mono" style="flex:none;color:var(--olive);width:30px">${esc(s.id)}</span>
          <span style="flex:1;min-width:0" class="ell">${esc(s.name)}</span>
          <span style="flex:none;font-size:12px;color:${s.n ? 'var(--ink)' : 'var(--fade)'}">${s.n}회</span>
          <span onclick="openOrder('skill','${esc(s.name)}','${esc(s.name)}')" style="flex:none;font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer">시키기</span></div>`).join('')
          : '<div style="font-size:13px;color:var(--olive);line-height:1.7">아직 없습니다.<br>왼쪽 목록에서 <b>내 것으로</b>를 누르면 우리 방식 맞춤본이 만들어집니다.</div>'}
        <button class="b-g" style="width:100%;margin-top:10px;font-size:12.5px;padding:7px" onclick="addMySkill()">+ 내 맞춤 스킬 추가하기</button>
      </div>
      <!-- 자동화·외부 도구 목록은 여기 두지 않는다 (2026-08-03 중복 정리).
           같은 목록을 조작 없이 한 번 더 그리고 있었다 · 정본은 각각 자동화 업무 탭과 설정 탭이다. -->
      <div class="c" style="padding:16px 18px;margin-bottom:14px">
        <div style="font-size:12.5px;color:var(--olive);margin-bottom:9px">이 팀이 쓰는 나머지</div>
        <div onclick="go('automation')" style="display:flex;gap:9px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px">
          <span style="flex:1">자동화 업무</span>
          <b style="flex:none">${jobsOn}개 돌고 있음</b>
          <span style="flex:none;font-size:11.5px;color:var(--olive)">보기 ›</span></div>
        <div onclick="go('settings')" style="display:flex;gap:9px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px">
          <span style="flex:1">외부 도구</span>
          <b style="flex:none">${mcpRows.length ? `확인됨 ${mcpOn}` : '점검 전'}</b>
          <span style="flex:none;font-size:11.5px;color:${mcpNeeds ? 'var(--warn-fg)' : 'var(--olive)'}">${mcpNeeds ? `손볼 것 ${mcpNeeds} ›` : '보기 ›'}</span></div>
      </div>
    </div>
  </div>`;
}

/**
 * 맞춤 스킬 만들기 · 방법론 번호를 알면 그 정본에서 내려받고, 모르면 하고 싶은 일로 시작한다.
 * 실제 제작은 구축실(skill-builder)이 하고, 등록까지 끝나면 이 화면에 뜬다.
 */
async function addMySkill() {
  const want = window.prompt('어떤 일을 우리 방식으로 굳힐까요?\n방법론 번호를 알면 번호만 적으셔도 됩니다.\n예: 023 / 링크드인 글 쓰는 우리 방식 / 제안서 표지 규격');
  if (!want || !want.trim()) return;
  const num = (want.match(/\b(\d{3})\b/) || [])[1];
  const r = await api('/api/task', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ mode: 'agent', target: 'skill-builder', runner: S.runner, pillar: 'ops', allowPublish: false,
      prompt: `내 맞춤 스킬을 하나 만들어 주세요.\n원하는 것: ${want.trim()}\n`
        + (num ? `정본은 방법론 ${num} 입니다 (100-skills/*/skills/${num}-*/SKILL.md). 정본은 고치지 않고 사본을 만듭니다.\n` : '해당하는 정본 방법론이 있으면 그것을 바탕으로, 없으면 새로 설계해 주세요.\n')
        + `- 착지: skills/{회사}-{주제}/SKILL.md\n- 우리 원칙(brand/ 참고)을 강제 조항으로 넣어 주세요\n`
        + `- 다 만들면 brand/dashboard.json 의 skillMap 에 등록하고, 등록 결과를 마지막 줄에 알려 주세요` }) })
    .then(x => x.json()).catch(e => ({ error: String(e) }));
  if (r.error) return toast(r.error);
  toast('구축실이 맞춤 스킬을 만듭니다 · 끝나면 여기에 뜹니다'); pollTasks();
}

/**
 * 자동화 업무 만들기 · 이 맥은 iCloud 경로라 로컬 예약이 막혀 있어(권한 오류)
 * 설계까지만 하고 어디서 돌릴지는 사람이 정하도록 ⏸ 로 올린다.
 */
async function addAutoJob() {
  const want = window.prompt('무엇을 자동으로 돌릴까요?\n언제·무엇을·어디로 보낼지 한 줄로 적어 주세요.\n예: 매일 아침 8시에 경쟁 채널 새 영상 정리해서 디스코드로');
  if (!want || !want.trim()) return;
  const r = await api('/api/task', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ mode: 'agent', target: 'ops-lead', runner: S.runner, pillar: 'ops', allowPublish: false,
      prompt: `자동화 업무를 하나 설계해 주세요.\n원하는 것: ${want.trim()}\n`
        + `- 무엇을·언제·누가(담당 직원)·어디로 보낼지를 표로 정리해 주세요\n`
        + `- 이 맥은 iCloud 경로라 로컬 예약(launchd)이 권한 오류로 실패합니다. 돌릴 곳 후보(VPS·클라우드 루틴)를 함께 적어 주세요\n`
        + `- 실제 등록은 하지 않고, 마지막 줄에 "⏸ 승인 필요: 자동화 등록" 을 남겨 주세요` }) })
    .then(x => x.json()).catch(e => ({ error: String(e) }));
  if (r.error) return toast(r.error);
  toast('구축실이 자동화 설계를 만듭니다 · 등록 전에 승인 차례로 올라옵니다'); pollTasks();
}

/* ══ 피드백 · 팀 운영 / 주간 / 월간 ═══════════════════════════════════ */
/* ══ 업무 그래프 · 어디에 일이 몰리고 어디서 새는가 (2026-08-03 지시) ══════
   외부 라이브러리 없이 막대만 쓴다. 숫자를 못 센 항목은 지어내지 않고 비운다. */
function barRow(label, n, max, tone, right) {
  const w = max ? Math.max(2, Math.round(n / max * 100)) : 0;
  return `<div style="display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12.5px">
    <span style="flex:none;width:92px;color:var(--ink-muted)" class="ell" title="${esc(label)}">${esc(label)}</span>
    <span style="flex:1;min-width:0;height:9px;border-radius:5px;background:var(--paper);overflow:hidden">
      <span style="display:block;height:100%;width:${w}%;background:${tone};border-radius:5px"></span></span>
    <span style="flex:none;width:52px;text-align:right;color:var(--olive)">${right != null ? right : n}</span></div>`;
}
/**
 * 최근 14일 · 요청과 완료를 **나란히** 세운다 (2026-08-03 수리)
 * 전에는 한 칸에 요청 막대와 완료 막대를 위아래로 쌓아, 둘 다 높은 날에는
 * 68+68+라벨 = 148px 이 96px 상자를 뚫고 나가 레이아웃이 깨졌다.
 */
function trendChart() {
  const H = 72;   // 막대가 쓸 수 있는 최대 높이
  const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (13 - i)); return d; });
  const rows = days.map(d => {
    const s = d.getTime(), e = s + 86400000;
    return { d,
      req: TASKS.filter(t => (t.startedAt || 0) >= s && (t.startedAt || 0) < e).length,
      don: TASKS.filter(t => t.status === 'done' && (t.endedAt || 0) >= s && (t.endedAt || 0) < e).length };
  });
  const mx = Math.max(1, ...rows.flatMap(r => [r.req, r.don]));
  const bar = (n, tone) => `<span style="flex:1;min-width:2px;height:${n ? Math.max(3, Math.round(n / mx * H)) : 0}px;background:${tone};border-radius:2px 2px 0 0"></span>`;
  return `<div style="display:flex;gap:5px;align-items:flex-end;height:${H + 4}px;overflow:hidden">
    ${rows.map(r => `<div style="flex:1;min-width:0;height:100%;display:flex;gap:1.5px;align-items:flex-end;justify-content:center"
      title="${r.d.getMonth() + 1}/${r.d.getDate()} · 요청 ${r.req} · 완료 ${r.don}">${bar(r.req, 'var(--ink)')}${bar(r.don, TINT.live.dot)}</div>`).join('')}
  </div>
  <div style="display:flex;gap:5px;margin-top:4px">
    ${rows.map(r => `<div style="flex:1;min-width:0;font-size:9.5px;color:var(--fade);text-align:center">${r.d.getDate()}</div>`).join('')}
  </div>
  <div style="font-size:11.5px;color:var(--olive);margin-top:6px">왼쪽 검정 = 요청 · 오른쪽 초록 = 완료 · 최근 14일 (최대 ${mx}건)</div>`;
}

function workCharts() {
  const depts = deptData();
  const box = (title, sub, body) => `<div class="c" style="padding:14px 16px;min-width:0">
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:9px">
      <span style="font-size:13.5px;font-weight:700">${title}</span>
      <span style="font-size:11.5px;color:var(--olive)">${sub}</span></div>${body}</div>`;

  // ① 어느 팀에 일이 몰리나
  const byTeam = depts.map(d => {
    const ss = [d.leadSlug, ...(d.roster || [])];
    return { name: d.name, n: TASKS.filter(t => ss.includes(t.runnerAgent || t.target)).length };
  }).sort((a, b) => b.n - a.n);
  const mxT = Math.max(1, ...byTeam.map(x => x.n));
  const TONES = teamToneMap(depts.map(d => d.name));
  const teamBox = box('어느 팀에 몰리나', `업무 ${TASKS.length}건`,
    byTeam.map(x => barRow(x.name, x.n, mxT, TONES[x.name] || 'var(--ink)')).join('') || '<div style="font-size:12px;color:var(--olive)">아직 기록이 없습니다</div>');

  // ② 무엇을 위한 일이었나 (방향)
  const pil = ((CFG && CFG.pillars) || []).map(p => ({ name: p.name, tone: p.tone || 'var(--ink)', n: TASKS.filter(t => t.pillar === p.key).length }));
  const none = TASKS.filter(t => !t.pillar).length;
  if (none) pil.push({ name: '방향 없음', tone: 'var(--fade)', n: none });
  const mxP = Math.max(1, ...pil.map(x => x.n));
  const pilBox = box('무엇을 위한 일이었나', '방향별',
    pil.sort((a, b) => b.n - a.n).map(x => barRow(x.name, x.n, mxP, x.tone)).join(''));

  /* ③ 무엇을 자동화할까 · 반복되는 업무를 시스템이 찾아 올린다 (2026-08-03 지시)
     전에는 "어디서 새나"(비효율 신호)가 있던 자리다. 그 숫자들은 봐도 다음 행동이
     없었다. 이 대시보드가 하는 일은 반복을 찾아 자동화로 넘기는 것이라, 같은 자리에
     "그래서 무엇을 자동화하면 되나" 를 놓는다.

     ⚠️ 반복 횟수로만 줄 세우지 않는다.
     실측에서 반복 1위 ops-lead 는 조직 정리·인사 감사였다. 내부 관리라 매출에 안 붙는다.
     그래서 기둥(무엇을 위한 일인가)을 같이 보여 주고, 방향 없는 것은 아래로 내린다. */
  const candPillar = (c) => {
    const runs = TASKS.filter(t => (t.target || t.runnerAgent) === c.target && t.pillar);
    if (!runs.length) return null;
    const cnt = {}; runs.forEach(t => cnt[t.pillar] = (cnt[t.pillar] || 0) + 1);
    const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
    return pillarInfo(top[0]);
  };
  const cands = CAND.map(c => ({ ...c, pi: candPillar(c) }))
    .sort((a, b) => (b.pi ? 1 : 0) - (a.pi ? 1 : 0) || b.runs - a.runs);
  const autoBox = box('무엇을 자동화할까', cands.length ? `추천 ${cands.length}건` : (WARMING.length ? `다가오는 것 ${WARMING.length}건` : '아직 없음'),
    cands.length ? cands.map(c => `<div style="padding:7px 0;border-top:1px solid var(--line);font-size:12.5px">
      <div style="display:flex;align-items:baseline;gap:7px">
        <span style="flex:1;min-width:0" class="ell">${esc(empName(c.target) || c.target)}</span>
        <b style="flex:none">${c.runs}회</b>
        <span style="flex:none;font-size:11px;color:var(--olive)">${c.days}일</span></div>
      <div style="display:flex;align-items:baseline;gap:6px;margin-top:3px">
        ${c.pi ? `<span style="flex:none;font-size:11px;border-radius:999px;padding:1px 8px;background:var(--paper);color:${c.pi.tone || 'var(--olive)'}">${esc(c.pi.name)}</span>`
               : `<span style="flex:none;font-size:11px;color:var(--fade)">방향 없음</span>`}
        <span style="flex:1;min-width:0;font-size:11.5px;color:${c.next === 'skill' ? 'var(--ink-muted)' : TINT.live.fg}" class="ell">${c.next === 'skill'
          ? `먼저 스킬로 굳히기 · 지금 스킬 ${c.skillRate}%` : `자동화 가능 · 스킬 ${c.skillRate}%`}</span></div></div>`).join('')
      + `<div style="font-size:11px;color:var(--olive);margin-top:8px;line-height:1.6">같은 담당을 3회 이상 · 다른 날에 시킨 것입니다.<br>절차가 안 굳었으면 자동화보다 <b style="color:var(--ink-muted)">스킬로 굳히기</b>가 먼저입니다.</div>`
    : (WARMING.length ? `<div style="font-size:12px;color:var(--olive);line-height:1.6;margin-bottom:8px">아직 임계를 넘은 것이 없습니다 · 다가오는 것 ${WARMING.length}건</div>`
        + WARMING.slice(0, 5).map(w => `<div style="padding:6px 0;border-top:1px solid var(--line);font-size:12.5px">
          <div style="display:flex;align-items:baseline;gap:7px">
            <span style="flex:1;min-width:0" class="ell">${esc(w.sig)}…</span>
            <b style="flex:none">${w.runs}회</b>
            <span style="flex:none;font-size:11px;color:var(--olive)">${esc(w.need)}</span></div>
          <div style="font-size:11px;color:var(--fade);margin-top:2px">${esc(empName(w.target) || w.target)}</div></div>`).join('')
        + `<div style="font-size:11px;color:var(--olive);margin-top:8px;line-height:1.6">같은 지시를 <b style="color:var(--ink-muted)">3회 이상 · 다른 날에</b> 시키면 후보가 됩니다.<br>임계를 낮추지 않습니다 · 자동화는 되돌리기 어렵습니다.</div>`
      : `<div style="font-size:12px;color:var(--olive);line-height:1.7">아직 반복이 잡히지 않았습니다.<br>
         같은 지시를 <b style="color:var(--ink-muted)">3회 이상 · 다른 날에</b> 시키면 여기 올라옵니다.</div>`));

  /* 비효율 지표는 박스를 자동화 추천에 내주고 한 줄로 줄였다 (2026-08-03).
     지우지는 않는다 · 효율 관리가 이 대시보드의 나머지 절반이다.
     여섯 개를 나열하던 것에서 다음 행동이 있는 셋만 남긴다. */
  const doneT = TASKS.filter(t => t.status === 'done');
  const errN = TASKS.filter(t => t.status === 'error').length;
  const waits = TASKS.filter(t => needsApproval(t)).map(t => Date.now() - (t.endedAt || t.startedAt || Date.now()));
  const avgWait = waits.length ? Math.round(waits.reduce((a, b) => a + b, 0) / waits.length / 3600000) : null;
  const w0 = new Date(); w0.setHours(0, 0, 0, 0); w0.setDate(w0.getDate() - ((w0.getDay() + 6) % 7));
  const wk = TASKS.filter(t => (t.startedAt || 0) >= w0.getTime());
  const weekCost = wk.reduce((a, t) => a + (t.cost || 0), 0);
  const unpub = doneT.filter(t => (t.outputFile || (t.outputFiles || []).length) && !t.publishedAt).length;
  const sig = (l, v, bad) => `<span style="display:inline-flex;align-items:baseline;gap:5px">
    <span style="color:var(--olive)">${l}</span><b style="color:${bad ? TINT.warn.fg : 'var(--ink)'}">${v}</b></span>`;
  const costLine = `<div class="c" style="padding:9px 16px;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;align-items:baseline">
    ${sig('이번 주 비용', `${money(weekCost) || '$0'} · ${wk.length}건`, weekCost > 50)}
    ${sig('확인 대기', avgWait == null ? '없음' : avgWait + '시간', avgWait != null && avgWait > 48)}
    ${sig('안 올린 것', unpub + '건', unpub > 5)}
    ${sig('막힘', errN + '건', errN > 0)}
    <span style="margin-left:auto;font-size:11px;color:var(--olive)">건당 평균 ${money(wk.length ? weekCost / wk.length : 0) || '$0'}</span></div>`;

  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:12px">
      ${teamBox}${pilBox}${autoBox}</div>
    ${costLine}
    <div class="c" style="padding:14px 16px">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:9px">
        <span style="font-size:13.5px;font-weight:700">언제 일했나</span>
        <span style="font-size:11.5px;color:var(--olive)">요청과 완료가 벌어지면 밀리는 중입니다</span></div>
      ${trendChart()}</div>`;
}

/* ══ 자동화 업무 · 사람 없이 도는 것 (2026-08-03 분리) ═══════════════════
   전에는 같은 내용이 두 곳에 있었다.
     · 설정 탭 "자동화 예약"  · 목록 + 켜기·끄기·즉시실행 (조작 있음)
     · 팀 도구 탭 "자동화 업무" · 같은 목록을 보기만 (조작 없음 · 켜짐 표시도 깨져 있었음)
   둘을 여기 하나로 합쳤다. 조작이 있는 쪽이 정본이라 그쪽을 살리고 사본을 지웠다.

   ⚠️ 숫자는 실제로 도는 것만 센다.
   예전 팀 도구 배지는 예약 9 + 하네스 9 = 18 을 "사람 없이 도는 것" 이라고 했는데,
   실측하면 예약 9개 중 켜진 건 2개였고 하네스 9건은 스케줄러가 아니라 업무 양식이다.
   지어낸 숫자를 쓰지 않는다는 헌법에 걸려 셋을 갈라 놓는다. */
function viewAutomation() {
  const jobs = JOBS || [];
  const liveOf = (j) => {
    const s = STATUS && STATUS.jobs ? STATUS.jobs.find(x => x.label === j.label) : null;
    return { on: s ? s.loaded : j.installed, schedule: (s && s.schedule) || j.schedule || '' };
  };
  const on = jobs.filter(j => liveOf(j).on);
  const off = jobs.filter(j => !liveOf(j).on);
  const verifyN = TASKS.filter(t => t.verify).length;
  const harness = Object.entries((CFG && CFG.deptWork) || {})
    .flatMap(([dept, arr]) => (arr || []).filter(w => w.harness).map(w => ({ dept, name: w.name || w.label || '' })));

  const tile = (l, n, sub, st) => `<div style="${tintBox(st)};padding:14px 16px">
    <div style="font-size:12.5px;color:var(--olive)">${l}</div>
    <div style="font-size:26px;font-weight:800;line-height:1.2;margin-top:2px">${n}</div>
    <div style="font-size:11.5px;color:var(--olive);margin-top:2px">${sub}</div></div>`;

  /* 라벨만 보면 무슨 일인지 모른다 (2026-08-03 지시).
     com.marketing-os.daily-briefing 을 봐도 뭘 돌리는지 알 수 없어서
     "무슨 일인지" 를 눌러 실제 명령·시각·로그 경로를 펼쳐 볼 수 있게 한다. */
  const jobRow = (j) => {
    const { on: isOn, schedule } = liveOf(j);
    const when = (j.at && j.at.length) ? j.at.join(', ') : j.interval ? `${j.interval}초마다` : (schedule || '시각 미지정');
    return `<div style="padding:11px 0;border-top:1px solid var(--line)">
      <div style="display:flex;align-items:center;gap:10px;font-size:14.5px">
        ${ic('clock', 15, isOn ? 'var(--ink)' : 'var(--fade)')}
        <span style="flex:1;min-width:0">
          <span class="ell" style="display:block;${isOn ? '' : 'color:var(--fade)'}">${esc(jobKo(j.label))}</span>
          <span class="ell" style="display:block;font-size:11.5px;color:var(--olive);margin-top:1px">${esc(when)}${j.does ? ' · ' + j.does : ''}</span></span>
        ${isOn ? `<button class="b-g b-s" onclick="jobAction('${esc(j.label)}','unload')">끄기</button>
                  <button class="b-g b-s" onclick="jobAction('${esc(j.label)}','run')">지금 실행</button>`
               : `<button class="b-g b-s" onclick="jobAction('${esc(j.label)}','load')">켜기</button>`}
      </div>
      <details style="margin-top:6px">
        <summary style="cursor:pointer;list-style:none;font-size:11.5px;color:var(--olive)">무슨 일인지 ⌄</summary>
        <div style="margin-top:6px;padding:9px 11px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:11.5px;line-height:1.7">
          <div style="color:var(--olive)">하는 일</div>
          <div style="margin-bottom:6px">${j.does ? esc(j.does) : '<span style="color:var(--fade)">스크립트에 설명이 없습니다</span>'}</div>
          <div style="color:var(--olive)">이름</div>
          <div class="mono" style="word-break:break-all;margin-bottom:6px">${esc(j.label)}</div>
          <div style="color:var(--olive)">돌리는 명령</div>
          <div class="mono" style="word-break:break-all;margin-bottom:6px">${esc(j.cmd || '(plist 에서 못 읽었습니다)')}</div>
          ${j.stdout ? `<div style="color:var(--olive)">로그</div>
            <div class="mono" style="word-break:break-all">${esc(String(j.stdout).replace(/^\/Users\/[^/]+/, '~'))}</div>` : ''}
        </div>
      </details>
    </div>`;
  };

  return `${pulseStrip()}
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px">
    ${tile('실제로 도는 것', on.length, `등록 ${jobs.length}개 중`, on.length ? 'live' : 'warn')}
    ${tile('하네스 업무', harness.length, '부를 때 도는 업무 양식', 'calm')}
    ${tile('자동 검증 루프', verifyN, '지금까지 사용 횟수', verifyN ? 'done' : 'calm')}
  </div>

  <div style="display:flex;gap:16px;align-items:flex-start">
    <div style="flex:1;min-width:0">
      <div class="c" style="padding:20px 22px;margin-bottom:14px">
        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px">
          <span style="font-size:17px;font-weight:600">예약 (이 맥)</span>
          <span style="font-size:14px;color:var(--olive)">${jobs.length}개 등록 · ${on.length}개 켜짐</span>
        </div>
        <div style="font-size:14px;color:var(--olive);line-height:1.65;margin-bottom:6px">맥에서 도는 예약은 잠자기와 권한 문제로 실패가 잦습니다. 24시간 돌려야 하는 일은 VPS 로 올리는 것이 맞습니다.</div>
        ${jobs.length ? `${on.map(jobRow).join('')}
          ${off.length ? `<div style="margin-top:14px;font-size:12.5px;color:var(--olive)">꺼져 있는 것 ${off.length}개</div>${off.map(jobRow).join('')}` : ''}`
          : `<div class="empty" style="margin-top:10px">등록된 자동화가 없습니다.<br>
             이 맥은 iCloud 경로라 로컬 예약(launchd)이 권한 오류로 실패합니다. 24시간 작업은 VPS 로 보냅니다.</div>`}
        <button class="b-g" style="width:100%;margin-top:12px;font-size:12.5px;padding:8px" onclick="addAutoJob()">+ 자동화 업무 추가하기</button>
        ${GBRAIN_PENDING ? `<button class="b-g" style="width:100%;margin-top:7px;font-size:12.5px;padding:8px"
          onclick="pushGbrain()" title="반복으로 분류한 것만 gbrain 에 기록합니다 · 모아서 한 번에 올립니다">gbrain 에 올리기 (${GBRAIN_PENDING}건)</button>` : ''}
      </div>
    </div>

    <div style="width:360px;flex:none">
      <div class="c" style="padding:16px 18px;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:11px">
          ${chip('하네스 업무', harness.length, 'calm')}
          <span style="font-size:12.5px;color:var(--olive)">여러 명이 나눠 맡는 업무 양식</span></div>
        <div style="font-size:12.5px;color:var(--olive);line-height:1.6;margin-bottom:8px">예약이 아닙니다. 부를 때 도는 표준 편성이라 스스로 시작하지 않습니다.</div>
        ${harness.length ? harness.map(h => `<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px">
          <span style="flex:none;font-size:11.5px;color:var(--olive);width:64px" class="ell">${esc(h.dept)}</span>
          <span style="flex:1;min-width:0" class="ell">${esc(h.name)}</span></div>`).join('')
          : '<div style="font-size:13px;color:var(--olive)">아직 없습니다.</div>'}
      </div>

      <div class="c" style="padding:16px 18px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
          ${chip('자동 검증 루프', verifyN, verifyN ? 'done' : 'calm')}
          <span style="font-size:12.5px;color:var(--olive)">스스로 되돌아본 횟수</span></div>
        <div style="font-size:12.5px;color:var(--olive);line-height:1.6">산출물을 낸 뒤 스스로 한 번 더 검토하게 하는 장치입니다. 지시할 때 켤 수 있습니다.</div>
      </div>
    </div>
  </div>`;
}

function viewFeedback() {
  const now = Date.now();
  const w0 = new Date(); w0.setHours(0, 0, 0, 0); w0.setDate(w0.getDate() - ((w0.getDay() + 6) % 7));
  const m0 = new Date(); m0.setHours(0, 0, 0, 0); m0.setDate(1);
  const week = TASKS.filter(t => (t.startedAt || 0) >= w0.getTime());
  const month = TASKS.filter(t => (t.startedAt || 0) >= m0.getTime());
  const depts = deptData();
  const cnt = {}; for (const t of TASKS) { const k = t.runnerAgent || t.target; if (k) cnt[k] = (cnt[k] || 0) + 1; }
  const rostered = depts.flatMap(d => [d.leadSlug, ...(d.roster || [])]);
  const liveN = rostered.filter(s => cnt[s]).length;
  const unpub = TASKS.filter(t => t.status === 'done' && (t.outputFile || (t.outputFiles || []).length) && !t.publishedAt).length;
  const pub = TASKS.filter(t => t.publishedAt).length;
  const last = (key) => {
    const t = TASKS.filter(x => (x.prompt || '').includes(key)).sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0))[0];
    return t ? new Date(t.startedAt).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' }) : null;
  };

  const card = (title, state, when, desc, stats, prompt, hint) => `<div style="${tintBox(state)};padding:16px 18px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      ${chip(title, '', state)}
      <span style="margin-left:auto;font-size:12px;color:var(--olive)">${when}</span></div>
    <div style="font-size:13.5px;color:var(--ink-muted);line-height:1.7;margin:8px 0 12px">${desc}</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px">
      ${stats.map(([l, v, t]) => `<span style="font-size:12.5px;color:var(--olive)">${l} <b style="font-size:15px;color:${t || 'var(--ink)'}">${v}</b></span>`).join('')}
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="b" onclick="askFeedback(${JSON.stringify(prompt).replace(/"/g, '&quot;')})">피드백 받기</button>
      <span style="font-size:12px;color:var(--olive)">${hint}</span></div>
  </div>`;

  const idle = depts.filter(d => {
    const ss = [d.leadSlug, ...(d.roster || [])];
    const mine = TASKS.filter(t => ss.includes(t.runnerAgent || t.target));
    return !mine.length || (now - Math.max(...mine.map(t => t.startedAt || 0))) > 14 * 86400000;
  }).length;

  return `${pulseStrip()}
  <div>
    <div style="font-size:13px;color:var(--olive);margin-bottom:12px">
      팀이 잘 굴러가는지 봐 드립니다. 셋 다 <b>묻기 전에 먼저 셉니다</b> · 결과는 고칠 것 3개 이내로 옵니다.</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start">

    ${card('팀 운영 피드백', idle ? 'warn' : 'live', last('팀 피드백') ? `마지막 ${last('팀 피드백')}` : '아직 안 받음',
      '편성이 실제로 도는지 봅니다. 가동률 · 팀별 처리량 · 막힌 곳 · 끝맺음 · 배관 · 성장 트리거 6종을 실측한 뒤, 편성이 과한지 시동이 안 걸린 건지 가려 줍니다.',
      [['가동', `${liveN}/${rostered.length}`, liveN / rostered.length < 0.3 ? 'var(--warn)' : null],
       ['조용한 팀', idle, idle ? 'var(--warn)' : null],
       ['발행', `${pub}/${pub + unpub}`, pub / (pub + unpub || 1) < 0.2 ? 'var(--warn)' : null]],
      'skills/팀-피드백/SKILL.md 절차대로 진단해 주세요. 되묻지 않고 실측 6종(가동률·팀별 처리량·막힌 곳·끝맺음·배관·성장 트리거)을 먼저 센 뒤 판정하고, 고칠 것 3개 이내로 ⏸ 승인을 올려 주세요. 측정 못 한 항목은 비워 둡니다.',
      '매달 한 번')}

    ${card('주간 업무 피드백', 'wait', `이번 주 ${week.length}건`,
      '이번 주에 시킨 일이 방향에 맞았는지, 무엇이 밀렸는지 봅니다. 다음 주에 무엇부터 할지 3건으로 정리해 줍니다.',
      [['요청', week.length], ['완료', week.filter(t => t.status === 'done').length],
       ['산출물', week.filter(t => t.outputFile || (t.outputFiles || []).length).length],
       ['막힘', week.filter(t => t.status === 'error').length, week.filter(t => t.status === 'error').length ? 'var(--warn)' : null]],
      '이번 주 업무를 회고해 주세요. outputs/tasks 기록에서 이번 주(월요일 이후) 요청·완료·산출물·막힘을 실측하고, 전략 기둥별로 어디에 시간이 갔는지 대조해 주세요. 그다음 (1) 잘 된 것 1개 (2) 밀린 것과 이유 (3) 다음 주에 먼저 할 3건 을 정리해 주세요. 없는 수치는 비워 둡니다.',
      '금요일 또는 주말에')}

    ${card('월간 업무 피드백', 'done', `이번 달 ${month.length}건`,
      '한 달 치를 전략 기둥별로 갈라 봅니다. 돈이 나오는 축에 시간이 갔는지, 성장 트리거가 임계에 닿았는지 확인합니다.',
      [['요청', month.length], ['완료', month.filter(t => t.status === 'done').length],
       ['발행', month.filter(t => t.publishedAt).length, month.filter(t => t.publishedAt).length === 0 ? 'var(--warn)' : null],
       ['비용', money(month.reduce((a, t) => a + (t.cost || 0), 0)) || '$0']],
      '이번 달 업무를 회고해 주세요. outputs/tasks 기록에서 이번 달 요청·완료·발행·비용을 실측하고 전략 기둥(brand/dashboard.json > pillars)별로 나눠 주세요. 그다음 (1) 기둥별 시간 배분이 계획과 맞는지 (2) 성장 트리거(brand/my-team.md)가 임계에 닿았는지 (3) 다음 달 바꿀 것 3개 를 정리해 주세요. 실측 못 한 값은 "측정 안 됨"으로 남깁니다.',
      '월말에')}
    </div>
    <div style="font-size:13px;color:var(--olive);margin:16px 0 10px">지금 업무가 어떻게 흐르고 있는지 · 아래 숫자는 전부 실제 기록에서 센 것입니다</div>
    ${workCharts()}
  </div>`;
}

async function askFeedback(prompt) {
  const r = await api('/api/task', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ mode: 'agent', target: 'ops-lead', prompt, pillar: 'ops', runner: S.runner, allowPublish: false }) })
    .then(x => x.json()).catch(e => ({ error: String(e) }));
  if (r.error) return toast(r.error);
  toast('구축실에 피드백을 요청했습니다 · 결과는 팀 협업 화면 확인 열에 옵니다');
  pollTasks();
}

/**
 * 팀 상세 패널 · 3단 (2026-08-03 개편)
 * 전에는 한 줄에 항목 하나씩 전폭으로 깔려 넓은 화면에서 이름과 "시키기" 사이가 2,000px 벌어졌다.
 * 지금은 시킬 수 있는 일 · 팀원 · 방법론/규칙 을 나란히 세워 그 여백을 내용으로 채운다.
 * 지운 것: "조직 정리" 버튼 (구축실 업무 "조직 진단·정리"와 같은 일 · 중복)
 */
function deptPanel(d, run) {
  const members = [{ a: d.lead, role: '디렉터' }, ...d.members.map(m => ({ a: m, role: '팀원' }))].filter(x => x.a);
  const offSk = new Set((CFG && CFG.skillsOff) || []);
  const cats = methodCats(d.leadSlug);
  const ms = ((STRUCT && STRUCT.methods) || []).filter(m => cats.includes(m.category) && !offSk.has(m.slug));
  const mine = ms.filter(m => ((CFG && CFG.skillMap) || {})[m.id]).length;
  const rules = ((CFG && CFG.teamRules) || {})[d.name] || [];
  const head = (t, n, right) => `<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:5px">
    <span style="font-size:12.5px;font-weight:700">${t}</span><span style="font-size:12px;color:var(--olive)">${n}</span>
    ${right || ''}</div>`;
  const link = (label, on, color) => `<span onclick="${on}" style="flex:none;font-size:11.5px;color:var(--${color || 'olive'});text-decoration:underline;cursor:pointer">${label}</span>`;

  const colWork = `<div>${head('시킬 수 있는 일', (d.tasks || []).length)}
    ${(d.tasks || []).map((t, i) => `<div style="display:flex;gap:7px;align-items:center;padding:4px 0;border-top:1px solid var(--line);font-size:13px">
      <span style="flex:1;min-width:0" class="ell" title="${esc(t.label)}">${esc(t.label)}${t.harness ? ' <span style="font-size:10.5px;color:var(--olive);border:1px solid var(--line);border-radius:4px;padding:0 3px">팀</span>' : ''}</span>
      ${link('시키기', `orderToW('${esc(d.name)}',${i})`)}</div>`).join('') || '<div style="font-size:12px;color:var(--olive)">아직 없습니다</div>'}</div>`;

  const colMem = `<div>${head('팀원', members.length)}
    ${members.map(p => `<div style="display:flex;gap:6px;align-items:center;padding:4px 0;border-top:1px solid var(--line);font-size:13px">
      ${run.has(p.a.name) ? '<span class="live-dot sm"></span>' : '<span style="width:6px;height:6px;border-radius:50%;background:var(--fade);opacity:.35;flex:none"></span>'}
      <span style="flex:1;min-width:0" class="ell" title="${esc(koDesc(p.a))}">${esc(agentLabel(p.a))}</span>
      ${link('시키기', `openOrder('agent','${esc(p.a.name)}','${esc(agentLabel(p.a))}')`)}
      ${p.role === '팀원' ? link('빼기', `archiveMember('${esc(p.a.name)}','${esc(agentLabel(p.a))}')`, 'fade') : ''}</div>`).join('')}
    ${d.bench && d.bench.length ? `<div style="margin-top:7px;font-size:12px;color:var(--olive)">대기 ${d.bench.length}명 ·
      ${d.bench.map(a => `<span onclick="promoteMember('${esc(d.name)}','${esc(a.name)}')" style="text-decoration:underline;cursor:pointer">${esc(agentLabel(a))}</span>`).join(' · ')}</div>` : ''}
    <button class="b-g" style="width:100%;margin-top:8px;font-size:12.5px;padding:6px" onclick="hireMember('${esc(d.name)}')">+ 직원</button></div>`;

  const colSkill = `<div>
    ${ms.length ? `<details>
      <summary style="cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:6px;margin-bottom:5px">
        <span style="font-size:12.5px;font-weight:700">방법론</span><span style="font-size:12px;color:var(--olive)">${ms.length}</span>
        <span style="font-size:12px;color:${mine ? 'var(--live)' : 'var(--olive)'}">내 맞춤 ${mine}</span>
        <span style="margin-left:auto;font-size:11.5px;color:var(--olive)">펼치기 ⌄</span></summary>
      <div style="max-height:200px;overflow-y:auto">
      ${ms.map(m => { const my = ((CFG && CFG.skillMap) || {})[m.id]; return `<div style="display:flex;gap:6px;align-items:center;padding:3px 0;border-top:1px solid var(--line);font-size:12px">
        <span class="mono" style="flex:none;color:var(--olive)">${esc(m.id)}</span>
        <span style="flex:1;min-width:0" class="ell">${esc(m.name)}</span>
        ${my ? `<span onclick="openOrder('skill','${esc(my)}','${esc(m.name)}')" style="flex:none;color:var(--ink);font-weight:600;text-decoration:underline;cursor:pointer">맞춤본</span>`
             : `<span onclick="makeMySkill('${esc(m.id)}','${esc(m.name)}')" style="flex:none;color:var(--olive);text-decoration:underline;cursor:pointer">내 것으로</span>`}</div>`; }).join('')}
      </div></details>` : ''}
    <div style="margin-top:${ms.length ? '10px' : '0'}">${head('팀 규칙', rules.length)}
    ${rules.map((r, i) => `<div style="display:flex;gap:5px;font-size:12px;padding:3px 0;border-top:1px solid var(--line);line-height:1.5">
      <span style="color:var(--olive);flex:none">${i + 1}</span><span style="flex:1;min-width:0">${ruleHtml(r.text)}</span>
      <span onclick="dropTeamRule('${esc(d.name)}',${i})" style="color:var(--fade);cursor:pointer;flex:none">✕</span></div>`).join('')
      || '<div style="font-size:12px;color:var(--olive)">업무 보고의 "피드백을 규칙으로"가 여기에 쌓입니다</div>'}</div></div>`;

  return `<div class="c-sel" style="padding:14px 16px">
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">
      <span style="font-size:15px;font-weight:700">${esc(d.name)}</span>
      <span style="font-size:12px;color:var(--olive)">${(d.cats || []).map(c => (METHOD_CATS.find(m => m[0] === c) || [, c])[1]).join(' + ')}</span>
      <span onclick="openRoom('${esc(d.name)}')" style="margin-left:auto;font-size:12.5px;color:var(--olive);text-decoration:underline;cursor:pointer">미팅 방 열기</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 22px;align-items:start">
      ${colWork}${colMem}${colSkill}
    </div>
  </div>`;
}

/* ── ② 업무 · 요청 → 확인 → 완료 → 보관 ────────────────────────────── */

/**
 * 방법론 100 목록 · 찾아서 바로 시킬 수 있게 (2026-08-03).
 * 전에는 카테고리별 집계만 보여 줘서 "무엇이 있는지" 를 알 수 없었다.
 * 검색어가 있으면 전체에서 찾고, 없으면 카테고리 아코디언으로 접어 둔다.
 */
function methodList(methods, map, off) {
  const q = (S.methodQ || '').trim().toLowerCase();
  const row = (m) => {
    const mine = map[m.id];
    const team = teamDefs().find(t => (t.cats || []).includes(m.category));
    const isOff = off.has(m.slug);
    return `<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px;${isOff ? 'opacity:.45' : ''}">
      <span class="mono" style="flex:none;color:var(--olive);width:30px">${esc(m.id)}</span>
      <span style="flex:1;min-width:0" class="ell" title="${esc((m.desc || '').slice(0, 160))}">${esc(m.name)}</span>
      ${m.gate ? '<span style="flex:none;font-size:11px;color:var(--sand-text)" title="발행 전 규제 검수 대상">⛔</span>' : ''}
      <span style="flex:none;width:76px;font-size:11.5px;color:var(--olive)" class="ell">${team ? esc(team.name) : '담당 없음'}</span>
      <span onclick="openMethodFile('${esc(m.file)}','${esc(m.name)}')" style="flex:none;font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer">보기</span>
      ${mine
        ? `<span onclick="openOrder('skill','${esc(mine)}','${esc(m.name)} (내 맞춤)')" style="flex:none;font-size:12px;color:var(--ink);font-weight:600;text-decoration:underline;cursor:pointer">맞춤본으로</span>`
        : `<span onclick="makeMySkill('${esc(m.id)}','${esc(m.name)}')" style="flex:none;font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer">내 것으로</span>`}
      <span onclick="openOrder('method','${esc(m.id)}','${esc(m.name)}')" style="flex:none;font-size:12px;color:var(--ink);text-decoration:underline;cursor:pointer">시키기</span>
    </div>`;
  };
  if (q) {
    const hit = methods.filter(m => (m.id + ' ' + m.name + ' ' + (m.desc || '')).toLowerCase().includes(q));
    return `<div style="font-size:12px;color:var(--olive);margin-bottom:4px">${hit.length}개 찾음</div>`
      + (hit.slice(0, 40).map(row).join('') || '<div style="font-size:13px;color:var(--olive)">찾는 방법론이 없습니다.</div>');
  }
  return METHOD_CATS.map(([key, ko]) => {
    const ms = methods.filter(m => m.category === key);
    const mine = ms.filter(m => map[m.id]).length;
    const team = teamDefs().find(t => (t.cats || []).includes(key));
    return `<details style="border-top:1px solid var(--line)">
      <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13.5px">
        <span style="font-weight:600">${esc(ko)}</span>
        <span style="color:var(--olive)">${ms.length}</span>
        ${mine ? `<span style="font-size:11.5px;color:var(--ink)">내 맞춤 ${mine}</span>` : ''}
        <span style="margin-left:auto;font-size:11.5px;color:var(--olive)">${team ? esc(team.name) : '담당 팀 없음'} ⌄</span>
      </summary>
      <div style="padding-bottom:8px">${ms.map(row).join('')}</div>
    </details>`;
  }).join('');
}

      3. 그 회사에 맞는 팀 편성을 제안합니다 <span style="color:var(--olive)">(승인 전에는 아무것도 안 바꿉니다)</span><br>
      4. 승인하시면 이 화면에 팀이 생깁니다

    <button class="b" style="margin-top:16px" onclick="openOrder('truman','','트루먼')">팀 구축하자</button>

      여기서 시작하면 <b>편성안까지</b> 만들어 드립니다 (되묻지 못하는 화면이라 그렇습니다).<br>
      질문에 답하며 제대로 짜려면 클로드 코드에서 <b>"팀 구축하자"</b> 라고 말씀해 주세요 · 게이트 6개를 하나씩 밟습니다.</div>
    <div style="font-size:13px;color:var(--olive);margin-top:9px">
      위 버튼을 누르고 <b>"팀 구축하자"</b> 라고 적어 보내시면 됩니다.${where ? ' · ' + esc(where) : ''}</div>
  </div>`;

/* ── 명령 팔레트 (⌘K) ──────────────────────────────────────────────
   이번 대화에서 관찰된 패턴을 근거로 넣었다.
     · 어디에 무엇이 있는지 물어서 찾는 일이 많았다 → 검색으로 바로 간다
     · 누를 수 있는지 모르고 지나친 것이 있었다 → 팔레트에 전부 노출한다
     · 엔터로 보내기를 원했다 → 키보드만으로 끝까지 갈 수 있게 한다
   ---------------------------------------------------------------- */
let PAL_OPEN = false, PAL_SEL = 0, PAL_ITEMS = [];

function palSource() {
  const out = [];
  // 1) 화면 이동
  NAV.forEach((n, i) => out.push({
    kind: '이동', label: n.label, hint: '화면 ' + (i + 1), run: () => go(n.key),
  }));
  // 2) 지금 결정할 것 · 진행 중 업무 (바로 열기)
  for (const t of TASKS.filter(x => x.status === 'running' || (x.approvals && x.approvals.length)).slice(0, 6)) {
    out.push({ kind: t.status === 'running' ? '진행 중' : '승인 대기',
      label: (t.prompt || t.target).slice(0, 46), hint: deptOf(t.target) || t.target,
      run: () => openTask(t.id) });
  }
  // 3) 방법론 100
  for (const m of (STRUCT && STRUCT.methods) || []) {
    out.push({ kind: '매뉴얼', label: m.name, hint: m.id,
      run: () => runMethod(m.id, m.name) });
  }
  // 4) 담당자에게 시키기
  for (const a of (STRUCT && STRUCT.agents) || []) {
    out.push({ kind: '직원', label: agentLabel(a), hint: deptOf(a.name) || '', run: () => openOrder('agent', a.name, agentLabel(a)) });
  }
  // 6) 자주 하는 동작
  out.push(
    { kind: '동작', label: '트루먼에게 말하기', hint: '무엇이든', run: () => openOrder('truman', '', '트루먼') },
    { kind: '동작', label: '도구 연결 다시 점검', hint: '실제로 찔러 본다', run: () => recheckConn() },
    { kind: '동작', label: '정의 파일 고치기', hint: '직원과 매뉴얼', run: () => openEditor() },
  );
  return out;
}

/** 느슨한 부분 일치 · 한글 초성까지는 안 가고 포함 검사로 충분하다 */
function palFilter(q) {
  const all = palSource();
  if (!q.trim()) return all.filter(x => x.kind === '이동' || x.kind === '동작' || x.kind === '승인 대기' || x.kind === '진행 중').slice(0, 14);
  const t = q.trim().toLowerCase();
  return all.filter(x => (x.label + ' ' + x.hint + ' ' + x.kind).toLowerCase().includes(t)).slice(0, 40);
}

function openPal() {
  PAL_OPEN = true; PAL_SEL = 0;
  $('#palBg').style.display = 'block';
  $('#pal').style.display = 'flex';
  const q = $('#palQ'); q.value = ''; renderPal(); q.focus();
}
function closePal() {
  PAL_OPEN = false;
  $('#palBg').style.display = 'none';
  $('#pal').style.display = 'none';
}
function renderPal() {
  PAL_ITEMS = palFilter($('#palQ').value);
  if (PAL_SEL >= PAL_ITEMS.length) PAL_SEL = Math.max(0, PAL_ITEMS.length - 1);
  $('#palList').innerHTML = PAL_ITEMS.length
    ? PAL_ITEMS.map((x, i) => `<div class="pitem ${i === PAL_SEL ? 'on' : ''}" onclick="palRun(${i})" onmousemove="palHover(${i})">
        <span class="k">${esc(x.kind)}</span>

function palRun(i) {
  const x = PAL_ITEMS[i]; if (!x) return;
  closePal();
  try { x.run(); } catch (e) { toast('실행하지 못했습니다'); }
}
function palKey(e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); PAL_SEL = Math.min(PAL_SEL + 1, PAL_ITEMS.length - 1); renderPal(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); PAL_SEL = Math.max(PAL_SEL - 1, 0); renderPal(); }
  else if (e.key === 'Enter') { if (!e.isComposing) { e.preventDefault(); palRun(PAL_SEL); } }

/* 전역 단축키 · 입력 중에는 숫자 전환이 끼어들지 않게 막는다 */

  const tag = (document.activeElement && document.activeElement.tagName) || '';

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); PAL_OPEN ? closePal() : openPal(); return; }
  if (PAL_OPEN) return;
  if (e.key === 'Escape') { closeDrawer(); return; }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); openPal(); return; }          // 검색 관습
  const n = Number(e.key);
  if (n >= 1 && n <= NAV.length) { e.preventDefault(); go(NAV[n - 1].key); }
