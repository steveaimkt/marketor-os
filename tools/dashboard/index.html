/**
 * 산출물을 "문서처럼" 보여 준다 (2026-08-03 지시)
 * md 를 그대로 흘려 두면 제목·표·숫자가 한 덩어리로 보인다. 읽는 순서를 만들어 준다:
 *   ① 무엇을 담은 문서인지 한 줄  ② 섹션 목차 (누르면 이동)  ③ 눈에 띄는 수치 3개  ④ 본문
 * 없는 것은 지어내지 않고 그 자리를 비운다.
 */
function docOutline(mdText) {
  const lines = String(mdText || '').split('\n');
  const heads = [];
  for (const l of lines) {
    const m = l.match(/^(#{1,3})\s+(.+?)\s*$/);
    if (m && m[2].length <= 40) heads.push({ level: m[1].length, text: m[2].replace(/[*`]/g, '') });
  }
  return heads.slice(0, 12);
}
/** 문서에서 눈에 띄는 수치 (지어내지 않고 본문에 실제로 있는 것만) */
function docNumbers(mdText) {
  const hits = [];
  const re = /([^\n|]{0,26}?)\s*[:：]?\s*(\d[\d,]*(?:\.\d+)?\s*(?:%|배|건|명|원|개|회|점|일|시간|만|억))/g;
  for (const m of String(mdText || '').matchAll(re)) {
    const label = m[1].replace(/[*#>|-]/g, '').trim();
    if (label.length < 2) continue;
    if (hits.some(h => h.value === m[2])) continue;
    hits.push({ label: label.slice(-14), value: m[2].replace(/\s+/g, '') });
    if (hits.length >= 3) break;
  }
  return hits;
}
/**
 * "- **라벨**: 값" 이 세 줄 넘게 이어지면 그건 목록이 아니라 **표**다 (2026-08-03)
 * 불렛으로 흘려 두면 눈이 라벨을 못 잡는다. 왼쪽 라벨·오른쪽 값 2열로 세운다.
 */
const DEF_LINE = /^\s*[-*·]\s+(?:\*\*)?([^*:：\n]{1,22})(?:\*\*)?\s*[:：]\s*(.+)$/;
function docBody(md) {
  const lines = String(md || '').split('\n');
  const out = [];
  let buf = [];                                   // 일반 마크다운 조각
  const flush = () => { if (buf.length) { out.push(mdHtml(buf.join('\n'))); buf = []; } };
  for (let i = 0; i < lines.length; i++) {
    if (DEF_LINE.test(lines[i])) {
      const rows = [];
      while (i < lines.length && DEF_LINE.test(lines[i])) { const m = lines[i++].match(DEF_LINE); rows.push([m[1].trim(), m[2].trim()]); }
      i--;
      if (rows.length >= 3) {
        flush();
        out.push(`<div style="border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:9px 0">
          ${rows.map(([k, v], n) => `<div style="display:flex;gap:12px;padding:7px 11px;${n ? 'border-top:1px solid var(--line)' : ''}">
            <span style="flex:none;width:96px;font-size:12.5px;font-weight:700;color:var(--olive)">${esc(k)}</span>
            <span style="flex:1;min-width:0;font-size:13.5px;line-height:1.65">${mdHtml(v).replace(/^<p>|<\/p>$/g, '')}</span></div>`).join('')}
        </div>`);
      } else buf.push(...rows.map(([k, v]) => `- **${k}**: ${v}`));
      continue;
    }
    buf.push(lines[i]);
  }
  flush();
  return out.join('');
}
function docView(mdText, rel) {
  const clean = String(mdText || '').replace(/^---\n[\s\S]*?\n---\n/, '');
  const outline = docOutline(clean);
  const nums = docNumbers(clean);
  const first = clean.split('\n').map(x => x.trim())
    .find(x => x && !/^[#>|*-]/.test(x) && x.length > 10) || '';
  docView._i = -1;
  return `${outline.length > 2 ? `<div style="position:sticky;top:0;z-index:2;background:var(--card);padding:2px 0 8px;margin-bottom:2px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap">

async function confirmDone(id) {

/* ══ 마무리 분류 · 문서가 나온 뒤 갈 곳 (2026-08-03 · 전략 1단계) ═══════════
   실측: 94건 중 보관된 건 3건뿐이었다. 문서가 나와도 끝맺을 자리가 없어서다.
   여기서 두 가지를 받는다. 둘 다 자동화 판정의 근거가 된다.

     ① 이 문서 실제로 썼나  · 반복 횟수만 세면 테스트성 업무가 후보로 올라온다
     ② 앞으로 어떻게 할까   · 반복 안 함 / 스킬로 굳히기 / 자동화

   ②에 "스킬로 굳히기" 가 따로 있는 이유: 반복 업무의 스킬 사용률이 0~38% 였다.
   절차가 안 굳은 것을 자동화하면 제각각인 산출물을 매일 찍어낸다.  */
const AUTO_KO = { none: '반복 안 함', skill: '스킬로 굳히는 중', auto: '자동화 대상' };
function outcomeBlock(t) {
  if (t.status !== 'done' || needsApproval(t)) return '';
  const hasOut = !!(t.outputFile || (t.outputFiles || []).length);
  if (!hasOut) return '';
  /* 사람이 안 눌러도 데이터가 남는다 (2026-08-03 · 검토 의견 1).
     승인 버튼은 42건 중 29건이 안 눌렸다. 버튼을 하나 더 늘리면 그것도 안 눌린다.
     그래서 시스템이 먼저 찍어 두고 사람은 틀렸을 때만 뒤집는다.
     ⚠️ 추정은 저장하지 않는다 · 회색으로 "…로 봤습니다" 라고만 말한다.
        사람이 고른 값은 진하게 · 둘을 눈으로 구분할 수 있어야 한다. */
  const gs = t.guess || {};
  const aNow = t.automation || gs.automation || 'none';
  const uNow = t.used === null || t.used === undefined ? gs.used : t.used;
  const mine = !!t.automation;                       // 사람이 직접 고른 값인가
  const pick = (label, sub, kind) => `<button class="${aNow === kind ? 'b' : 'b-g'}" style="font-size:12.5px;padding:7px 12px;text-align:left;${aNow === kind && !mine ? 'opacity:.62' : ''}"
    onclick="setOutcome('${esc(t.id)}','${kind}')"><b>${label}</b><span style="opacity:.7;margin-left:6px">${sub}</span></button>`;
  const usedMine = t.used === true || t.used === false;
  const usedBtn = (label, v) => `<button class="${uNow === v ? 'b' : 'b-g'} b-s" style="font-size:12px;padding:4px 11px;${uNow === v && !usedMine ? 'opacity:.62' : ''}"
    onclick="setUsed('${esc(t.id)}',${v})">${label}</button>`;
  return `<div style="border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--card);margin-top:11px">
    <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:9px;flex-wrap:wrap">

      <span style="font-size:12px;color:var(--olive)">${mine
        ? `${AUTO_KO[t.automation]} 로 정해 두셨습니다`
        : `${AUTO_KO[aNow]} 으로 봤습니다${gs.autoWhy ? ` · ${esc(gs.autoWhy)}` : ''} · 다르면 눌러 고쳐 주세요`}</span></div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
      <span style="font-size:12.5px;color:var(--ink-muted)">이 문서 실제로 쓰셨나요?</span>
      ${usedBtn('썼습니다', true)}${usedBtn('안 썼습니다', false)}
      <span style="font-size:11.5px;color:var(--olive)">${usedMine ? '' : (gs.usedWhy ? `${esc(gs.usedWhy)} 이라 그렇게 봤습니다` : '아직 알 수 없습니다')}</span></div>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      ${pick('반복 안 함', '· 보관합니다', 'none')}

 * 붙여넣을 한 줄을 클립보드에 담아 두고 IDE 를 연다.

/* ── 드로어 ─────────────────────────────────────────────────────────── */
function closeDrawer() { $('#drawerBg').style.display = 'none'; $('#drawer').style.display = 'none'; logOpenId = null; }
const DRAWER_W = { min: 420, def: 680 };
function drawerWidth(px) {
  const w = Math.max(DRAWER_W.min, Math.min(Math.round(px), window.innerWidth - 120));
  const el = $('#drawer'); if (el) el.style.width = w + 'px';
  try { localStorage.setItem('mos.drawerW', String(w)); } catch {}
}
function showDrawer(title, html) {
  $('#dTitle').innerHTML = title; $('#dBody').innerHTML = html;
  $('#drawerBg').style.display = 'block'; $('#drawer').style.display = 'flex';
  let saved = 0; try { saved = Number(localStorage.getItem('mos.drawerW')) || 0; } catch {}
  drawerWidth(saved || Math.min(DRAWER_W.def, window.innerWidth * 0.96));
}
/** 왼쪽 손잡이를 끌어 폭 조절 · 더블클릭이면 기본 폭으로 */
function initDrawerResize() {
  const grip = document.getElementById('drawerGrip'); if (!grip) return;
  const move = (e) => drawerWidth(window.innerWidth - (e.touches ? e.touches[0].clientX : e.clientX));
  const stop = () => {
    document.body.classList.remove('dragging'); grip.classList.remove('on');
    window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop);
    window.removeEventListener('touchmove', move); window.removeEventListener('touchend', stop);
  };
  const start = (e) => {
    e.preventDefault(); document.body.classList.add('dragging'); grip.classList.add('on');
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', stop);
    window.addEventListener('touchmove', move, { passive: false }); window.addEventListener('touchend', stop);
  };
  grip.addEventListener('mousedown', start);
  grip.addEventListener('touchstart', start, { passive: false });
  grip.addEventListener('dblclick', () => drawerWidth(DRAWER_W.def));
}

/* ══ 업무 보고 · TEAM 루프로 (2026-08-03 지시) ═══════════════════════════
   T 방향(사람이 무엇을·왜) → E 실행(담당이 절차대로) → A 검수(내보내기 전 확인)

/**

 * 실제 보고에 쓰인 머리말은 완료 34 · 요청 18 · 사람 몫 18 · 판정 10 · 한계 3 …로 제각각이었다.
 * 화면에는 **핵심 · 한계 · 사람 몫 · 다음 제안** 넷만 이 순서로 세우고,
 * 내부 처리 문구(요청·판정·라우팅·완료 경로)는 접어 둔다 (지어내지 않고 원문 그대로 옮긴다).
 */
const REPORT_DROP = /^\s*(요청|판정|라우팅|스모크 판정|판정·완수 요약|완료|로그 기록 요청|게이트|점수)\s*[:：]?\s*$|^\s*(요청|판정|라우팅|완료|로그 기록 요청)\s*[:：]/;
const REPORT_PICK = [
  [/^\s*[-*·]?\s*\**\s*(핵심( ?3줄)?|세 줄 보고|요약)\s*\**\s*[:：]/, '핵심'],
  [/^\s*[-*·]?\s*\**\s*(한계|주의|가정)\s*\**\s*[:：]/, '한계·가정'],
  [/^\s*[-*·]?\s*\**\s*(사람 몫|사람몫)\s*\**\s*[:：]/, '사람 몫'],
  [/^\s*[-*·]?\s*\**\s*(다음 제안|제안|다음)\s*\**\s*[:：]/, '다음 제안'],
];
/**
 * 긴 문단 → 불렛 (2026-08-03 지시)
 * " · " 나 문장 끝으로 세 토막 이상 나뉘는 긴 문단은 눈으로 훑기 어렵다.
 * 토막을 그대로 불렛으로 세운다 (내용은 손대지 않고 줄만 나눈다).
 */
function bulletize(text, minLen = 110) {
  const raw = String(text || '').trim();
  if (raw.length < minLen) return null;
  let parts = raw.split(/\s+·\s+/).map(x => x.trim()).filter(Boolean);
  if (parts.length < 3) parts = raw.split(/(?<=[.。])\s+(?=[가-힣A-Za-z0-9])/).map(x => x.trim()).filter(Boolean);
  if (parts.length < 3) return null;
  return `<div style="display:flex;flex-direction:column;gap:3px">${parts.map(x => `<div style="display:flex;gap:7px">
    <span style="flex:none;color:var(--fade)">·</span><span style="flex:1;min-width:0">${mdHtml(x).replace(/^<p>|<\/p>$/g, '')}</span></div>`).join('')}</div>`;
}

function reportView(t) {
  const raw = String(t.resultSummary || '').trim();
  if (!raw) return '';
  const pick = {}, rest = [], inner = [];   // inner = 내부 처리 문구 (요청·판정·라우팅·완료 경로)
  for (const line of raw.split('\n')) {
    if (!line.trim()) continue;
    if (REPORT_DROP.test(line)) { inner.push(line); continue; }
    const hit = REPORT_PICK.find(([re]) => re.test(line));
    if (hit) { const body = line.replace(hit[0], '').trim(); (pick[hit[1]] = pick[hit[1]] || []).push(body); }
    else rest.push(line);
  }
  // "① … ② … ③ …" 처럼 한 줄에 이어 붙은 핵심은 번호 문단으로 끊어 준다 (2026-08-03 지시)
  const numbered = (txt) => {
    const parts = String(txt).split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])|(?:(?<=[.。])\s+)(?=\d[).]\s)/).map(x => x.trim()).filter(Boolean);
    if (parts.length < 2) return null;
    return `<div style="display:flex;flex-direction:column;gap:5px">${parts.map((x, i) => `<div style="display:flex;gap:7px">
      <span style="flex:none;width:16px;height:16px;border-radius:5px;background:var(--paper);border:1px solid var(--line);
        font-size:10.5px;font-weight:700;color:var(--olive);display:flex;align-items:center;justify-content:center;margin-top:3px">${i + 1}</span>
      <span style="flex:1;min-width:0">${mdHtml(x.replace(/^[①②③④⑤⑥⑦⑧⑨⑩]\s*|^\d[).]\s*/, '')).replace(/^<p>|<\/p>$/g, '')}</span></div>`).join('')}</div>`;
  };
  const order = ['핵심', '한계·가정', '사람 몫', '다음 제안'];
  const rows = order.filter(k => pick[k] && pick[k].length).map(k => `<div style="display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)">
    <span style="flex:none;width:64px;font-size:12px;font-weight:700;color:var(--olive);padding-top:2px">${k}</span>
    <span style="flex:1;min-width:0;font-size:13.5px;line-height:1.7">${(k === '핵심' && numbered(pick[k].join(' ')))
      || bulletize(pick[k].join(' ')) || mdHtml(pick[k].join('\n')).replace(/^<p>|<\/p>$/g, '')}</span></div>`).join('');
  const restTxt = rest.join('\n').trim(), innerTxt = inner.join('\n').trim();
  const fold = (label, txt) => txt ? `<details style="margin-top:8px"><summary style="cursor:pointer;list-style:none;font-size:12px;color:var(--olive)">${label} ⌄</summary>
    <div style="font-size:13px;line-height:1.7;margin-top:6px;color:var(--ink-muted)">${mdHtml(txt)}</div></details>` : '';
  if (!rows) return `<div style="font-size:13.5px;line-height:1.7">${bulletize(restTxt, 160) || mdHtml(restTxt)}</div>${fold('처리 기록', innerTxt)}`;
  return rows + fold('보고 원문', [restTxt, innerTxt].filter(Boolean).join('\n'));
}

/**
 * M · 축적 · 이 업무에서 배운 것이 팀 규칙으로 남는가 (TEAM 루프의 마지막 칸)
 * 규칙은 다음 지시부터 그 팀 모든 업무 프롬프트에 자동으로 붙는다.
 */
function memoryStep(t) {
  const dept = deptOf(t.target) || '전사';
  const rules = ((CFG && CFG.teamRules) || {})[dept] || [];
  const saved = taskHasRule(t.id);
  return `${loopHead('M', '축적', '· 배운 것을 규칙으로')}
  <div style="border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--card);display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    ${saved
      ? `<span style="font-size:13.5px;color:${TINT.live.fg};font-weight:600;flex:1;min-width:180px">✓ 이 업무의 피드백이 ${esc(dept)} 규칙으로 남았습니다</span>`
      : `<span style="font-size:13px;color:var(--olive);flex:1;min-width:180px">같은 지적을 다음에 또 하지 않으려면, 이번에 느낀 점을 ${esc(dept)} 규칙으로 남겨 두세요</span>

function nextStep(t, files) {
  if (t.status === 'running')
    return `${loopHead('A', '검수', '· 내보내기 전 확인')}<div style="display:flex;gap:8px;align-items:center">
      <span style="font-size:13.5px;color:var(--olive)">지금 돌고 있습니다 · 끝나면 여기서 이어서 시키실 수 있습니다</span>
      <button class="b-g b-s" style="margin-left:auto" onclick="stopTaskUi('${esc(t.id)}')">중단</button></div>`;

  const wait = needsApproval(t);
  const hasOut = !!(t.outputFile || (files || []).length);
  const prime = t.outputFile || ((files || [])[0] || {}).rel || '';
  /* 완료 전과 완료 후에 할 일이 다르다 (2026-08-03 지시).
     완료 전 · 이 업무 안에서 끝낸다 → 확인 완료, 아니면 고칠 점을 적어 같은 담당에게 다시.
     완료 후 · 대시보드는 여기까지다 → 그 문서를 들고 클로드 코드로 간다. */
  const main = wait
    ? `<button class="b" style="padding:10px 20px;background:var(--highlight);color:var(--ink);border-color:var(--ink)"
        onclick="confirmDone('${esc(t.id)}')" title="봤고 됐다는 표시입니다. 새로 시키는 것은 없고 돈도 들지 않습니다">확인 완료</button>`
    : [
        hasOut ? `<button class="b" style="padding:10px 20px" onclick="openInCode('${esc(t.id)}')"
          title="이 문서를 파트너사에서 엽니다 · 붙여넣을 한 줄이 클립보드에 담깁니다">파트너사에서 열기</button>` : '',
        (t.status === 'done' && hasOut && !t.publishedAt)
          ? `<button class="b-g" style="padding:10px 18px" onclick="markPublishedUi('${esc(t.id)}')"
              title="실제로 올리신 뒤 눌러 주세요 · 시스템이 발행했다고 지어내지 않습니다">올렸다고 표시</button>` : '',
      ].join('');
  const done = t.publishedAt
    ? `<span style="font-size:13px;color:${TINT.live.fg};font-weight:600">✓ ${esc(hhmm(t.publishedAt))} 올림${t.publishedUrl ? ` · <a href="${esc(t.publishedUrl)}" target="_blank" style="color:inherit">열기</a>` : ''}</span>` : '';

  const more = [
    hasOut ? ['완성문 복사', `copyFinal('${esc(prime)}')`] : null,
    ['같은 지시 다시', `rerunTask('${esc(t.id)}')`],
    // 승인 항목대로 실제 실행까지 시키는 경우 · 드물어서 주 버튼에서 내렸다 (새 업무가 한 건 돈다)
    wait ? ['승인 내용대로 실행시키기', `approveTask('${esc(t.id)}')`] : null,
    (t.status === 'done' && hasOut && t.publishedAt) ? ['올림 표시 다시', `markPublishedUi('${esc(t.id)}')`] : null,
    t.archivedAt ? ['보관에서 되돌리기', `restoreTaskUi('${esc(t.id)}')`] : ['이 업무 취소·보관', `cancelTaskUi('${esc(t.id)}')`],
  ].filter(Boolean);

  return `${loopHead('A', '검수', '· 내보내기 전 확인', wait)}
  ${wait ? `<div style="padding:11px 13px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--highlight);border-radius:9px">
    ${t.approvals.map(a => `<div style="font-size:14px">${esc(a)}</div>`).join('')}</div>` : ''}
  <div style="border:1px solid var(--line);border-radius:11px;padding:13px 14px;background:var(--card)">
    ${main || done ? `<div style="display:flex;gap:10px;align-items:center;margin-bottom:11px;flex-wrap:wrap">${main}${done}
      <span style="font-size:12px;color:var(--olive)">${wait
        ? '또는 고칠 점을 아래에 적으시면 같은 담당이 고쳐서 다시 올립니다'
        : (hasOut ? '문서가 나왔으면 여기까지입니다 · 다음 작업은 이 문서를 들고 클로드 코드에서 이어가세요' : '')}</span></div>` : ''}
    <textarea id="nextText" rows="2" placeholder="${wait ? '고칠 점을 적으시면 수정 요청으로 나갑니다 · 예: 후크가 약해요' : '이 안에서 더 시킬 게 있으면 적으세요 · 큰 후속은 클로드 코드가 낫습니다'}"
      onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey)){event.preventDefault();sendNext('${esc(t.id)}')}"
      style="width:100%;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:10px 12px;font-family:inherit;font-size:14px;line-height:1.6;resize:vertical;outline:none;color:var(--ink)"></textarea>
    <div style="display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center">
      <button class="b-g b-s" onclick="sendNext('${esc(t.id)}')">이어서 시키기</button>
      ${NEXT_HINTS.map(h => `<span onclick="fillNext(${JSON.stringify(h[1]).replace(/"/g, '&quot;')})"
        style="font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--ink-muted)">${h[0]}</span>`).join('')}
      <span style="margin-left:auto;font-size:11.5px;color:var(--olive)">⌘+Enter · 발행은 하지 않습니다</span></div>
    <details style="margin-top:10px">
      <summary style="cursor:pointer;list-style:none;font-size:12.5px;color:var(--olive)">그 외 ⌄</summary>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        ${more.map(([l, on]) => `<button class="b-g b-s" style="font-size:12px;padding:5px 10px" onclick="${on}">${l}</button>`).join('')}
      </div></details>
  </div>
  ${outcomeBlock(t)}`;
}

function openTask(id) {
  const t = TASKS.find(x => x.id === id); if (!t) return;
  logOpenId = id; logBuf = ''; logOff = 0;
  const [label, color] = TASK_STATE[t.status] || ['대기', 'var(--olive)'];
  const dur = t.endedAt ? Math.max(1, Math.round((t.endedAt - t.startedAt) / 1000)) : null;
  const durKo = dur == null ? null : dur < 90 ? dur + '초' : Math.round(dur / 60) + '분';
  const files = (t.outputFiles && t.outputFiles.length) ? t.outputFiles : (t.outputFile ? [{ rel: t.outputFile, size: null }] : []);
  /* ⚠️ 2026-08-04 수리 · "크게" 가 안 열렸다.
     onclick 문자열 안에 f.rel 을 그대로 두어, 클릭 시점에 브라우저가 f 를 찾다가
     ReferenceError 로 죽었다 (f 는 렌더 때만 있는 값이다).
     그래서 어느 주소로 열지는 **렌더 시점에** 정해 문자열로 굳힌다. */
  const fileRow = (f) => {
    const reader = /\.(md|markdown|txt|log)$/i.test(f.rel);
    const big = `/api/output/${reader ? 'view' : 'raw'}?t=${esc(TOKEN)}&path=${encodeURIComponent(f.rel)}`;
    return `<div onclick="previewOutput('${esc(f.rel)}')" class="row-hover" style="display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--card)">
      <span style="flex:none">${/\.html$/i.test(f.rel) ? '🌐' : '📄'}</span>
      <span style="flex:1;min-width:0"><span class="ell" style="display:block;font-size:14px;font-weight:600">${esc(fileLabel(f.rel))}</span>
        <span class="ell" style="display:block;font-size:12px;color:var(--olive)" title="${esc(f.rel)}">${esc(outPathKo(f.rel))}</span></span>
      ${f.size ? `<span class="mono" style="flex:none;font-size:12px;color:var(--olive)">${(f.size / 1024).toFixed(1)}KB</span>` : ''}
      <span onclick="event.stopPropagation();window.open('${big}','_blank')" style="flex:none;font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer">크게</span>
      ${f.rel === t.outputFile ? '<span style="flex:none;font-size:11.5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink-muted)">대표</span>' : ''}</div>`;
  };
  showDrawer(esc(empName(t.target)) + ' · 업무 보고', `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      ${statusPill(t, 13)}
      ${t.goal
        ? `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--sand-bg);border:1px solid var(--sand-line);color:var(--sand-text);border-radius:999px;padding:2px 10px">목표 · ${esc(t.goal)}</span>`
        : (goalOpts().length ? `<span onclick="toggleGoalPick('${esc(t.id)}')" style="font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer">목표 붙이기</span>
           <span id="goalPick" style="display:none;gap:5px;flex-wrap:wrap"></span>` : '')}
      <span style="display:inline-flex;align-items:center;gap:6px">${pillarBadge(t.pillar, 13) || '<span style="font-size:13px;color:var(--fade)">방향 없음</span>'}
        <span onclick="togglePillarPick('${esc(t.id)}')" style="font-size:12px;color:var(--olive);text-decoration:underline;cursor:pointer">바꾸기</span></span>
      <span id="pillarPick" style="display:none;gap:5px;flex-wrap:wrap"></span>
      <span style="font-size:13px;color:var(--olive)">${esc(hhmm(t.startedAt))} 시작${durKo ? ' · ' + esc(durKo) + ' 걸림' : ''}${t.cost != null ? ' · ' + esc(money(t.cost)) : ''}${t.turns != null ? ' · 주고받음 ' + t.turns + '회' : ''}</span>
    </div>
    ${t.error ? `<div style="color:var(--warn);margin-top:8px;font-size:14px">${esc(t.error)}</div>` : ''}
    ${(t.parentId && parentOf(t)) ? `<div style="margin-top:9px;font-size:13.5px;color:var(--olive)">↩ 앞 업무에서 이어진 후속입니다 · <span onclick="openTask('${esc(t.parentId)}')" style="text-decoration:underline;cursor:pointer">앞 업무 보기</span></div>` : ''}
    ${childOf(t.id) ? `<div style="margin-top:9px;font-size:13.5px;color:var(--olive)">→ 이 업무에서 이어진 후속이 있습니다 · <span onclick="openTask('${esc(childOf(t.id).id)}')" style="text-decoration:underline;cursor:pointer">후속 업무 보기</span> ${statusPill(childOf(t.id))}</div>` : ''}
    ${(t.approvals && t.approvals.length) ? `<div style="margin-top:11px">${approvalStepper(t)}</div>` : ''}
    ${loopHead('T', '방향', '· 무엇을 · 왜')}
    <div class="logv" style="max-height:none;border:none;padding:0;background:transparent">${logHtml(softenText(t.prompt) || '(커맨드 실행)')}</div>

    ${loopHead('E', '실행', `· ${esc(empName(t.runnerAgent || t.target))}${durKo ? ' · ' + esc(durKo) : ''}${t.turns != null ? ' · 주고받음 ' + t.turns + '회' : ''}`)}
    ${files.length ? `<div style="display:flex;flex-direction:column;gap:6px">${files.map(fileRow).join('')}</div>
      <div style="font-size:12px;color:var(--olive);margin-top:5px">누르면 아래에서 미리 봅니다${t.declaredOutputs
        ? ` · 이 업무가 밝힌 산출물 ${t.declaredOutputs}개${t.windowFiles ? ` (같은 시간에 생긴 다른 파일 ${t.windowFiles}개는 뺐습니다)` : ''}`
        : ' · 이 업무가 파일 경로를 밝히지 않아 같은 시간에 생긴 파일을 보여 드립니다'}</div>
      <div id="outPreview" style="margin-top:10px"></div>`
      : `<div style="font-size:13.5px;color:var(--olive)">${t.status === 'done' ? '파일로 남긴 산출물이 없습니다 (답변만 한 업무)' : '아직 산출물이 없습니다'}</div>`}
    ${t.resultSummary ? `<div style="border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--paper);margin-top:10px;max-height:${String(t.resultSummary).length > 1800 ? '26vh' : '38vh'};overflow:auto">${reportView(t)}</div>` : ''}
    <details style="margin-top:10px"><summary style="cursor:pointer;list-style:none;font-size:12.5px;color:var(--olive)">진행 과정 보기 ⌄ <span style="font-size:11.5px">· 보고와 겹치는 끝부분은 뺍니다</span></summary>
      <div class="logv" id="taskLog" style="margin-top:8px">불러오는 중 잠시만요</div></details>
    ${t.status === 'running' ? '<div class="logv" id="taskLogLive" style="margin-top:10px;max-height:34vh">돌아가는 중 로그 불러오는 중</div>' : ''}

    ${nextStep(t, files)}
    ${memoryStep(t)}`);
  pollLog();
  const prime = (t.outputFile || (files[0] && files[0].rel));
  if (prime) previewOutput(prime);
}

/**
 * 로그 끝부분은 마지막 보고와 글자 그대로 같다 (실측 6건 중 5건 · 2026-08-03).
 * 두 번 읽게 하지 않으려고, 보고와 겹치는 꼬리를 잘라내고 진행 과정만 남긴다.
 */
function trimEchoedSummary(log, summary) {
  const sum = String(summary || '').trim();
  if (!sum || sum.length < 60) return { text: log, cut: 0 };
  for (let n = Math.min(sum.length, 6000); n >= 60; n -= 40) {
    const i = log.lastIndexOf(sum.slice(0, n));
    if (i > 0) return { text: log.slice(0, i).trimEnd(), cut: log.length - i };
  }
  return { text: log, cut: 0 };
}

/**
 * 실행 로그 → 읽을 수 있는 화면 (2026-08-03)
 * 원문은 고정폭 한 덩어리라 [목표]·[현재 편성] 같은 구조가 안 보였다.
 * 여기서는 구획을 살리고 슬러그를 한글 이름으로 바꿔 준다. 원문 자체는 건드리지 않는다.
 */
// 같은 것을 orchestrator·오케스트레이터·트루먼 셋으로 부르던 순환을 여기서 끊는다 (2026-08-03)
const ALIAS_KO = { 'orchestrator': '트루먼', 'marketing-os-orchestrator': '트루먼', 'truman': '트루먼' };
let _koRe = null, _koMap = null;
function agentKoRe() {
  const names = ((STRUCT && STRUCT.agents) || []).map(a => a.name).filter(n => /^[a-z0-9-]{3,}$/.test(n));
  const key = names.length + ':' + (names[0] || '');
  if (_koRe && _koRe.key === key) return _koRe;
  _koMap = new Map(names.map(n => [n, ALIAS_KO[n] || empName(n)]));
  for (const [k, v] of Object.entries(ALIAS_KO)) if (!_koMap.has(k)) { _koMap.set(k, v); names.push(k); }
  const re = names.length ? new RegExp('(?<![\\w-])(' + names.sort((a, b) => b.length - a.length).join('|') + ')(?![\\w-])', 'g') : null;
  _koRe = { key, re }; return _koRe;
}
function koSlugs(line) {
  const { re } = agentKoRe();
  return re ? line.replace(re, (m) => `<span class="tag" title="${m}">${_koMap.get(m) || m}</span>`) : line;
}
/**

 * 기록 파일은 그대로 두고 **보여 줄 때만** 다듬는다 (결과 보고에는 적용하지 않는다).

const SOFTEN = [
  [/하지 말고/g, '하지 않고'], [/하지 마라/g, '하지 않습니다'], [/지 마라/g, '지 않습니다'],
  [/묻지 말고/g, '되묻지 않고'], [/해라/g, '해 주세요'], [/하라(?=[\s.·,)]|$)/g, '해 주세요'],
  [/써라/g, '써 주세요'], [/세라(?=[\s.·,)\]]|$)/g, '세어 주세요'], [/따라라/g, '따라 주세요'],
  [/올려라/g, '올려 주세요'], [/적어라/g, '적어 주세요'], [/밝혀라/g, '밝혀 주세요'],
  [/남겨라/g, '남겨 주세요'], [/골라라/g, '골라 주세요'], [/세워라/g, '세워 주세요'],
  [/보내라/g, '보내 주세요'], [/내라(?=[\s.·,)]|$)/g, '내 주세요'], [/만들어라/g, '만들어 주세요'],
  [/붙여라/g, '붙여 주세요'], [/넣어라/g, '넣어 주세요'], [/뽑아라/g, '뽑아 주세요'],
  [/받아라/g, '받아 주세요'], [/좁혀라/g, '좁혀 주세요'], [/출력해라/g, '출력해 주세요'],
  [/마라(?=[\s.·,)]|$)/g, '않습니다'],
  // 평서 종결 "~이다/~다" 도 화면에서는 존댓말로 (2026-08-03 · "수정 요청이다" 지적)
  [/([가-힣])이다(?=[\s.·,)\]]|$)/g, '$1입니다'], [/아니다(?=[\s.·,)\]]|$)/g, '아닙니다'],
  [/(테스트|지시|요청|업무|작업|초안|사유|판정|결과)다(?=[\s.·,)\]]|$)/g, '$1입니다'],
  [/것이다(?=[\s.·,)\]]|$)/g, '것입니다'], [/뿐이다(?=[\s.·,)\]]|$)/g, '뿐입니다'],
  [/지 말고/g, '지 않고'], [/까지다(?=[\s.·,)\]]|$)/g, '까지입니다'],
  [/않는다(?=[\s.·,)\]]|$)/g, '않습니다'], [/([가-힣])한다(?=[\s.·,)\]]|$)/g, '$1합니다'],
  [/([가-힣])된다(?=[\s.·,)\]]|$)/g, '$1됩니다'], [/([가-힣])있다(?=[\s.·,)\]]|$)/g, '$1있습니다'],
];
function softenText(s) { return SOFTEN.reduce((a, [re, to]) => a.replace(re, to), String(s || '')); }

function logHtml(src) {
  const lines = String(src || '').split('\n');
  const out = [];
  // 표(| a | b |)와 인용(>)은 글자로 흩어 놓으면 못 읽는다 · 블록으로 모아 마크다운 렌더에 넘긴다
  const isTable = (x) => /^\s*\|.*\|\s*$/.test(x);
  const isQuote = (x) => /^\s*>\s?/.test(x);
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    if (isTable(raw)) {
      const block = [];
      while (i < lines.length && isTable(lines[i])) block.push(lines[i++].trim());
      i--;
      out.push(`<div style="overflow-x:auto;margin:6px 0">${mdHtml(block.join('\n'))}</div>`);
      continue;
    }
    if (isQuote(raw)) {
      const block = [];
      while (i < lines.length && (isQuote(lines[i]) || (block.length && !lines[i].trim()))) {
        if (!lines[i].trim()) { i++; break; }
        block.push(lines[i++].replace(/^\s*>\s?/, ''));
      }
      i--;
      out.push(`<div style="border-left:3px solid var(--sand);padding:2px 0 2px 10px;margin:5px 0;color:var(--ink-muted);font-size:13px;line-height:1.65">${mdHtml(block.join('\n'))}</div>`);
      continue;
    }
    if (!raw.trim()) { out.push('<div class="lg-gap"></div>'); continue; }
    let l = esc(raw).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, (m, c) => `<span class="tag">${_koMap && _koMap.get(c) || c}</span>`);
    l = linkifyEscaped(koSlugs(l));
    if (/^▶/.test(raw)) {
      const m = raw.replace(/^▶\s*/, '').split(/\s+·\s+/);
      const who = (_koMap && _koMap.get(m[0].trim())) || (typeof empName === 'function' ? empName(m[0].trim()) : m[0]);
      const desc = m.slice(1).join(' · ').slice(0, 90);
      out.push(`<div class="lg-head">${esc(who)}${desc ? `<span class="lg-dim" style="font-weight:400;margin-left:8px">${esc(desc)}</span>` : ''}</div>`);
      continue; }
    if (/^#{1,4}\s/.test(raw)) { out.push(`<div class="lg-head">${l.replace(/^#{1,4}\s*/, '')}</div>`); continue; }
    const sec = raw.match(/^\s*\[([^\]]{1,40})\]\s?(.*)$/);
    if (sec) { const body = linkifyEscaped(koSlugs(esc(sec[2]).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')));
      out.push(`<div class="lg-sec"><span class="lg-key">${esc(sec[1])}</span><span>${body}</span></div>`); continue; }
    if (/^\s*(요청|보고|결과|배분|완료)\s*:/.test(raw)) { out.push(`<div class="lg-sec"><span class="lg-key">${l.split(':')[0].trim()}</span><span>${l.slice(l.indexOf(':') + 1)}</span></div>`); continue; }
    if (/^\s*[-·*]\s/.test(raw)) { out.push(`<div class="lg-li">${l.replace(/^\s*[-·*]\s*/, '')}</div>`); continue; }
    if (/^\s{2,}\S/.test(raw)) { out.push(`<div class="lg-l lg-dim">${l}</div>`); continue; }
    out.push(`<div class="lg-l">${l}</div>`);
  }
  return out.join('') || '<div class="lg-dim">아직 출력이 없습니다</div>';
}

/**
 * 마크다운 → HTML 미니 렌더러 (의존성 0).
 * 원문을 전부 이스케이프한 뒤에만 변환하므로 산출물 안의 스크립트가 실행될 수 없다.
 */
function mdHtml(src) {
  const lines = String(src).split('\n');
  const out = []; let inCode = false, inList = null, inTable = false;
  const closeList = () => { if (inList) { out.push(inList === 'ol' ? '</ol>' : '</ul>'); inList = null; } };
  const closeTable = () => { if (inTable) { out.push('</table></div>'); inTable = false; } };
  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, '<code style="background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:.92em">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="text-decoration:underline">$1</a>');
  for (const raw of lines) {
    if (/^\s*```/.test(raw)) { closeList(); closeTable(); inCode = !inCode; out.push(inCode ? '<pre class="log" style="margin:8px 0">' : '</pre>'); continue; }
    if (inCode) { out.push(esc(raw) + '\n'); continue; }
    const l = raw;
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { closeList(); closeTable(); const n = h[1].length;
      out.push(`<h${Math.min(n, 3)} data-md-h="${n}" style="font-size:${[19,17,15.5,14.5][n-1]}px;font-weight:700;margin:${n===1?'18px':'14px'} 0 6px">${inline(h[2])}</h${Math.min(n, 3)}>`); continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { closeList(); closeTable(); out.push('<hr style="border:none;border-top:1px solid var(--line);margin:12px 0">'); continue; }
    if (/^\s*\|.*\|\s*$/.test(l)) {
      closeList();
      if (/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue;  // 구분선 행은 버린다
      const cells = l.trim().replace(/^\||\|$/g, '').split('|');
      if (!inTable) { out.push('<div style="overflow-x:auto;margin:8px 0"><table style="border-collapse:collapse;font-size:13.5px;min-width:50%">'); inTable = true;
        out.push('<tr>' + cells.map(c => `<th style="border:1px solid var(--line);padding:6px 10px;text-align:left;background:var(--paper)">${inline(c.trim())}</th>`).join('') + '</tr>'); }
      else out.push('<tr>' + cells.map(c => `<td style="border:1px solid var(--line);padding:6px 10px;vertical-align:top">${inline(c.trim())}</td>`).join('') + '</tr>');
      continue;
    }
    closeTable();
    const li = l.match(/^\s*[-*]\s+(.*)/), oli = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (li || oli) { const want = oli ? 'ol' : 'ul';
      if (inList !== want) { closeList(); out.push(want === 'ol' ? '<ol style="margin:6px 0 6px 22px">' : '<ul style="margin:6px 0 6px 20px">'); inList = want; }
      out.push(`<li style="margin:3px 0;line-height:1.6">${inline((li || oli)[1])}</li>`); continue; }
    closeList();
    const q = l.match(/^\s*>\s?(.*)/);
    if (q) { out.push(`<div style="border-left:3px solid var(--sand);padding:2px 12px;color:var(--ink-muted);margin:6px 0">${inline(q[1])}</div>`); continue; }
    if (!l.trim()) { out.push('<div style="height:7px"></div>'); continue; }
    out.push(`<div style="line-height:1.7">${inline(l)}</div>`);
  }
  closeList(); closeTable(); if (inCode) out.push('</pre>');
  // 보고·미리보기 본문에 박힌 경로도 눌러서 열 수 있게 (태그 안은 건드리지 않는다)
  return out.join('').split(/(<[^>]+>)/).map(seg => seg.startsWith('<') ? seg : linkifyEscaped(seg)).join('');
}

}
async function runCollect(target) {
  if (!confirm('지금 수집하면 에이전트가 도구를 읽어 옵니다.\n\n1분에서 3분 걸리고 비용이 $0.3에서 1 정도 듭니다. 계속할까요?')) return;
  const r = await api('/api/collect', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ target }) }).then(x => x.json()).catch(e => ({ error:String(e) }));
  if (r.error) return toast(r.error);
  COLLECTING[target] = true; render();
  toast('수집을 시작했습니다. 끝나면 화면이 채워집니다');
  loadCache(target, true);
}
async function saveConfig(patch, msg) {
  const r = await api('/api/config', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify(patch) }).then(x => x.json()).catch(e => ({ error:String(e) }));
  if (r.error) return toast(r.error);
  CFG = r.config; render(); if (msg) toast(msg);
}
async function toggleSkillUi(name, on) {
  const r = await api('/api/skills/toggle', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ name, on }) }).then(x => x.json()).catch(e => ({ error:String(e) }));
  if (r.error) return toast(r.error);
  if (CFG) CFG.skillsOff = r.skillsOff;
  render();
  if (document.getElementById('sklist')) renderSkillToggle(document.getElementById('skq')?.value || '');
  toast(on ? name + ' 켰습니다' : name + ' 껐습니다');
}

/** 수집 상태 줄 · 화면마다 같은 모양으로 */
function collectBar(target, label) {
  const c = CACHE[target], run = COLLECTING[target], err = COLLECT_ERR[target];
  const when = c && c.collectedAt ? new Date(c.collectedAt).toLocaleString('ko-KR') : null;
  return `<div style="display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--olive)">
    ${run ? '<span style="width:7px;height:7px;border-radius:50%;background:var(--ink);animation:pulse 1.5s infinite"></span>수집 중입니다. 1분에서 3분 걸립니다'
      : when ? '마지막 수집 ' + esc(when) : label + ' 수집을 아직 한 번도 안 했습니다'}
    ${err ? `<span style="color:var(--warn)">${esc(err.slice(0,80))}</span>` : ''}
    <button class="b-g b-s" style="margin-left:auto" onclick="runCollect('${target}')" ${run ? 'disabled' : ''}>${run ? '수집 중' : '지금 수집하기'}</button>
  </div>`;
}
/** 수집기가 남긴 note 를 그대로 보여 준다 (왜 비었는지) */
/**
 * 완료 알림 · 상태가 바뀐 순간을 폴링 차이로 잡는다.
 * 실측: 지시 소요 중앙값 13초, 최장 79초. 그 사이 화면을 떠나므로
 * 끝났을 때 브라우저 알림과 탭 제목으로 불러온다 (미션 컨트롤 패턴).
 * 첫 폴링은 기준만 잡고 알리지 않는다 (새로고침마다 울리면 소음이다).
 */
const TASK_SIG = {};
let SIG_READY = false;
function notifyChanges(list) {
  const canNotify = typeof Notification !== 'undefined' && Notification.permission === 'granted';
  for (const t of list) {
    const sig = t.status + (t.approvals && t.approvals.length ? ':승인' : '');
    const prev = TASK_SIG[t.id];
    TASK_SIG[t.id] = sig;
    if (!SIG_READY || prev === undefined || prev === sig) continue;
    let title = null;
    if (t.status === 'done') title = (t.approvals && t.approvals.length) ? '초안이 준비됐습니다. 승인이 필요합니다' : '끝났습니다';
    else if (t.status === 'error') title = '업무가 막혔습니다';
    if (!title) continue;
    const body = (t.prompt || t.target).slice(0, 60);
    if (canNotify) { try { new Notification(title, { body, tag: t.id }); } catch {} }
    toast(title + ' · ' + body.slice(0, 28));
  }
  SIG_READY = true;
}

async function pollTasks() {
  const r = await api('/api/tasks').then(x => x.json()).catch(() => null);
  if (r && r.tasks) {
    notifyChanges(r.tasks);
    const changed = JSON.stringify(r.tasks) !== JSON.stringify(TASKS);
    TASKS = r.tasks;
    if (changed) render();
  }
}
async function pollStatus() {
  const r = await api('/api/status').then(x => x.json()).catch(() => null);
  if (r && !r.error) { STATUS = r; render(); }
}

window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h) { S.tab = h; render(); } });
if (location.hash) S.tab = location.hash.slice(1);
render();
initDrawerResize();
loadStructure()
  .then(loadConfig).then(loadJobs).then(loadCandidates).then(() => loadConn(false))
  .then(() => Promise.all(['channels','schedule','meetings','brain','mail'].map(t => loadCache(t, true))))
  .then(() => { pollStatus(); pollTasks(); });
setInterval(pollStatus, 10000);
setInterval(pollTasks, 2500);
